  function useMode(pref) {
    const mq = useMemo(() => { try { return window.matchMedia('(prefers-color-scheme: dark)'); } catch (e) { return null; } }, []);
    const read = () => {
      if (pref !== 'system') return pref;
      const attr = document.documentElement.getAttribute('data-theme');
      if (attr === 'dark' || attr === 'light') return attr;
      return mq && mq.matches ? 'dark' : 'light';
    };
    const [mode, setMode] = useState(read);
    useEffect(() => {
      setMode(read());
      const h = () => setMode(read());
      if (mq) mq.addEventListener('change', h);
      const mo = new MutationObserver(h);
      mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      return () => { if (mq) mq.removeEventListener('change', h); mo.disconnect(); };
    }, [pref]);
    return mode;
  }

  function buildTheme(mode, compact) {
    const c = PALETTE[mode];
    return {

      hashed: false,
      algorithm: [mode === 'dark' ? theme.darkAlgorithm : theme.defaultAlgorithm].concat(compact ? [theme.compactAlgorithm] : []),
      token: {
        colorPrimary: c.primary, colorInfo: c.info, colorSuccess: c.success, colorWarning: c.warning, colorError: c.error,
        colorLink: c.primary, colorBgLayout: c.bg, colorBgContainer: c.surface, colorBgElevated: c.elevated,

        Menu: { itemBg: 'transparent', subMenuItemBg: 'transparent', itemSelectedBg: c.primarySoft, itemSelectedColor: c.primary, itemHoverBg: mode === 'dark' ? '#25232F' : '#F0EFF6', itemBorderRadius: 8, itemMarginInline: 8, groupTitleColor: c.text3, groupTitleFontSize: 11, iconSize: 16, collapsedIconSize: 18 },

  const ROUTE_OF = Object.fromEntries(NAV.flatMap(g => g.children).concat(NAV_FOOT).map(i => [i.key, i]));
  const TITLES = { tarefas: 'Tarefas', tarefa: 'Tarefa #711', hoje: 'Hoje', projetos: 'Projetos', identidade: 'Identidade visual' };
  const BUILT = ['tarefas', 'tarefa', 'hoje', 'projetos', 'identidade'];

  function toMenu(items, collapsed) {
    return items.map(it => it.type === 'group'
      ? { type: 'group', label: collapsed ? null : it.label, key: it.label, children: toMenu(it.children, collapsed) }
      : {
          key: it.key, icon: createElement(I[it.icon]), title: it.countTitle ? `${it.label} · ${it.countTitle}` : it.label,
          label: it.count || it.dot
            ? html`<${Flex} justify="space-between" align="center">${it.label}<${Tooltip} title=${it.countTitle} placement="right">${it.dot ? html`<${Badge} status="warning" />` : html`<${Badge} count=${it.count} size="small" color=${it.key === 'terminais' ? 'var(--ct-text-3)' : 'var(--ct-primary)'} />`}<//><//>`
            : it.label
        });
  }

  function useRoute() {
    const get = () => { const h = (location.hash || '').replace('#', ''); return BUILT.concat(['calendario', 'revisao', 'horizontes', 'rotulos', 'cadernos', 'dashboard', 'arquivo', 'ajustes']).includes(h) ? h : 'tarefas'; };
    const [route, setRoute] = useState(get);
    useEffect(() => { const h = () => setRoute(get()); window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h); }, []);
    const go = r => { try { location.hash = r; } catch (e) {} setRoute(r); };
    return [route, go];
  }

  function Shell() {
    const [themePref, setThemePref] = useState(() => { try { return localStorage.getItem('ct:theme') || 'system'; } catch (e) { return 'system'; } });
    const [compact, setCompact] = useState(false);
    const mode = useMode(themePref);
    useEffect(() => {
      try { localStorage.setItem('ct:theme', themePref); } catch (e) {}
      if (themePref === 'system') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', themePref);
    }, [themePref]);
    const cfg = useMemo(() => buildTheme(mode, compact), [mode, compact]);
    return html`<${ConfigProvider} theme=${cfg} componentSize=${compact ? 'small' : 'middle'}>
      <${AntApp} style=${{ height: '100%' }}>
        <${AppFrame} mode=${mode} themePref=${themePref} setThemePref=${setThemePref} compact=${compact} setCompact=${setCompact} />
      <//>
    <//>`;
  }

  function AppFrame({ mode, themePref, setThemePref, compact, setCompact }) {
    const screens = Grid.useBreakpoint();
    const isMobile = !screens.md;
    const [collapsed, setCollapsed] = useState(false);
    const [drawer, setDrawer] = useState(false);
    const [route, go] = useRoute();
    const [palette, setPalette] = useState(false);
    const [crash, setCrash] = useState(false);
    const [capture, setCapture] = useState('');
    const [term, setTerm] = useState(false);
    const { message } = AntApp.useApp();
    const autoCollapsed = !screens.lg;
    const isCollapsed = collapsed || autoCollapsed;

    useEffect(() => {
      const h = e => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setPalette(true); }
        if (e.ctrlKey && (e.key === "'" || e.code === 'Backquote')) { e.preventDefault(); setTerm(t => !t); }
      };
      window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
    }, []);
    useEffect(() => { setCrash(false); }, [route]);

    const navigate = key => {
      if (key === 'terminais') { setTerm(t => !t); return; }
      if (key === 'recolher') { setCollapsed(!collapsed); return; }
      go(key); setDrawer(false);
    };
    const footItems = narrow => toMenu(NAV_FOOT, narrow).concat(isMobile || autoCollapsed ? [] : [{
      key: 'recolher', icon: createElement(isCollapsed ? I.MenuUnfoldOutlined : I.MenuFoldOutlined),
      label: isCollapsed ? 'Expandir menu' : 'Recolher menu', title: isCollapsed ? 'Expandir menu' : 'Recolher menu'
    }]);
    const sideNav = narrow => html`<div className="ct-sider-inner">
      <div className="ct-sider-head" style=${{ justifyContent: narrow ? 'center' : 'flex-start', padding: narrow ? 0 : '0 20px' }}>
        ${narrow ? html`<span className="ct-logo-mini" aria-label="CrafyTask">C</span>` : html`<span className="ct-logo">CrafyTask</span>`}
      </div>
      <div style=${{ flex: 1, overflowY: 'auto', paddingTop: 8 }}>
        <${Menu} mode="inline" inlineCollapsed=${narrow} selectedKeys=${[route === 'tarefa' ? 'tarefas' : route]} items=${toMenu(NAV, narrow)} onClick=${e => navigate(e.key)} style=${{ borderInlineEnd: 0 }} />
      </div>
      <div className="ct-sider-foot">
        <${Menu} mode="inline" inlineCollapsed=${narrow} selectedKeys=${[route].concat(term ? ['terminais'] : [])} items=${footItems(narrow)} onClick=${e => navigate(e.key)} style=${{ borderInlineEnd: 0, padding: '6px 0' }} />
      </div>
    </div>`;

    const themeIcon = themePref === 'dark' ? I.MoonOutlined : themePref === 'light' ? I.SunOutlined : I.DesktopOutlined;
    const prefsMenu = {
      items: [
        { key: 'h1', type: 'group', label: 'Tema', children: [
          { key: 'system', icon: createElement(I.DesktopOutlined), label: 'Seguir o sistema' },
          { key: 'light', icon: createElement(I.SunOutlined), label: 'Claro' },
          { key: 'dark', icon: createElement(I.MoonOutlined), label: 'Escuro' }
        ] },
        { type: 'divider' },
        { key: 'compact', icon: createElement(I.ColumnHeightOutlined), label: compact ? 'Densidade confortável' : 'Densidade compacta' }
      ],
      selectable: true, selectedKeys: [themePref],
      onClick: e => { if (e.key === 'compact') setCompact(!compact); else setThemePref(e.key); }
    };

    const content = route === 'tarefas' ? html`<${TasksPage} mode=${mode} go=${go} isMobile=${isMobile} screens=${screens} />`
      : route === 'tarefa' ? html`<${TaskDetailPage} mode=${mode} go=${go} screens=${screens} />`
      : route === 'hoje' ? html`<${TodayPage} mode=${mode} go=${go} />`
      : route === 'projetos' ? html`<${ProjectsPage} mode=${mode} />`
      : route === 'identidade' ? html`<${IdentityPage} mode=${mode} />`
      : html`<${Placeholder} route=${route} go=${go} />`;

    return html`<${Layout} className="ct-shell" hasSider=${!isMobile}>
      ${isMobile ? html`<${Drawer} placement="left" open=${drawer} onClose=${() => setDrawer(false)} width=${264} styles=${{ body: { padding: 0, background: 'var(--ct-sider)' } }} closable=${false}>
          <${Boundary} region="navegação" resetKey=${route}>${sideNav(false)}<//>
        <//>`
        : html`<${Sider} width=${232} collapsedWidth=${64} collapsed=${isCollapsed} trigger=${null} style=${{ borderInlineEnd: '1px solid var(--ct-border)', height: '100%' }}>
          <${Boundary} region="navegação" resetKey=${route}>${sideNav(isCollapsed)}<//>
        <//>`}
      <${Layout} style=${{ minWidth: 0 }}>
        <${Header} className="ct-header">
          <${Boundary} region="barra superior" resetKey=${route}>
            <${Flex} align="center" gap=${12} style=${{ width: '100%', minWidth: 0 }}>
              ${isMobile ? html`<${Button} type="text" aria-label="Abrir menu" icon=${html`<${I.MenuOutlined} />`} onClick=${() => setDrawer(true)} />` : null}
              <span className="ct-header-title">${TITLES[route] || (ROUTE_OF[route] || {}).label}</span>
              ${screens.sm ? html`<${Input} className="ct-capture" placeholder="Capturar para o Inbox…" value=${capture} onChange=${e => setCapture(e.target.value)}
                  prefix=${html`<${I.PlusOutlined} style=${{ color: 'var(--ct-text-3)' }} />`}
                  suffix=${html`<${Text} type="secondary" style=${{ fontSize: 12 }}>Enter<//>`}
                  onPressEnter=${() => { if (capture.trim()) { message.success('Capturado no Inbox'); setCapture(''); } }} />` : null}
              <div style=${{ flex: 1 }}></div>
              ${screens.md ? html`<${RunningPill} go=${go} />` : null}
              <${Tooltip} title="Buscar e comandos (Ctrl+K)"><${Button} aria-label="Buscar" icon=${html`<${I.SearchOutlined} />`} onClick=${() => setPalette(true)}>${screens.xl ? html`<span>Buscar <${Text} type="secondary" className="ct-mono" style=${{ fontSize: 12, marginInlineStart: 6 }}>Ctrl K<//></span>` : null}<//><//>
              <${Dropdown} menu=${prefsMenu} trigger=${['click']}><${Button} aria-label="Aparência" icon=${createElement(themeIcon)} /><//>
              <${Button} type="primary" icon=${html`<${I.PlusOutlined} />`}>${screens.sm ? 'Nova tarefa' : null}<//>
            <//>
          <//>
        <//>
        <${Content} className="ct-content">
          <${Boundary} region=${TITLES[route] || (ROUTE_OF[route] || {}).label || 'tela'} resetKey=${route}>
            ${crash ? html`<${Bomb} />` : content}
            <div style=${{ padding: '0 24px 24px', textAlign: 'center' }}>
              <${Button} size="small" type="dashed" danger icon=${html`<${I.BugOutlined} />`} onClick=${() => setCrash(true)}>Simular falha nesta tela<//>
            </div>
          <//>
        <//>
        <div className="ct-statusbar" role="status">
          <span><span className="dot" style=${{ background: '#2FBF7F' }}></span>Notion sincronizado há 2 min</span>
          ${screens.md ? html`<span><${I.CalendarOutlined} /> Google Calendar ativo</span>` : null}
          ${screens.md ? html`<span><${I.ApiOutlined} /> MCP em 127.0.0.1:7432</span>` : null}
          <span style=${{ marginInlineStart: 'auto' }}>Protótipo · dados de exemplo · <a onClick=${() => go('identidade')}>identidade visual</a></span>
        </div>
      <//>
      <${Drawer} placement="bottom" height=${260} mask=${false} open=${term} onClose=${() => setTerm(false)}
        title=${html`<${Space}><${I.CodeOutlined} />Terminais<${Text} type="secondary" style=${{ fontSize: 12 }}>Ctrl+'<//><//>`}
        styles=${{ body: { padding: 0, background: '#15141D' }, header: { padding: '8px 16px' } }}>
        <div className="ct-mono" style=${{ color: '#ECEAF6', padding: '10px 14px', fontSize: 13, lineHeight: 1.6 }}>
          <div style=${{ color: '#8A879F' }}>#711 · ~/Code/pessoal/crafytask</div>
          <div>$ npm run dev</div>
          <div style=${{ color: '#4CD69A' }}>  ➜ electron-vite dev server running</div>
          <div>$ <span className="ct-live" style=${{ display: 'inline-block', background: '#ECEAF6', borderRadius: 1, width: 7, height: 14, animation: 'none', verticalAlign: 'middle' }}></span></div>
        </div>
      <//>
      <${CommandPalette} open=${palette} onClose=${() => setPalette(false)} go=${k => { go(k); setPalette(false); }} />
    <//>`;
  }

  function RunningPill({ go }) {
    const [secs, setSecs] = useState(9130);
    useEffect(() => { const t = setInterval(() => setSecs(s => s + 1), 1000); return () => clearInterval(t); }, []);
    return html`<${Popover} trigger="click" placement="bottomRight" title="Timers em execução" content=${html`<div style=${{ width: 280 }}>
        ${[{ id: 711, name: 'Criação de projeto para refatoração visual', s: secs }, { id: 705, name: 'Reunião diária', s: 4380 + (secs - 9130), leak: true }].map(t => html`
          <${Flex} key=${t.id} align="center" gap=${8} style=${{ padding: '6px 0' }}>
            <span className="ct-live"></span>
            <a onClick=${() => go('tarefa')} style=${{ flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>${t.name}</a>
            <span className="ct-mono" style=${{ color: t.leak ? 'var(--ct-text)' : undefined }}>${fmt(t.s)}</span>
            <${Button} size="small" type="text" aria-label="Pausar" icon=${html`<${I.PauseOutlined} />`} />
          <//>`)}
      </div>`}>
      <button className="ct-timer-pill" style=${{ cursor: 'pointer', color: 'var(--ct-text)', font: 'inherit' }}>
        <span className="ct-live"></span>
        <span className="ct-mono">${fmt(secs)}</span>
        <${Badge} count=${2} size="small" color="var(--ct-primary)" />
      </button>
    <//>`;
  }

  function CommandPalette({ open, onClose, go }) {
    const [q, setQ] = useState('');
    const cmds = [
      { k: 'tarefas', t: 'Ir para Tarefas', i: 'CheckSquareOutlined' }, { k: 'hoje', t: 'Ir para Hoje', i: 'ScheduleOutlined' },
      { k: 'projetos', t: 'Ir para Projetos', i: 'FolderOutlined' }, { k: 'identidade', t: 'Abrir identidade visual', i: 'BgColorsOutlined' },
      { k: 'tarefa', t: '#711 Criação de projeto para refatoração visual', i: 'FileTextOutlined' },
      { k: 'tarefa', t: '#731 Corrigir rolagem do terminal ao redimensionar', i: 'FileTextOutlined' }
    ].filter(c => c.t.toLowerCase().includes(q.toLowerCase()));
    return html`<${Modal} open=${open} onCancel=${onClose} footer=${null} closable=${false} width=${560} styles=${{ content: { padding: 8 } }} destroyOnClose>
      <${Input} autoFocus size="large" variant="borderless" placeholder="Buscar tarefas, projetos, páginas ou comandos…" prefix=${html`<${I.SearchOutlined} />`} value=${q} onChange=${e => setQ(e.target.value)} />
      <${Divider} style=${{ margin: '6px 0' }} />
      <${List} size="small" dataSource=${cmds} locale=${{ emptyText: 'Nada encontrado' }} renderItem=${c => html`<${List.Item} style=${{ cursor: 'pointer', padding: '8px 12px', borderRadius: 8 }} onClick=${() => go(c.k)}>
        <${Space}><${I[c.i]} />${c.t}<//>
      <//>`} />
    <//>`;
  }

  function TasksPage({ mode, go, isMobile, screens }) {
    const [status, setStatus] = useState('inbox');
    const [view, setView] = useState('tabela');
    const [groupBy, setGroupBy] = useState('none');
    const [q, setQ] = useState('');
    const [sel, setSel] = useState([]);
    const [today, setToday] = useState(() => new Set(TASKS.filter(t => t.today).map(t => t.id)));
    const counts = useMemo(() => { const c = { all: TASKS.length }; TASKS.forEach(t => { c[t.status] = (c[t.status] || 0) + 1; }); return c; }, []);
    const rows = TASKS.filter(t => (status === 'all' || t.status === status) && t.name.toLowerCase().includes(q.toLowerCase()));
    const effectiveView = isMobile && view === 'tabela' ? 'cards' : view;
    useEffect(() => { setSel([]); if (status !== 'executando' && view === 'kanban') setView('tabela'); }, [status]);

    const tabItems = [{ key: 'all', label: 'Todas', icon: 'UnorderedListOutlined' }].concat(Object.entries(STATUS).map(([k, v]) => ({ key: k, label: v.label, icon: v.icon })))
      .map(t => {
        const def = STATUS[t.key];
        const color = def ? def[mode][0] : 'var(--ct-text-2)';
        return { key: t.key, label: html`<span style=${{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
          ${createElement(I[t.icon], { style: { color } })}${t.label}
          <span className="ct-mono" style=${{ fontSize: 12, color: 'var(--ct-text-3)', background: 'var(--ct-bg)', borderRadius: 6, padding: '0 6px', border: '1px solid var(--ct-border)' }}>${counts[t.key] || 0}</span>
        </span>` };
      });

    const todayBtn = t => html`<${Tooltip} title=${today.has(t.id) ? 'Tirar do plano de hoje' : 'Planejar para hoje'}>
      <${Button} size="small" type=${today.has(t.id) ? 'primary' : 'text'} ghost=${today.has(t.id)} aria-label="Hoje" icon=${html`<${I.ScheduleOutlined} />`}
        onClick=${e => { e.stopPropagation(); const n = new Set(today); n.has(t.id) ? n.delete(t.id) : n.add(t.id); setToday(n); }} />
    <//>`;
    const nameCell = t => html`<${Flex} vertical gap=${2} style=${{ minWidth: 0 }}>
      <${Flex} align="center" gap=${6} style=${{ minWidth: 0 }}>
        ${t.blocked ? html`<${Tooltip} title="Bloqueada: depende de #702"><${I.LockOutlined} style=${{ color: CATEGORY.prioridade[mode][0] }} /><//>` : null}
        ${t.running ? html`<span className="ct-live" aria-label="Timer rodando"></span>` : null}
        <a className=${'ct-taskname' + (t.status === 'finalizada' ? ' done' : '')} onClick=${() => go('tarefa')} style=${{ color: 'var(--ct-text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>${t.name}</a>

      <${Flex} gap=${8} align="center" wrap="wrap">
        <${Text} type="secondary" className="ct-mono" style=${{ fontSize: 12 }}>#${t.id}<//>
        ${t.sub && t.sub[1] ? html`<${Progress} percent=${Math.round(t.sub[0] / t.sub[1] * 100)} size=${[48, 4]} showInfo=${false} /><${Text} type="secondary" style=${{ fontSize: 12 }}>${t.sub[0]}/${t.sub[1]}<//>` : null}
        ${t.waiting ? html`<${Text} type="secondary" style=${{ fontSize: 12 }}>aguardando: ${t.waiting}<//>` : null}
      <//>
    <//>`;
    const columns = [

      { title: 'Categoria', key: 'cat', width: 132, render: (_, t) => t.category === 'normal' ? html`<${Text} type="secondary">—<//>` : html`<${Chip} def=${CATEGORY[t.category]} mode=${mode} />` },
      { title: 'Projeto', key: 'project', width: 170, render: (_, t) => html`<${ProjectLabel} id=${t.project} />`, responsive: ['xl'] },
      { title: 'Contextos', key: 'ctx', width: 150, render: (_, t) => t.contexts.length ? t.contexts.map(c => html`<${Tag} key=${c} bordered=${false}>${c}<//>`) : html`<${Text} type="secondary">—<//>`, responsive: ['xxl'] },

    const card = t => html`<${Card} key=${t.id} size="small" hoverable onClick=${() => go('tarefa')} className=${t.leak ? 'ct-leak-' + t.leak : ''}>
      <${Flex} vertical gap=${8}>
        <${Flex} justify="space-between" align="start" gap=${8}>${nameCell(t)}${todayBtn(t)}<//>
        <${Flex} gap=${6} wrap="wrap" align="center">
          <${Chip} def=${STATUS[t.status]} mode=${mode} />
          ${t.category !== 'normal' ? html`<${Chip} def=${CATEGORY[t.category]} mode=${mode} />` : null}
          <${ProjectLabel} id=${t.project} />
          <span style=${{ marginInlineStart: 'auto' }} className="ct-mono">${fmtShort(t.secs)}</span>
        <//>
      <//>
    <//>`;

    const groups = groupBy === 'project'
      ? Object.entries(rows.reduce((a, t) => { const k = t.project ? P[t.project].name : 'Sem projeto'; (a[k] = a[k] || []).push(t); return a; }, {}))
      : null;

    const body = rows.length === 0
      ? html`<${Empty} image=${Empty.PRESENTED_IMAGE_SIMPLE} description=${status === 'inbox' ? 'Inbox zerado. Tudo processado.' : 'Nenhuma tarefa aqui.'} />`
      : effectiveView === 'kanban'
        ? html`<div className="ct-kanban">${PROJECTS.map(p => { const items = rows.filter(t => t.project === p.id); return html`<div key=${p.id} className="ct-col">
            <${Flex} align="center" gap=${8} style=${{ marginBottom: 8 }}><span className="ct-dot" style=${{ background: p.color }}></span><${Text} strong>${p.name}<//><${Text} type="secondary" className="ct-mono">${items.length}<//><//>
            <${Flex} vertical gap=${8}>${items.map(card)}${items.length ? null : html`<${Text} type="secondary" style=${{ fontSize: 12 }}>Nada executando<//>`}<//>
          </div>`; })}</div>`
        : effectiveView === 'cards'
          ? (groups ? groups.map(([g, ts]) => html`<div key=${g} style=${{ marginBottom: 16 }}><div className="ct-eyebrow" style=${{ margin: '4px 0 8px' }}>${g} · ${ts.length}</div><div className="ct-grid-auto">${ts.map(card)}</div></div>`)
            : html`<div className="ct-grid-auto">${rows.map(card)}</div>`)
          : html`<${Table} rowKey="id" size=${screens.xxl ? 'middle' : 'small'} columns=${columns} dataSource=${rows} pagination=${false}
              rowClassName=${t => t.leak ? 'ct-leak-' + t.leak : ''}
              rowSelection=${{ selectedRowKeys: sel, onChange: setSel, columnWidth: 40 }} scroll=${{ x: 'max-content' }} />`;

    return html`<div className=${isMobile ? 'ct-page-narrow' : 'ct-page'}>
      ${isMobile
        ? html`<${Select} value=${status} onChange=${setStatus} options=${tabItems.map(t => ({ value: t.key, label: t.label }))} style=${{ width: '100%', marginBottom: 12 }} aria-label="Status" />`
        : html`<${Tabs} activeKey=${status} onChange=${setStatus} items=${tabItems} style=${{ marginBottom: 4 }} />`}
      <${Flex} gap=${8} wrap="wrap" align="center" style=${{ marginBottom: 12 }}>
        <${Input} allowClear placeholder="Buscar em nome e descrição" prefix=${html`<${I.SearchOutlined} />`} value=${q} onChange=${e => setQ(e.target.value)} style=${{ flex: '1 1 220px', maxWidth: 360 }} />
        <${Popover} trigger="click" placement="bottomLeft" title="Filtros" content=${html`<${Flex} vertical gap=${10} style=${{ width: 260 }}>

        <${Card} title="Status GTD — a cor reforça, o ícone e o texto informam" size="small">
          <${Flex} gap=${8} wrap="wrap">${Object.entries(STATUS).map(([k, v]) => html`<${Chip} key=${k} def=${v} mode=${mode} />`)}<//>
          <${Divider} />
          <${Flex} gap=${8} wrap="wrap">${Object.entries(CATEGORY).map(([k, v]) => html`<${Chip} key=${k} def=${v} mode=${mode} />`)}
            <${Flex} gap=${12} align="center" style=${{ marginInlineStart: 12 }}>${Object.keys(ENERGY).map(k => html`<${Space} key=${k} size=${4}><${Energy} level=${k} /><${Text} type="secondary">${ENERGY[k].label}<//><//>`)}<//>
          <//>
          <${Divider} />
          <${Flex} gap=${8} wrap="wrap">
            <div className="ct-leak-1" style=${{ padding: '8px 12px', borderRadius: 8 }}>Time leak 30 min+</div>
            <div className="ct-leak-2" style=${{ padding: '8px 12px', borderRadius: 8 }}>1h+</div>
            <div className="ct-leak-3" style=${{ padding: '8px 12px', borderRadius: 8 }}>2h+</div>
          <//>
        <//>
        <${Card} title="Tipografia" size="small">
          <${Flex} vertical gap=${8}>
            <span className="ct-logo" style=${{ fontSize: 28 }}>CrafyTask</span><${Text} type="secondary" style=${{ fontSize: 12 }}>Denk One — só o logo<//>
            <${Title} level=${3} style=${{ margin: 0 }}>Geist 24/600 — título de tela<//>
            <${Text} style=${{ fontSize: 16, fontWeight: 600 }}>Geist 16/600 — título de seção<//>
            <${Text}>Geist 14/400 — texto de interface e tabela<//>
            <${Text} type="secondary" style=${{ fontSize: 12 }}>Geist 12/400 — metadados<//>
            <span className="ct-hero-time" style=${{ fontSize: 40 }}>02:32:10</span><${Text} type="secondary" style=${{ fontSize: 12 }}>Geist Mono tabular — tempo, ids, contadores<//>
          <//>
        <//>
        <${Card} title="Componentes antd com o tema" size="small">
          <${Flex} gap=${8} wrap="wrap" align="center">
            <${Button} type="primary">Primária<//><${Button}>Padrão<//><${Button} type="text">Texto<//><${Button} danger>Excluir<//>
            <${Switch} defaultChecked /><${Segmented} options=${['Dia', 'Semana', 'Mês']} />
            <${Badge} count=${5} color="var(--ct-primary)"><${Avatar} shape="square" icon=${html`<${I.InboxOutlined} />`} /><//>
          <//>
          <${Divider} />
          <${Row} gutter=${[12, 12]}>
            <${Col} xs=${24} md=${8}><${Alert} type="success" showIcon message="Sincronizado com o Notion" /><//>
            <${Col} xs=${24} md=${8}><${Alert} type="warning" showIcon message="Projeto sem próxima ação" /><//>
            <${Col} xs=${24} md=${8}><${Alert} type="error" showIcon message="Falha ao enviar worklog" /><//>
          <//>
        <//>
      <//>
    </div>`;
  }

  function Placeholder({ route, go }) {
    const item = ROUTE_OF[route];
    return html`<div className="ct-page"><${Result} icon=${html`<${I.ProjectOutlined} style=${{ color: 'var(--ct-text-3)' }} />`} title=${(item ? item.label : 'Tela') + ' — fora deste protótipo'}
      subTitle=${html`<span>Rota atual <code>${item && item.route}</code>. Usa o mesmo AppShell e os padrões do guia. O comportamento de hoje está em <code>docs/ui/${ROUTE_DOCS[route]}.md</code> e a fase dela em <code>docs/design/plano-de-refatoracao.md</code>.</span>`}
      extra=${html`<${Button} onClick=${() => go('tarefas')}>Voltar para Tarefas<//>`} /></div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${Shell} />`);
})();
</script>
