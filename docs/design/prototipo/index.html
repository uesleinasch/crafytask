    useEffect(() => { setSel([]); if (status !== 'executando' && view === 'kanban') setView('tabela'); }, [status]);
    useEffect(() => { setSel([]); setCollapsed(new Set()); }, [groupBy]);

    const idOf = key => Number(String(key).split(':')[1].split('@')[0]);
    const selIds = [...new Set(sel.filter(k => !String(k).startsWith('g:')).map(idOf))];
    const findTask = id => { for (const t of tasks) { if (t.id === id) return t; const s = t.subtasks.find(x => x.id === id); if (s) return s; } return null; };
    const updateTasks = (ids, patch) => setTasks(ts => ts.map(t => {
      const own = ids.includes(t.id) ? (typeof patch === 'function' ? patch(t) : patch) : {};
      return { ...t, ...own, subtasks: t.subtasks.map(s => ids.includes(s.id) ? { ...s, ...(typeof patch === 'function' ? patch(s) : patch) } : s) };
    }));
    const removeTasks = ids => { setTasks(ts => ts.filter(t => !ids.includes(t.id)).map(t => ({ ...t, subtasks: t.subtasks.filter(s => !ids.includes(s.id)) }))); setSel([]); };
    const toggleToday = ids => { const n = new Set(today); const add = ids.some(id => !n.has(id)); ids.forEach(id => add ? n.add(id) : n.delete(id)); setToday(n); message.success(add ? 'No plano de hoje' : 'Fora do plano de hoje'); };
    const plural = (n, s, p) => n + ' ' + (n === 1 ? s : p);

    const menuFor = r => {
      const many = selIds.length > 1 && selIds.includes(r.id);
      const ids = many ? selIds : [r.id];
      const n = ids.length;
      const tag = s => many ? `${s} (${n})` : s;
      const check = on => on ? '✓ ' : '';
      const items = [
        ...(many
          ? [{ key: 'hdr', type: 'group', label: plural(n, 'tarefa selecionada', 'tarefas selecionadas') }]
          : [
              { key: 'open', icon: createElement(I.FileTextOutlined), label: 'Abrir' },
              { key: 'timer', icon: createElement(r.running ? I.PauseOutlined : I.CaretRightOutlined), label: r.running ? 'Pausar timer' : 'Iniciar timer', disabled: r.blocked && !r.running }
            ]),
        { key: 'today', icon: createElement(I.ScheduleOutlined), label: tag(!many && today.has(r.id) ? 'Tirar do plano de hoje' : 'Planejar para hoje') },
        { key: 'status', icon: createElement(I.CheckCircleOutlined), label: tag('Marcar como'), children: Object.entries(STATUS).map(([k, v]) => ({
          key: 'status:' + k, icon: createElement(I[v.icon], { style: { color: v[mode][0] } }), label: (many ? '' : check(r.status === k)) + v.label,
          disabled: k === 'executando' && ids.some(id => (findTask(id) || {}).blocked) })) },
        { key: 'cat', icon: createElement(I.FlagOutlined), label: tag('Categoria'), children: Object.entries(CATEGORY).map(([k, v]) => ({ key: 'cat:' + k, label: (many ? '' : check(r.category === k)) + v.label })) },
        { key: 'proj', icon: createElement(I.FolderOutlined), label: tag('Mover para projeto'), children: [{ key: 'proj:0', label: (many ? '' : check(!r.project)) + 'Sem projeto' }].concat(PROJECTS.map(p => ({ key: 'proj:' + p.id, label: (many ? '' : check(r.project === p.id)) + p.name }))) },
        ...(many ? [] : [{ key: 'ctx', icon: createElement(I.EnvironmentOutlined), label: 'Contextos', children: CONTEXTS.map(c => ({ key: 'ctx:' + c.name, label: check(r.contexts.includes(c.name)) + c.emoji + ' ' + c.name })) }]),
        { type: 'divider' },
        ...(many ? [] : [{ key: 'copy', icon: createElement(I.CopyOutlined), label: 'Copiar #' + r.id }]),
        { key: 'archive', icon: createElement(I.ContainerOutlined), label: tag('Arquivar') },
        { key: 'delete', icon: createElement(I.DeleteOutlined), label: tag('Excluir…'), danger: true }
      ];
      const onClick = ({ key, domEvent }) => {
        if (domEvent) domEvent.stopPropagation();
        const [kind, val] = key.split(':');
        if (kind === 'open') go('tarefa');
        if (kind === 'timer') { updateTasks([r.id], { running: !r.running }); message.success(r.running ? 'Timer pausado' : 'Timer iniciado'); }
        if (kind === 'today') toggleToday(ids);
        if (kind === 'status') { updateTasks(ids, { status: val }); message.success(plural(n, 'tarefa marcada', 'tarefas marcadas') + ' como ' + STATUS[val].label); }
        if (kind === 'cat') { updateTasks(ids, { category: val }); message.success('Categoria: ' + CATEGORY[val].label); }
        if (kind === 'proj') { updateTasks(ids, { project: Number(val) || null }); message.success(Number(val) ? 'Movida para ' + P[val].name : 'Sem projeto'); }
        if (kind === 'ctx') updateTasks([r.id], t => ({ contexts: t.contexts.includes(val) ? t.contexts.filter(x => x !== val) : t.contexts.concat(val) }));
        if (kind === 'copy') { try { navigator.clipboard.writeText(String(r.id)).catch(() => {}); } catch (e) {} message.success('#' + r.id + ' copiado'); }
        if (kind === 'archive') { removeTasks(ids); message.success(plural(n, 'tarefa arquivada', 'tarefas arquivadas')); }
        if (kind === 'delete') modal.confirm({
          title: 'Excluir ' + plural(n, 'tarefa', 'tarefas') + '?',
          content: 'Apaga também sessões, notas e desenho. No Notion e no Google também, se a sincronização estiver ligada.',
          okText: 'Excluir', okButtonProps: { danger: true }, cancelText: 'Cancelar',
          onOk: () => { removeTasks(ids); message.success(plural(n, 'tarefa excluída', 'tarefas excluídas')); }
        });
      };
      return { items, onClick };
    };

    const tabItems = [{ key: 'all', label: 'Todas', icon: 'UnorderedListOutlined' }].concat(Object.entries(STATUS).map(([k, v]) => ({ key: k, label: v.label, icon: v.icon })))
      .map(t => {
        const def = STATUS[t.key];
        const color = def ? def[mode][0] : 'var(--ct-text-2)';
        return { key: t.key, label: html`<span style=${{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
          ${createElement(I[t.icon], { style: { color } })}${t.label}
          <span className="ct-mono" style=${{ fontSize: 12, color: 'var(--ct-text-3)', background: 'var(--ct-bg)', borderRadius: 6, padding: '0 6px', border: '1px solid var(--ct-border)' }}>${counts[t.key] || 0}</span>
        </span>` };
      });

    const todayBtn = t => html`<${Tooltip} title=${today.has(t.id) ? 'Tirar do plano de hoje' : 'Planejar para hoje'}>
      <${Button} size="small" type=${today.has(t.id) ? 'primary' : 'text'} ghost=${today.has(t.id)} aria-label="Hoje" aria-pressed=${today.has(t.id)} icon=${html`<${I.ScheduleOutlined} />`}
        onClick=${e => { e.stopPropagation(); toggleToday([t.id]); }} />
    <//>`;
    const timerBtn = t => html`<${Tooltip} title=${t.blocked ? 'Bloqueada por dependências' : t.running ? 'Pausar timer' : 'Iniciar timer'}>
      <${Button} size="small" type="text" disabled=${t.blocked && !t.running} aria-label=${t.running ? 'Pausar timer' : 'Iniciar timer'} icon=${html`<${t.running ? I.PauseOutlined : I.CaretRightOutlined} />`}
        onClick=${e => { e.stopPropagation(); updateTasks([t.id], { running: !t.running }); }} />
    <//>`;
    const moreBtn = t => html`<${Dropdown} menu=${menuFor(t)} trigger=${['click']} placement="bottomRight">
      <${Button} size="small" type="text" aria-label="Mais ações" icon=${html`<${I.EllipsisOutlined} />`} onClick=${e => e.stopPropagation()} />
    <//>`;
    const toggleExpand = key => setExpanded(ex => ex.includes(key) ? ex.filter(k => k !== key) : ex.concat(key));
    const showStatusCol = status === 'all';

    const nameCell = t => {
      const ss = t.subtasks || [];
      const open = expanded.includes(t.rowKey);
      const others = groupBy === 'context' && t.groupCtx && t.contexts.length > 1 ? t.contexts.filter(c => c !== t.groupCtx) : [];
      return html`<${Flex} vertical gap=${4} style=${{ minWidth: 0 }}>
        <${Flex} align="center" gap=${6} style=${{ minWidth: 0 }}>
          ${ss.length
            ? html`<${Button} size="small" type="text" className="ct-caret" aria-expanded=${open} aria-label=${(open ? 'Recolher ' : 'Expandir ') + ss.length + ' subtarefas'} title=${ss.length + ' subtarefas'}
                icon=${html`<${open ? I.CaretDownOutlined : I.CaretRightOutlined} />`} onClick=${e => { e.stopPropagation(); toggleExpand(t.rowKey); }} />`
            : t.isSub ? null : html`<span className="ct-caret-space"></span>`}
          ${t.isSub ? html`<${Checkbox} checked=${t.status === 'finalizada'} aria-label=${'Concluir ' + t.name} onClick=${e => e.stopPropagation()} onChange=${e => updateTasks([t.id], { status: e.target.checked ? 'finalizada' : 'inbox' })} />` : null}
          ${t.blocked ? html`<${Tooltip} title="Bloqueada: depende de #702"><${I.LockOutlined} style=${{ color: CATEGORY.prioridade[mode][0] }} /><//>` : null}
          ${t.running ? html`<span className="ct-live" aria-label="Timer rodando"></span>` : null}
          <a className=${'ct-taskname' + (t.status === 'finalizada' ? ' done' : '')} onClick=${() => go('tarefa')} style=${{ color: 'var(--ct-text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', minWidth: 0 }}>${t.name}</a>
          ${t.isSub && !showStatusCol ? html`<${Chip} def=${STATUS[t.status]} mode=${mode} />` : null}
          ${t.waiting ? html`<${Tooltip} title=${'Aguardando: ' + t.waiting}><${I.HourglassOutlined} aria-label=${'Aguardando: ' + t.waiting} style=${{ color: STATUS.aguardando[mode][0], fontSize: 12 }} /><//>` : null}
          ${others.length ? html`<${Tooltip} title=${'Também em ' + others.join(', ')}><${I.CopyOutlined} aria-label="Aparece em outros grupos" style=${{ color: 'var(--ct-text-3)', fontSize: 12 }} /><//>` : null}
        <//>
      <//>`;
    };

    const ctxCell = t => {
      if (!t.contexts.length) return html`<${Text} type="secondary">—<//>`;
      const first = CONTEXTS.find(c => c.name === t.contexts[0]);
      return html`<${Popover} trigger="hover" mouseEnterDelay=${0.15} placement="bottom" title="Contextos"
        content=${html`<${Flex} gap=${4} wrap="wrap" style=${{ maxWidth: 240 }}>${CONTEXTS.map(c => html`<${Tag.CheckableTag} key=${c.name} checked=${t.contexts.includes(c.name)}
          onChange=${on => updateTasks([t.id], x => ({ contexts: on ? x.contexts.concat(c.name) : x.contexts.filter(y => y !== c.name) }))}>${c.emoji} ${c.name}<//>`)}<//>`}>
        <span style=${{ display: 'inline-flex', gap: 4, alignItems: 'center', cursor: 'default' }}>
          <${Tag} bordered=${false} style=${{ margin: 0 }}>${first ? first.emoji + ' ' : ''}${t.contexts[0]}<//>
          ${t.contexts.length > 1 ? html`<${Tag} bordered=${false} className="ct-mono" style=${{ margin: 0, color: 'var(--ct-primary)', background: 'var(--ct-primary-soft)' }}>+${t.contexts.length - 1}<//>` : null}
        </span>
      <//>`;
    };

    const groupList = list => {
      if (groupBy === 'project') {
        const m = new Map();
        list.forEach(t => { const k = t.project || 0; if (!m.has(k)) m.set(k, []); m.get(k).push(t); });
        return [...m.entries()].map(([k, ts]) => ({ key: 'p' + k, name: k ? P[k].name : 'Sem projeto', color: k ? P[k].color : 'var(--ct-border-strong)', tasks: ts }));
      }
      if (groupBy === 'context') {
        const m = new Map();
        list.forEach(t => (t.contexts.length ? t.contexts : ['—']).forEach(c => { if (!m.has(c)) m.set(c, []); m.get(c).push({ ...t, groupCtx: c }); }));
        return [...m.entries()].map(([c, ts]) => { const def = CONTEXTS.find(x => x.name === c); return { key: 'c' + c, name: c === '—' ? 'Sem contexto' : c, emoji: def && def.emoji, tasks: ts }; });
      }
      return null;
    };
    const groups = groupList(rows);
    const toRow = (t, gk) => ({
      ...t, rowKey: 't:' + t.id + (gk ? '@' + gk : ''),
      children: t.subtasks.length ? t.subtasks.map(s => ({ ...s, isSub: true, parentId: t.id, rowKey: 's:' + s.id + (gk ? '@' + gk : '') })) : undefined
    });
    const data = groups
      ? groups.flatMap(g => [{ rowKey: 'g:' + g.key, isGroup: true, group: g }].concat(collapsed.has(g.key) ? [] : g.tasks.map(t => toRow(t, g.key))))
      : rows.map(t => toRow(t));

    const groupHeader = g => {
      const isCollapsed = collapsed.has(g.key);
      const total = g.tasks.reduce((a, t) => a + t.secs, 0);
      const keys = g.tasks.map(t => 't:' + t.id + '@' + g.key);
      return html`<${Flex} align="center" gap=${8}>
        <${Button} size="small" type="text" aria-expanded=${!isCollapsed} aria-label=${(isCollapsed ? 'Expandir ' : 'Recolher ') + g.name}
          icon=${html`<${isCollapsed ? I.CaretRightOutlined : I.CaretDownOutlined} />`}
          onClick=${() => { const n = new Set(collapsed); n.has(g.key) ? n.delete(g.key) : n.add(g.key); setCollapsed(n); }} />
        ${g.color ? html`<span className="ct-dot" style=${{ background: g.color }}></span>` : g.emoji ? html`<span>${g.emoji}</span>` : null}
        <${Text} strong>${g.name}<//>
        <${Text} type="secondary" className="ct-mono">${g.tasks.length}<//>
        <a style=${{ fontSize: 12 }} onClick=${() => setSel([...new Set(sel.concat(keys))])}>Selecionar grupo</a>
        <span style=${{ flex: 1 }}></span>
        <${Tooltip} title="Tempo somado do grupo"><span className="ct-mono" style=${{ color: 'var(--ct-text-2)' }}>${fmtShort(total)}</span><//>
      <//>`;
    };

    const cols = [
      { title: 'ID', key: 'id', width: 72, render: (_, t) => html`<${Text} type="secondary" className="ct-mono" style=${{ fontSize: 12 }}>#${t.id}<//>` },
      { title: 'Tarefa', key: 'name', render: (_, t) => nameCell(t) },
      showStatusCol ? { title: 'Status', key: 'status', width: 132, render: (_, t) => html`<${Chip} def=${STATUS[t.status]} mode=${mode} />` } : null,
      screens.lg ? { title: 'Categoria', key: 'cat', width: 124, render: (_, t) => t.category === 'normal' ? null : html`<${Chip} def=${CATEGORY[t.category]} mode=${mode} />` } : null,
      screens.xl && groupBy !== 'project' ? { title: 'Projeto', key: 'project', width: 160, render: (_, t) => t.isSub ? null : html`<${ProjectLabel} id=${t.project} />` } : null,
      screens.lg && groupBy !== 'context' ? { title: 'Contextos', key: 'ctx', width: 150, render: (_, t) => t.isSub ? null : ctxCell(t) } : null,
      screens.xl ? { title: 'Energia', key: 'energy', width: 76, render: (_, t) => t.energy ? html`<${Energy} level=${t.energy} />` : null } : null,
      screens.md ? { title: 'Prazo', key: 'due', width: 104, render: (_, t) => { const tone = dueTone(t.due); return t.due ? html`<${Text} type=${tone === 'error' ? 'danger' : tone === 'warning' ? 'warning' : undefined} className="ct-mono">${fmtDate(t.due)}${t.dueTime ? ' ' + t.dueTime : ''}<//>` : null; } } : null,
      { title: 'Tempo', key: 'time', width: 84, align: 'right', render: (_, t) => html`<span className="ct-mono">${fmtShort(t.secs)}</span>` },
      { title: '', key: 'act', width: 104, render: (_, t) => html`<${Space} size=${0}>${t.isSub ? null : todayBtn(t)}${timerBtn(t)}${moreBtn(t)}<//>` }
    ].filter(Boolean);
    const columns = cols.map((c, i) => ({ ...c, render: (v, r, idx) => r.isGroup ? (i === 0 ? groupHeader(r.group) : null) : c.render(v, r, idx), onCell: r => r.isGroup ? { colSpan: i === 0 ? cols.length : 0 } : {} }));

    const card = t => html`<${Dropdown} key=${t.id + (t.groupCtx || '')} menu=${menuFor(t)} trigger=${['contextMenu']}>
      <div><${Card} size="small" hoverable onClick=${() => go('tarefa')} className=${t.leak ? 'ct-leak-' + t.leak : ''}>
        <${Flex} vertical gap=${8}>
          <${Flex} justify="space-between" align="start" gap=${8}>
            <${Flex} vertical gap=${2} style=${{ minWidth: 0 }}>
              <${Text} type="secondary" className="ct-mono" style=${{ fontSize: 12 }}>#${t.id}<//>
              <span className=${'ct-taskname' + (t.status === 'finalizada' ? ' done' : '')}>${t.running ? html`<span className="ct-live" style=${{ display: 'inline-block', marginInlineEnd: 6 }}></span>` : null}${t.name}</span>
              ${t.subtasks.length ? html`<${Flex} align="center" gap=${8}><${Progress} percent=${Math.round(t.subtasks.filter(s => s.status === 'finalizada').length / t.subtasks.length * 100)} size=${[96, 4]} showInfo=${false} /><${Text} type="secondary" className="ct-mono" style=${{ fontSize: 12 }}>${t.subtasks.filter(s => s.status === 'finalizada').length}/${t.subtasks.length}<//><//>` : null}
            <//>
            <${Space} size=${0}>${todayBtn(t)}${moreBtn(t)}<//>
          <//>
          <${Flex} gap=${6} wrap="wrap" align="center">
            ${showStatusCol ? html`<${Chip} def=${STATUS[t.status]} mode=${mode} />` : null}
            ${t.category !== 'normal' ? html`<${Chip} def=${CATEGORY[t.category]} mode=${mode} />` : null}
            ${groupBy !== 'project' ? html`<${ProjectLabel} id=${t.project} />` : null}
            ${groupBy !== 'context' && t.contexts.length ? ctxCell(t) : null}
            <span style=${{ marginInlineStart: 'auto' }} className="ct-mono">${fmtShort(t.secs)}</span>
          <//>
        <//>
      <//></div>
    <//>`;

    const table = html`<${Table} rowKey="rowKey" size=${screens.xxl ? 'middle' : 'small'} columns=${columns} dataSource=${data} pagination=${false}
      components=${{ body: { row: MenuRow } }}
      onRow=${r => r.isGroup ? {} : { record: r, menu: menuFor(r) }}
      rowClassName=${r => r.isGroup ? 'ct-grouprow' : r.isSub ? 'ct-subrow' : r.leak ? 'ct-leak-' + r.leak : ''}
      expandable=${{ expandedRowKeys: expanded, onExpandedRowsChange: setExpanded, expandIcon: () => null, indentSize: 28, expandIconColumnIndex: 3 }}
      rowSelection=${{ selectedRowKeys: sel, onChange: setSel, columnWidth: 40, checkStrictly: true, renderCell: (checked, r, i, node) => r.isGroup ? null : node }}
      scroll=${{ x: 'max-content' }} />`;

    const body = rows.length === 0
      ? html`<${Empty} image=${Empty.PRESENTED_IMAGE_SIMPLE} description=${status === 'inbox' ? 'Inbox zerado. Tudo processado.' : 'Nenhuma tarefa aqui.'} />`
      : effectiveView === 'kanban'
        ? html`<div className="ct-kanban">${PROJECTS.map(p => { const items = rows.filter(t => t.project === p.id); return html`<div key=${p.id} className="ct-col">
            <${Flex} align="center" gap=${8} style=${{ marginBottom: 8 }}><span className="ct-dot" style=${{ background: p.color }}></span><${Text} strong>${p.name}<//><${Text} type="secondary" className="ct-mono">${items.length}<//><//>
            <${Flex} vertical gap=${8}>${items.map(card)}${items.length ? null : html`<${Text} type="secondary" style=${{ fontSize: 12 }}>Nada executando<//>`}<//>
          </div>`; })}</div>`
        : effectiveView === 'cards'
          ? (groups
            ? groups.map(g => html`<div key=${g.key} style=${{ marginBottom: 16 }}>
                <div className="ct-groupbar">${groupHeader(g)}</div>
                ${collapsed.has(g.key) ? null : html`<div className="ct-grid-auto">${g.tasks.map(card)}</div>`}
              </div>`)
            : html`<div className="ct-grid-auto">${rows.map(card)}</div>`)
          : table;

    const bulk = selIds.length ? menuFor(findTask(selIds[0])) : null;
    return html`<div className=${isMobile ? 'ct-page-narrow' : 'ct-page'}>
      ${isMobile
        ? html`<${Select} value=${status} onChange=${setStatus} options=${tabItems.map(t => ({ value: t.key, label: t.label }))} style=${{ width: '100%', marginBottom: 12 }} aria-label="Status" />`
        : html`<${Tabs} activeKey=${status} onChange=${setStatus} items=${tabItems} style=${{ marginBottom: 4 }} />`}
      <${Flex} gap=${8} wrap="wrap" align="center" style=${{ marginBottom: 12 }}>
        <${Input} allowClear placeholder="Buscar em nome e descrição" prefix=${html`<${I.SearchOutlined} />`} value=${q} onChange=${e => setQ(e.target.value)} style=${{ flex: '1 1 220px', maxWidth: 360 }} />
        <${Popover} trigger="click" placement="bottomLeft" title="Filtros" content=${html`<${Flex} vertical gap=${10} style=${{ width: 260 }}>
            <${Select} placeholder="Categoria" allowClear options=${Object.entries(CATEGORY).map(([k, v]) => ({ value: k, label: v.label }))} />
            <${Select} placeholder="Contexto" allowClear options=${CONTEXTS.map(c => ({ value: c.name, label: c.emoji + ' ' + c.name }))} />
            <${Select} placeholder="Projeto" allowClear options=${[{ value: -1, label: 'Sem projeto' }].concat(PROJECTS.map(p => ({ value: p.id, label: p.name })))} />
            <${Select} placeholder="Tag" allowClear options=${[{ value: 'refactor', label: 'refactor' }]} />
            <${Checkbox}>Só bloqueadas<//>
            <${Button} type="link" style=${{ padding: 0, alignSelf: 'start' }}>Limpar filtros<//>
          <//>`}>
          <${Button} icon=${html`<${I.FilterOutlined} />`}>Filtros<//>
        <//>
        <div style=${{ flex: 1 }}></div>
        <${Segmented} value=${effectiveView} onChange=${setView} options=${[
          ...(isMobile ? [] : [{ value: 'tabela', icon: html`<${I.TableOutlined} />`, label: screens.lg ? 'Tabela' : null, title: 'Tabela' }]),
          { value: 'cards', icon: html`<${I.AppstoreOutlined} />`, label: screens.lg ? 'Cards' : null, title: 'Cards' },
          ...(status === 'executando' ? [{ value: 'kanban', icon: html`<${I.ProjectOutlined} />`, label: screens.lg ? 'Kanban' : null, title: 'Kanban' }] : [])
        ]} />
        ${effectiveView !== 'kanban' ? html`<${Select} value=${groupBy} onChange=${setGroupBy} style=${{ width: 180 }} aria-label="Agrupar" options=${[{ value: 'none', label: 'Sem agrupamento' }, { value: 'project', label: 'Agrupar por projeto' }, { value: 'context', label: 'Agrupar por contexto' }]} />` : null}
      <//>
      ${status === 'inbox' && rows.length ? html`<${Alert} showIcon type="info" style=${{ marginBottom: 12 }} message=${html`<span><b>${plural(rows.length, 'item para processar.', 'itens para processar.')}</b> Para cada um: é acionável? Leva menos de 2 minutos? É de um projeto?</span>`} />` : null}
      ${groupBy === 'context' && rows.some(t => t.contexts.length > 1) ? html`<${Text} type="secondary" style=${{ display: 'block', fontSize: 12, marginBottom: 8 }}><${I.CopyOutlined} /> Tarefas com mais de um contexto aparecem em cada grupo; a soma dos grupos passa do total.<//>` : null}
      ${body}
      ${bulk ? html`<div className="ct-bulkbar"><div className="ct-bulkbar-inner">
          <${Text} strong>${plural(selIds.length, 'selecionada', 'selecionadas')}<//>
          <${Button} size="small" type="link" onClick=${() => setSel([])}>Limpar<//>
          <div style=${{ flex: 1 }}></div>
          <${Select} size="small" placeholder="Marcar como…" value=${null} style=${{ width: 150 }} options=${Object.entries(STATUS).map(([k, v]) => ({ value: k, label: v.label }))} onChange=${v => { updateTasks(selIds, { status: v }); message.success(plural(selIds.length, 'tarefa marcada', 'tarefas marcadas') + ' como ' + STATUS[v].label); }} />
          <${Select} size="small" placeholder="Mover para projeto…" value=${null} style=${{ width: 180 }} options=${PROJECTS.map(p => ({ value: p.id, label: p.name }))} onChange=${v => { updateTasks(selIds, { project: v }); message.success('Movidas para ' + P[v].name); }} />

          <${Button} size="small" icon=${html`<${I.ContainerOutlined} />`} onClick=${() => { const n = selIds.length; removeTasks(selIds); message.success(plural(n, 'tarefa arquivada', 'tarefas arquivadas')); }}>Arquivar<//>
          <${Button} size="small" danger icon=${html`<${I.DeleteOutlined} />`} onClick=${() => bulk.onClick({ key: 'delete' })}>Excluir<//>
        </div></div>` : null}
    </div>`;

  function TaskDetailPage(props) {
    const [sample, setSample] = useState('local');
    return html`<${TaskDetailView} key=${sample} ...${props} sample=${sample} setSample=${setSample} />`;
  }

  function PropPill({ icon, label, title, content, muted, tone, children }) {
    return html`<${Popover} trigger="click" placement="bottomLeft" title=${title || label} destroyTooltipOnHide content=${html`<div style=${{ width: 280, maxWidth: '80vw' }}>${content}</div>`}>
      <button type="button" className=${'ct-prop' + (muted ? ' muted' : '')} aria-label=${label} style=${tone ? { color: tone } : undefined}>
        ${icon ? createElement(I[icon], { style: { color: tone || 'var(--ct-text-3)' } }) : null}${children}
      </button>
    <//>`;
  }

  function TaskDetailView({ mode, go, screens, openTerminal, sample, setSample }) {
    const t = DETAIL[sample];
    const { message, modal } = AntApp.useApp();
    const [running, setRunning] = useState(t.running);
    const [secs, setSecs] = useState(t.secs);
    const [category, setCategory] = useState(t.category);
    const [status, setStatus] = useState(t.status);
    const [project, setProject] = useState(t.project);
    const [ctxs, setCtxs] = useState(t.contexts);
    const [tags, setTags] = useState(t.tags);
    const [energy, setEnergy] = useState(t.energy);
    const [recurrence, setRecurrence] = useState(t.recurrence);
    const [sched, setSched] = useState(t.scheduled ? { date: t.scheduled, start: t.start, end: t.end } : null);
    const [due, setDue] = useState(t.due ? { date: t.due, time: t.dueTime } : null);
    const [url, setUrl] = useState(t.url);
    const [shown, setShown] = useState([]);
    const [gcal, setGcal] = useState(t.gcal);
    const [dirInherited, setDirInherited] = useState(t.dirInherited);
    const [jiraStatus, setJiraStatus] = useState(t.jira ? t.jira.status : null);
    const [subs, setSubs] = useState(t.subtasks);
    const [addingSub, setAddingSub] = useState(false);
    const [subName, setSubName] = useState('');
    const [deps, setDeps] = useState(t.deps);
    const [archived, setArchived] = useState(false);
    const [inspectorOpen, setInspectorOpen] = useState(true);
    const [inspectorDrawer, setInspectorDrawer] = useState(false);
    const [inspTab, setInspTab] = useState('tempo');
    const [narrowTab, setNarrowTab] = useState('n');
    const [noteTab, setNoteTab] = useState('notas');
    const [focus, setFocus] = useState(false);
    const [jiraFields, setJiraFields] = useState(false);
    const [sessions, setSessions] = useState(t.sessions);
    const [editing, setEditing] = useState(null);
    const [draft, setDraft] = useState({ start: '', end: '' });
    const [addValue, setAddValue] = useState('');
    const [totalValue, setTotalValue] = useState('');
    const [limit, setLimit] = useState(4 * 3600);
    const [limitValue, setLimitValue] = useState('04:00:00');
    const blocked = deps.some(d => !d.done);
    const doneSubs = subs.filter(s => s.done).length;
    const wide = screens.xl;
    const narrow = !screens.md;

    useEffect(() => { if (!running) return; const i = setInterval(() => setSecs(s => s + 1), 1000); return () => clearInterval(i); }, [running]);
    useEffect(() => {
      if (!focus) return;
      const h = e => { if (e.key === 'Escape') setFocus(false); };
      window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
    }, [focus]);

    const parseHms = v => { const p = String(v).trim().split(':').map(Number); if (p.some(isNaN) || !p.length || p.length > 3) return null; while (p.length < 3) p.push(0); return p[0] * 3600 + p[1] * 60 + p[2]; };
    const minutesBetween = (a, b) => { const [ah, am] = a.split(':').map(Number), [bh, bm] = b.split(':').map(Number); return ((bh * 60 + bm) - (ah * 60 + am)) * 60; };
    const closedTotal = sessions.filter(s => s.end).reduce((a, s) => a + s.dur, 0);
    const pct = limit ? Math.round(secs / limit * 100) : 0;
    const overLimit = limit && pct >= 100;
    const limitColor = pct >= 100 ? PALETTE[mode].error : pct >= 80 ? PALETTE[mode].warning : PALETTE[mode].success;
    const soft = def => def[mode][1];
    const ddmm = d => d.split('-').reverse().slice(0, 2).join('/');
    const toIso = d => d ? d.format('YYYY-MM-DD') : null;
    const addSub = () => { if (!subName.trim()) return; setSubs([...subs, { id: Date.now(), name: subName.trim(), done: false }]); setSubName(''); setAddingSub(false); };
    const showRelations = () => { setInspTab('relacoes'); setNarrowTab('r'); if (wide) setInspectorOpen(true); else if (!narrow) setInspectorDrawer(true); };
    const toggleInspector = () => { if (wide) setInspectorOpen(!inspectorOpen); else setInspectorDrawer(true); };

    const statusSelect = html`<${Select} size="small" variant="filled" value=${status} onChange=${v => { setStatus(v); message.success('Status alterado'); }} style=${{ width: 152 }} aria-label="Status" popupMatchSelectWidth=${false}
      options=${Object.entries(STATUS).map(([k, v]) => ({ value: k, disabled: k === 'executando' && blocked, label: html`<${Space} size=${6}>${createElement(I[v.icon], { style: { color: v[mode][0] } })}${v.label}<//>` }))} />`;

    const moreMenu = {
      items: [
        { key: 'copy', icon: createElement(I.CopyOutlined), label: 'Copiar #' + t.id },
        { key: 'reset', icon: createElement(I.UndoOutlined), label: 'Zerar tempo…' },
        { key: 'archive', icon: createElement(archived ? I.UndoOutlined : I.ContainerOutlined), label: archived ? 'Desarquivar' : 'Arquivar' },
        { type: 'divider' },
        { key: 'delete', icon: createElement(I.DeleteOutlined), label: 'Excluir tarefa…', danger: true }
      ],
      onClick: ({ key }) => {
        if (key === 'copy') { try { navigator.clipboard.writeText(String(t.id)).catch(() => {}); } catch (e) {} message.success('#' + t.id + ' copiado'); }
        if (key === 'archive') { setArchived(!archived); message.success(archived ? 'Tarefa desarquivada' : 'Tarefa arquivada'); }
        if (key === 'reset') modal.confirm({ title: 'Zerar o tempo da tarefa?', content: 'Todas as sessões são apagadas e o total volta a zero.', okText: 'Zerar', okButtonProps: { danger: true }, cancelText: 'Cancelar', onOk: () => { setRunning(false); setSecs(0); setSessions([]); message.success('Tempo zerado'); } });
        if (key === 'delete') modal.confirm({ title: 'Excluir esta tarefa?', content: 'Apaga a tarefa, as sessões, as notas e o desenho. No Notion e no Google também, se estiverem ligados.', okText: 'Excluir', okButtonProps: { danger: true }, cancelText: 'Cancelar', onOk: () => go('tarefas') });
      }
    };

    const timerBlock = html`<div className="ct-timerblock">
      ${running ? html`<span className="ct-live" aria-label="Timer rodando"></span>` : null}

      <${Tooltip} title=${blocked && !running ? 'Bloqueada por dependências' : ''}>
        <${Button} type="primary" disabled=${blocked && !running} icon=${html`<${running ? I.PauseOutlined : I.CaretRightOutlined} />`} onClick=${() => setRunning(!running)}>${screens.lg ? (running ? 'Pausar' : 'Iniciar') : null}<//>
      <//>
      <${Tooltip} title="Finalizar tarefa"><${Button} aria-label="Finalizar" icon=${html`<${I.CheckOutlined} />`} onClick=${() => { setRunning(false); setStatus('finalizada'); message.success('Tarefa finalizada'); }} /><//>
    </div>`;

    const headActions = html`<${Flex} gap=${4} align="center">
      <${Tooltip} title=${"Terminal em " + t.workingDir + " (Ctrl+')"}><${Button} type="text" aria-label="Terminal" icon=${html`<${I.CodeOutlined} />`} onClick=${openTerminal} /><//>
      ${t.jira ? html`<${Tooltip} title="Campos do Jira"><${Button} type="text" aria-label="Campos do Jira" icon=${html`<${I.ControlOutlined} />`} onClick=${() => setJiraFields(true)} /><//>` : null}

      <${Dropdown} menu=${moreMenu} trigger=${['click']} placement="bottomRight"><${Button} type="text" aria-label="Mais ações" icon=${html`<${I.EllipsisOutlined} />`} /><//>

      { key: 'tags', label: 'Tags', icon: 'TagsOutlined', set: tags.length > 0 },

          <//>
          ${due ? html`<a onClick=${() => setDue(null)}>Remover prazo</a>` : null}
        <//>`}>
        ${due ? `Prazo ${ddmm(due.date)}${due.time ? ' ' + due.time : ''}` : 'Prazo'}
      <//>
      <${PropPill} label="Energia" content=${html`<${Flex} gap=${4}>${Object.keys(ENERGY).map(k => html`<${Button} key=${k} size="small" type=${energy === k ? 'primary' : 'default'} ghost=${energy === k} style=${{ flex: 1 }} onClick=${() => setEnergy(energy === k ? null : k)} aria-pressed=${energy === k}><${Energy} level=${k} />${ENERGY[k].label}<//>`)}<//>`}
        muted=${!energy}>
        ${energy ? html`<${Energy} level=${energy} />` : null}${energy ? 'Energia ' + ENERGY[energy].label.toLowerCase() : 'Energia'}
      <//>
      ${visible('programado') ? html`<${PropPill} label="Programado" icon="ScheduleOutlined" muted=${!sched} content=${html`<${Flex} vertical gap=${8}>

            value=${sched && sched.start ? [dayjs('2026-01-01 ' + sched.start), sched.end ? dayjs('2026-01-01 ' + sched.end) : null] : null}

          <${Button} icon=${html`<${I.ExportOutlined} />`} disabled=${!/^https?:\/\//.test(url)} href=${url || undefined} target="_blank" aria-label="Abrir no navegador" />
        <//>`}>
        ${url ? url.replace(/^https?:\/\//, '').split('/')[0] : 'Link'}
      <//>` : null}
      ${hidden.length ? html`<${Dropdown} trigger=${['click']} menu=${{ items: hidden.map(o => ({ key: o.key, icon: createElement(I[o.icon]), label: o.label })), onClick: ({ key }) => setShown(shown.concat(key)) }}>
        <button type="button" className="ct-prop muted" aria-label="Adicionar propriedade"><${I.PlusOutlined} />Propriedade</button>
      <//>` : null}
    </div>`;

    const head = html`<div className="ct-taskhead">
      <${Flex} align="center" gap=${6} wrap="wrap">
        <${Button} size="small" type="text" icon=${html`<${I.ArrowLeftOutlined} />`} onClick=${() => go('tarefas')}>Tarefas<//>
        ${project ? html`<${Text} type="secondary">/<//><a onClick=${() => go('projetos')} style=${{ color: 'var(--ct-text-2)' }}>${P[project].name}</a>` : null}
        <span style=${{ flex: 1 }}></span>
        <${Text} type="secondary" style=${{ fontSize: 12 }}>Exemplo:<//>
        <${Segmented} size="small" value=${sample} onChange=${setSample} options=${[{ value: 'local', label: 'Task local' }, { value: 'jira', label: 'Task do Jira' }]} />
      <//>
      <div className="ct-taskhead-main">
        <div style=${{ flex: '1 1 380px', minWidth: 0 }}>
          <${Flex} align="center" gap=${8} wrap="wrap">
            ${statusSelect}
            <${Tooltip} title="Copiar número"><${Tag} bordered=${false} className="ct-mono" style=${{ cursor: 'pointer', margin: 0 }} onClick=${() => moreMenu.onClick({ key: 'copy' })}>#${t.id}<//><//>
            ${t.jira ? html`<${Tag} bordered=${false} color="blue" style=${{ margin: 0 }}>${t.jira.type} · ${t.jira.key} · ${jiraStatus}<//>` : null}
            ${archived ? html`<${Tag} bordered=${false} style=${{ margin: 0 }}>Arquivada<//>` : null}
          <//>
          <${Input} variant="borderless" defaultValue=${t.name} aria-label="Nome da tarefa" className="ct-taskname-input" />
          <${Input.TextArea} variant="borderless" autoSize=${{ minRows: 1, maxRows: 4 }} placeholder="Adicionar descrição" defaultValue=${t.description} aria-label="Descrição" style=${{ padding: '0', color: 'var(--ct-text-2)' }} />
        </div>
        <${Flex} align="center" gap=${8} wrap="wrap" style=${{ flex: 'none' }}>${timerBlock}${headActions}<//>
      </div>
      ${propBar}
      ${blocked ? html`<${Alert} type="warning" showIcon icon=${html`<${I.LockOutlined} />`} style=${{ marginTop: 12 }}
        message=${'Bloqueada por dependências: ' + deps.filter(d => !d.done).map(d => d.name).join(', ')}
        action=${html`<${Button} size="small" onClick=${showRelations}>Ver dependências<//>`} />` : null}
    </div>`;

    const sessionsList = html`<${List} size="small" dataSource=${sessions} locale=${{ emptyText: 'Nenhuma sessão registrada' }}
      renderItem=${s => s.end === null
        ? html`<${List.Item} key=${s.id}><${Flex} align="center" gap=${8} style=${{ width: '100%' }}>
            <span className="ct-live"></span><span className="ct-mono">${s.day} ${s.start} – agora</span>
            <span style=${{ flex: 1 }}></span><span className="ct-mono">+${fmt(Math.max(0, secs - closedTotal))}</span>
          <//><//>`
        : editing === s.id
          ? html`<${List.Item} key=${s.id}><${Flex} align="center" gap=${6} wrap="wrap" style=${{ width: '100%' }}>
              <span className="ct-mono">${s.day}</span>
              <${Input} size="small" className="ct-mono" style=${{ width: 68 }} aria-label="Início" value=${draft.start} onChange=${e => setDraft({ ...draft, start: e.target.value })} />
              <span>–</span>

              <span style=${{ flex: 1 }}></span>
              <${Button} size="small" type="primary" onClick=${() => {
                const dur = minutesBetween(draft.start, draft.end);
                if (!(dur > 0)) { message.error('O fim precisa ser depois do início (HH:MM).'); return; }
                setSecs(x => x - s.dur + dur);
                setSessions(list => list.map(it => it.id === s.id ? { ...it, start: draft.start, end: draft.end, dur } : it));

              }}>Salvar<//>
              <${Button} size="small" onClick=${() => setEditing(null)}>Cancelar<//>
            <//><//>`
          : html`<${List.Item} key=${s.id} actions=${[
              html`<${Tooltip} key="e" title="Editar início e fim"><${Button} size="small" type="text" aria-label="Editar sessão" icon=${html`<${I.EditOutlined} />`} onClick=${() => { setEditing(s.id); setDraft({ start: s.start, end: s.end }); }} /><//>`,

                onConfirm=${() => { setSecs(x => Math.max(0, x - s.dur)); setSessions(list => list.filter(it => it.id !== s.id)); message.success('Sessão excluída'); }}>
                <${Button} size="small" type="text" danger aria-label="Excluir sessão" icon=${html`<${I.DeleteOutlined} />`} />

    const adjustments = html`<${Flex} vertical gap=${10}>

      <${Field} label="Total">

          <${Input} className="ct-mono" placeholder=${fmt(secs)} value=${totalValue} onChange=${e => setTotalValue(e.target.value)} aria-label="Novo total" />
          <${Button} onClick=${() => { const v = parseHms(totalValue); if (v === null || totalValue === '') { message.error('Use HH:MM:SS.'); return; } setSecs(v); setTotalValue(''); message.success('Total definido em ' + fmt(v)); }}>Definir<//>

        <//>
      <//>
      ${limit ? html`<a style=${{ alignSelf: 'flex-end' }} onClick=${() => { setLimit(0); setLimitValue(''); }}>Remover limite</a>` : null}
    <//>`;

    const tempoTab = html`<${Flex} vertical gap=${16}>
      ${limit ? html`<div>
        <${Flex} justify="space-between"><${Text} type="secondary" style=${{ fontSize: 12 }}>Limite ${fmtShort(limit)}<//><span className="ct-mono" style=${{ fontSize: 12, color: limitColor }}>${pct}%</span><//>
        <${Progress} percent=${Math.min(100, pct)} showInfo=${false} strokeColor=${limitColor} />
      </div>` : null}
      <${Row} gutter=${12}>
        <${Col} span=${12}><${Statistic} title="Total" value=${fmtShort(secs)} valueStyle=${{ fontFamily: 'var(--ct-mono)' }} /><//>
        <${Col} span=${12}><${Statistic} title="Sessões" value=${sessions.length} valueStyle=${{ fontFamily: 'var(--ct-mono)' }} /><//>
      <//>
      <${Section} icon="FieldTimeOutlined" title="Sessões" extra=${sessions.length}>${sessionsList}<//>
      <${Section} icon="EditOutlined" title="Ajustes de tempo">${adjustments}<//>
    <//>`;

    const detalhesTab = html`<${Flex} vertical gap=${20}>
      ${t.jira ? html`<${Section} icon="ApiOutlined" title="Jira">
        <${Field} label="Issue"><${Flex} gap=${6} align="center" wrap="wrap"><${Tag} bordered=${false} style=${{ margin: 0 }}>${t.jira.type}<//><a className="ct-mono" href=${t.url} target="_blank" rel="noopener">${t.jira.key}</a><//><//>
        <${Field} label="Status Jira"><${Select} value=${jiraStatus} onChange=${v => { setJiraStatus(v); message.success('Transição enviada ao Jira'); }} style=${{ width: '100%' }} options=${['A fazer', 'Em andamento', 'Em revisão', 'Concluído'].map(v => ({ value: v, label: v }))} /><//>
        <${Field} label="Pai"><a href=${'https://exemplo.atlassian.net/browse/' + t.jira.parentKey} target="_blank" rel="noopener"><span className="ct-mono">${t.jira.parentKey}</span> ${t.jira.parentSummary} <${I.ExportOutlined} /></a><//>
        <${Button} icon=${html`<${I.ControlOutlined} />`} onClick=${() => setJiraFields(true)} style=${{ alignSelf: 'start' }}>Campos do Jira<//>
      <//>` : null}
      <${Section} icon="CalendarOutlined" title="Google Calendar">
        <${Flex} gap=${8} align="center">
          <${Switch} size="small" checked=${gcal} onChange=${v => { setGcal(v); message.success(v ? 'Enviada para a agenda TickTask' : 'Eventos apagados do Google'); }} aria-label="Sincronizar com o Google Calendar" />
          <${Text} style=${{ flex: 1 }}>${gcal ? 'Na agenda TickTask' : 'Fora do Google Calendar'}<//>
          ${gcal ? html`<${Tooltip} title="Ressincronizar"><${Button} size="small" type="text" aria-label="Ressincronizar" icon=${html`<${I.SyncOutlined} />`} /><//>` : null}
        <//>
        <${Text} type="secondary" style=${{ fontSize: 12 }}>Programado e prazo viram eventos; blocos de tempo também.<//>
      <//>
      <${Section} icon="CodeOutlined" title="Ambiente">
        <${Field} label="Diretório">
          <${Flex} gap=${6} align="center" wrap="wrap">
            <${Tooltip} title=${t.workingDir}><${Text} className="ct-mono" style=${{ fontSize: 12 }}>…/${t.workingDir.split('/').slice(-2).join('/')}<//><//>
            ${dirInherited ? html`<${Tag} bordered=${false} style=${{ margin: 0 }}>do projeto<//>` : null}
            <${Button} size="small" icon=${html`<${I.FolderOpenOutlined} />`} onClick=${() => { setDirInherited(false); message.info('Abre o seletor de pasta do sistema'); }}>Alterar<//>
            ${!dirInherited ? html`<${Tooltip} title="Voltar a usar o diretório do projeto"><${Button} size="small" type="text" aria-label="Herdar do projeto" icon=${html`<${I.UndoOutlined} />`} onClick=${() => setDirInherited(true)} /><//>` : null}
          <//>
        <//>
        <${Field} label="Comando"><${Input} className="ct-mono" placeholder="Comando ao abrir o terminal" defaultValue=${t.startCommand} aria-label="Comando ao abrir o terminal" /><//>
        <${Button} icon=${html`<${I.CodeOutlined} />`} onClick=${openTerminal} style=${{ alignSelf: 'start' }}>Abrir terminal<//>
      <//>
    <//>`;

    const relacoesTab = html`<${Flex} vertical gap=${20}>
      <${Section} icon="CheckSquareOutlined" title="Subtarefas" extra=${subs.length ? doneSubs + '/' + subs.length : null}>
        ${blocked && subs.length ? html`<${Alert} type="warning" showIcon message="Subtarefas bloqueadas: conclua as dependências da tarefa pai primeiro." />` : null}
        ${subs.length ? html`<${Progress} percent=${Math.round(doneSubs / subs.length * 100)} size="small" />` : null}
        ${subs.map(s => html`<${Flex} key=${s.id} gap=${8} align="center">
          <${Checkbox} checked=${s.done} disabled=${blocked} onChange=${e => setSubs(subs.map(x => x.id === s.id ? { ...x, done: e.target.checked } : x))} aria-label=${'Concluir ' + s.name} />
          <a className=${'ct-taskname' + (s.done ? ' done' : '')} style=${{ color: 'var(--ct-text)' }} onClick=${() => go('tarefa')}>${s.name}</a>
        <//>`)}
        ${addingSub
          ? html`<${Space.Compact} style=${{ width: '100%' }}>
              <${Input} autoFocus placeholder="Nome da subtarefa" value=${subName} onChange=${e => setSubName(e.target.value)} onPressEnter=${addSub} onKeyDown=${e => { if (e.key === 'Escape') setAddingSub(false); }} aria-label="Nome da subtarefa" />
              <${Button} type="primary" onClick=${addSub}>Adicionar<//>
              <${Button} onClick=${() => setAddingSub(false)}>Cancelar<//>
            <//>`
          : html`<${Button} size="small" type="dashed" icon=${html`<${I.PlusOutlined} />`} onClick=${() => setAddingSub(true)} style=${{ alignSelf: 'start' }}>Nova subtarefa<//>`}
      <//>
      <${Section} icon="LockOutlined" title="Depende de">
        ${deps.map(d => html`<${Flex} key=${d.id} gap=${8} align="center" style=${{ padding: '6px 10px', borderRadius: 8, background: d.done ? soft(STATUS.executando) : soft(CATEGORY.prioridade) }}>
          <${I.LockOutlined} style=${{ color: d.done ? STATUS.executando[mode][0] : CATEGORY.prioridade[mode][0] }} />
          <span style=${{ flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>${d.name}</span>
          <${Text} style=${{ fontSize: 12, color: d.done ? STATUS.executando[mode][0] : CATEGORY.prioridade[mode][0] }}>${d.done ? '✓ concluída' : 'pendente'}<//>
          <${Tooltip} title="Remover dependência"><${Button} size="small" type="text" aria-label="Remover dependência" icon=${html`<${I.CloseOutlined} />`} onClick=${() => setDeps(deps.filter(x => x.id !== d.id))} /><//>
        <//>`)}
        <${Select} showSearch placeholder="Adicionar dependência…" value=${null} optionFilterProp="title" aria-label="Adicionar dependência"
          onChange=${id => { const x = TASKS.find(z => z.id === id); if (x) setDeps(deps.concat({ id: x.id, name: x.name, done: x.status === 'finalizada' })); }}
          options=${TASKS.filter(x => x.id !== t.id && !deps.some(d => d.id === x.id)).slice(0, 10).map(x => ({ value: x.id, title: x.name, label: html`<${Flex} justify="space-between" gap=${8}><span style=${{ overflow: 'hidden', textOverflow: 'ellipsis' }}>${x.name}</span><${Chip} def=${STATUS[x.status]} mode=${mode} /><//>` }))} />
      <//>
      ${t.jira ? html`<${Section} icon="ApartmentOutlined" title="Issues filhas no Jira" extra=${t.jira.children.length}>
        <${List} size="small" split=${false} dataSource=${t.jira.children} renderItem=${c => html`<${List.Item} style=${{ padding: '4px 0' }}>
          <${Flex} gap=${6} align="center" style=${{ width: '100%', minWidth: 0 }}>
            <${Tag} bordered=${false} style=${{ margin: 0 }}>${c.type}<//>
            ${c.imported ? html`<a className="ct-mono" onClick=${() => go('tarefa')}>${c.key}</a>` : html`<a className="ct-mono" href=${'https://exemplo.atlassian.net/browse/' + c.key} target="_blank" rel="noopener">${c.key} <${I.ExportOutlined} /></a>`}
            <span style=${{ flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>${c.summary}</span>
            <${Text} type="secondary" style=${{ fontSize: 12 }}>${c.status}<//>
          <//>
        <//>`} />
      <//>` : null}
    <//>`;

    const relLabel = html`<${Space} size=${4}>${blocked ? html`<${I.LockOutlined} style=${{ color: CATEGORY.prioridade[mode][0] }} />` : null}Relações${subs.length ? html`<${Text} type="secondary" className="ct-mono" style=${{ fontSize: 12 }}>${doneSubs}/${subs.length}<//>` : null}<//>`;
    const inspectorTabs = [
      { key: 'tempo', label: html`<${Space} size=${4}><${I.FieldTimeOutlined} />Tempo<//>`, children: tempoTab },
      { key: 'detalhes', label: html`<${Space} size=${4}><${I.ProfileOutlined} />Detalhes<//>`, children: detalhesTab },
      { key: 'relacoes', label: relLabel, children: relacoesTab }
    ];
    const inspector = html`<${Tabs} activeKey=${inspTab} onChange=${setInspTab} items=${inspectorTabs} size="small" />`;

    const noteBody = noteTab === 'notas'
      ? html`<div className="ct-note">
          <h3>Escopo</h3>
          <p>Pesquisar UI/UX para apps GTD, criar a pasta <code>docs/design</code>, o guia de orientação e um protótipo em Ant Design com paleta própria.</p>
          <p>Não perder as <b>abas de status</b>. AppShell isolando crashes, responsivo e com modo escuro.</p>
          <p>As notas são a área principal desta tela: é aqui que se retoma o trabalho.</p>
        </div>`
      : html`<div className="ct-draw-area"><${Empty} image=${html`<${I.HighlightOutlined} style=${{ fontSize: 40, color: 'var(--ct-text-3)' }} />`} description="Excalidraw carrega aqui sob demanda" /></div>`;

    const workspace = html`<${Card} size="small" className="ct-workspace" styles=${{ body: { padding: 0, display: 'flex', flexDirection: 'column', minHeight: narrow ? 360 : 520 } }}>
      <${Flex} align="center" gap=${4} style=${{ padding: '0 8px 0 12px', borderBottom: '1px solid var(--ct-border)' }}>
        <${Tabs} activeKey=${noteTab} onChange=${setNoteTab} size="small" tabBarStyle=${{ margin: 0 }} style=${{ flex: 1, marginBottom: -1 }}
          items=${[{ key: 'notas', label: html`<${Space} size=${4}><${I.FileTextOutlined} />Notas<//>` }, { key: 'desenho', label: html`<${Space} size=${4}><${I.HighlightOutlined} />Desenho<//>` }]} />
        <${Tooltip} title="Modo foco (Esc sai)"><${Button} type="text" aria-label="Modo foco" icon=${html`<${I.ExpandOutlined} />`} onClick=${() => setFocus(true)} /><//>
      <//>
      <div style=${{ padding: '20px 24px', flex: 1 }}>${noteBody}</div>
    <//>`;

    const jiraDrawer = html`<${Drawer} open=${jiraFields} onClose=${() => setJiraFields(false)} width=${380} title=${t.jira ? 'Campos do Jira · ' + t.jira.key : 'Campos do Jira'}>
      <${Flex} vertical gap=${12}>
        <${Field} label="Responsável"><${Select} defaultValue="eu" options=${[{ value: 'eu', label: 'Você' }, { value: 'time', label: 'Outra pessoa do time' }]} style=${{ width: '100%' }} /><//>
        <${Field} label="Story points"><${InputNumber} defaultValue=${5} min=${0} style=${{ width: '100%' }} /><//>
        <${Field} label="Sprint"><${Select} defaultValue="48" options=${[{ value: '47', label: 'Sprint 47' }, { value: '48', label: 'Sprint 48' }]} style=${{ width: '100%' }} /><//>
        <${Field} label="Prioridade"><${Select} defaultValue="alta" options=${['Mais alta', 'Alta', 'Média', 'Baixa'].map(v => ({ value: v.toLowerCase(), label: v }))} style=${{ width: '100%' }} /><//>
        <${Text} type="secondary" style=${{ fontSize: 12 }}>Campos lidos do editmeta da issue; cada um grava na hora (PUT na issue).<//>
      <//>
    <//>`;

    if (focus) return html`<div className="ct-zen" role="dialog" aria-modal="true" aria-label="Modo foco">
      <div className="ct-zen-bar">
        <${Button} type="text" icon=${html`<${I.ArrowLeftOutlined} />`} onClick=${() => setFocus(false)}>${screens.sm ? 'Sair' : null}<//>
        <span className="ct-zen-title">${t.name}</span>
        ${running ? html`<span className="ct-live" aria-label="Timer rodando"></span>` : null}
        <span className="ct-mono">${fmt(secs)}</span>
        <${Tooltip} title=${running ? 'Pausar' : 'Iniciar'}><${Button} type="text" disabled=${blocked && !running} aria-label=${running ? 'Pausar' : 'Iniciar'} icon=${html`<${running ? I.PauseOutlined : I.CaretRightOutlined} />`} onClick=${() => setRunning(!running)} /><//>
        <${Segmented} size="small" value=${noteTab} onChange=${setNoteTab} options=${[{ value: 'notas', icon: html`<${I.FileTextOutlined} />`, label: screens.sm ? 'Notas' : null }, { value: 'desenho', icon: html`<${I.HighlightOutlined} />`, label: screens.sm ? 'Desenho' : null }]} />
        <${Tooltip} title="Sair do modo foco (Esc)"><${Button} type="text" aria-label="Sair do modo foco" icon=${html`<${I.CompressOutlined} />`} onClick=${() => setFocus(false)} /><//>
      </div>
      <div className="ct-zen-body">
        ${noteTab === 'notas' ? noteBody : html`<div className="ct-zen-draw"><${Empty} image=${html`<${I.HighlightOutlined} style=${{ fontSize: 40, color: 'var(--ct-text-3)' }} />`} description="Excalidraw na largura toda" /></div>`}
      </div>
    </div>`;

    if (narrow) return html`<div className="ct-page-narrow">${head}
      <${Tabs} activeKey=${narrowTab} onChange=${setNarrowTab} items=${[
        { key: 'n', label: 'Notas', children: workspace },
        { key: 't', label: 'Tempo', children: tempoTab },
        { key: 'd', label: 'Detalhes', children: detalhesTab },
        { key: 'r', label: relLabel, children: relacoesTab }
      ]} />
      ${jiraDrawer}
    </div>`;

    return html`<div className="ct-page">${head}
      <${Row} gutter=${16} wrap=${false} style=${{ marginTop: 16 }}>
        <${Col} flex="1 1 0" style=${{ minWidth: 0 }}>${workspace}<//>
        ${wide && inspectorOpen ? html`<${Col} flex=${screens.xxl ? '0 0 420px' : '0 0 380px'} style=${{ minWidth: 0 }}><${Card} size="small" className="ct-inspector" styles=${{ body: { paddingTop: 4 } }}>${inspector}<//><//>` : null}
      <//>
      ${!wide ? html`<${Drawer} open=${inspectorDrawer} onClose=${() => setInspectorDrawer(false)} width=${400} title=${t.name} styles=${{ body: { paddingTop: 0 } }}>${inspector}<//>` : null}
      ${jiraDrawer}
    </div>`;
  }

  function TodayPage({ mode, go }) {
    const items = TASKS.filter(t => t.today);
    const planned = 6.5;
    const week = [['Seg', 7.5], ['Ter', planned], ['Qua', 4], ['Qui', 8.5], ['Sex', 3], ['Sáb', 0], ['Dom', 0]];
    return html`<div className="ct-page">
      <${Row} gutter=${[16, 16]}>
        <${Col} xs=${24} lg=${16}>
          <${Card} title="Plano de terça, 17 de novembro" extra=${html`<${Text} type="secondary" className="ct-mono">${planned}h de 8h<//>`}>
            <${Progress} percent=${Math.round(planned / 8 * 100)} showInfo=${false} style=${{ marginBottom: 12 }} />
            <${List} dataSource=${items} renderItem=${t => html`<${List.Item} actions=${[html`<span key="t" className="ct-mono">${t.dueTime || fmtShort(t.secs)}</span>`]}>
              <${List.Item.Meta} avatar=${html`<span style=${{ cursor: 'grab', color: 'var(--ct-text-3)' }} aria-label="Arrastar">⋮⋮</span>`}
                title=${html`<a onClick=${() => go('tarefa')} style=${{ color: 'var(--ct-text)' }}>${t.name}</a>`}
                description=${html`<${Space} size=${6} wrap><${Chip} def=${STATUS[t.status]} mode=${mode} /><${ProjectLabel} id=${t.project} /><//>`} />
            <//>`} />
          <//>
        <//>
        <${Col} xs=${24} lg=${8}>
          <${Card} title="Semana">
            <${Flex} vertical gap=${10}>
              ${week.map(([d, h]) => html`<${Flex} key=${d} align="center" gap=${10}>
                <${Text} style=${{ width: 32 }} strong=${d === 'Ter'}>${d}<//>
                <${Progress} percent=${Math.min(100, h / 8 * 100)} showInfo=${false} status=${h > 8 ? 'exception' : 'normal'} style=${{ flex: 1, margin: 0 }} />
                <span className="ct-mono" style=${{ width: 40, textAlign: 'right' }}>${h ? h + 'h' : '—'}</span>
              <//>`)}
            <//>
          <//>
        <//>
      <//>
    </div>`;
  }

  function ProjectsPage({ mode }) {
    return html`<div className="ct-page">
      <${Flex} justify="space-between" align="center" wrap="wrap" gap=${8} style=${{ marginBottom: 16 }}>
        <${Segmented} options=${['Ativos', 'Someday', 'Concluídos', 'Arquivados']} />
        <${Button} type="primary" icon=${html`<${I.PlusOutlined} />`}>Novo projeto<//>
      <//>
      <div className="ct-grid-auto">
        ${PROJECTS.map(p => html`<${Card} key=${p.id} hoverable size="small">
          <${Flex} vertical gap=${10}>
            <${Flex} align="center" gap=${8}><span className="ct-dot" style=${{ background: p.color, width: 10, height: 10 }}></span><${Text} strong>${p.name}<//><//>
            <${Text} type="secondary">${p.outcome}<//>
            <${Progress} percent=${Math.round(p.done / p.total * 100)} size="small" format=${() => html`<span className="ct-mono">${p.done}/${p.total}</span>`} />
            ${p.next ? null : html`<${Alert} type="warning" showIcon message="Sem próxima ação definida" action=${html`<${Button} size="small" type="link">Definir<//>`} />`}
            <${Text} type="secondary" style=${{ fontSize: 12 }}>${p.area}<//>
          <//>
        <//>`)}
      </div>
    </div>`;
  }

  function Swatch({ name, value, note }) {
    return html`<div><div className="ct-swatch" style=${{ background: value }}></div>
      <div style=${{ marginTop: 6, fontSize: 12 }}><b>${name}</b><br/><span className="ct-mono" style=${{ color: 'var(--ct-text-2)' }}>${value}</span>${note ? html`<br/><span style=${{ color: 'var(--ct-text-3)' }}>${note}</span>` : null}</div></div>`;
  }

  function IdentityPage({ mode }) {
    const c = PALETTE[mode];
    return html`<div className="ct-page">
      <${Flex} vertical gap=${24}>
        <div>
          <div className="ct-eyebrow">Direção</div>
          <${Title} level=${3} style=${{ margin: '4px 0 8px' }}>Bancada: calma para pensar, precisa para executar<//>
          <${Paragraph} type="secondary" style=${{ maxWidth: '68ch' }}>Superfícies neutras com leve tom violeta, cor só onde existe estado. O roxo da marca marca a ação; verde só para o que está rodando agora. Números em fonte mono tabular, porque tempo é o dado mais lido do app.<//>
        </div>
        <${Card} title=${'Base — modo ' + (mode === 'dark' ? 'escuro' : 'claro')} size="small">
          <div className="ct-grid-auto" style=${{ gridTemplateColumns: 'repeat(auto-fill, minmax(120px, 1fr))' }}>
            <${Swatch} name="Fundo" value=${c.bg} /><${Swatch} name="Superfície" value=${c.surface} /><${Swatch} name="Elevada" value=${c.elevated} />
            <${Swatch} name="Borda" value=${c.border} /><${Swatch} name="Texto" value=${c.text} /><${Swatch} name="Texto 2" value=${c.text2} />
            <${Swatch} name="Primária" value=${c.primary} note="ações" /><${Swatch} name="Marca" value=${c.brand} note="logo, destaques" />
          </div>
        <//>
        <${Card} title="Status GTD — a cor reforça, o ícone e o texto informam" size="small">
          <${Flex} gap=${8} wrap="wrap">${Object.entries(STATUS).map(([k, v]) => html`<${Chip} key=${k} def=${v} mode=${mode} />`)}<//>
          <${Divider} />
          <${Flex} gap=${8} wrap="wrap">${Object.entries(CATEGORY).map(([k, v]) => html`<${Chip} key=${k} def=${v} mode=${mode} />`)}
            <${Flex} gap=${12} align="center" style=${{ marginInlineStart: 12 }}>${Object.keys(ENERGY).map(k => html`<${Space} key=${k} size=${4}><${Energy} level=${k} /><${Text} type="secondary">${ENERGY[k].label}<//><//>`)}<//>
          <//>
          <${Divider} />
          <${Flex} gap=${8} wrap="wrap">
            <div className="ct-leak-1" style=${{ padding: '8px 12px', borderRadius: 8 }}>Time leak 30 min+</div>
            <div className="ct-leak-2" style=${{ padding: '8px 12px', borderRadius: 8 }}>1h+</div>
            <div className="ct-leak-3" style=${{ padding: '8px 12px', borderRadius: 8 }}>2h+</div>
          <//>
        <//>
        <${Card} title="Tipografia" size="small">
          <${Flex} vertical gap=${8}>
            <span className="ct-logo" style=${{ fontSize: 28 }}>CrafyTask</span><${Text} type="secondary" style=${{ fontSize: 12 }}>Denk One — só o logo<//>
            <${Title} level=${3} style=${{ margin: 0 }}>Geist 24/600 — título de tela<//>
            <${Text} style=${{ fontSize: 16, fontWeight: 600 }}>Geist 16/600 — título de seção<//>
            <${Text}>Geist 14/400 — texto de interface e tabela<//>
            <${Text} type="secondary" style=${{ fontSize: 12 }}>Geist 12/400 — metadados<//>
            <span className="ct-hero-time" style=${{ fontSize: 40 }}>02:32:10</span><${Text} type="secondary" style=${{ fontSize: 12 }}>Geist Mono tabular — tempo, ids, contadores<//>
          <//>
        <//>
        <${Card} title="Componentes antd com o tema" size="small">
          <${Flex} gap=${8} wrap="wrap" align="center">
            <${Button} type="primary">Primária<//><${Button}>Padrão<//><${Button} type="text">Texto<//><${Button} danger>Excluir<//>
            <${Switch} defaultChecked /><${Segmented} options=${['Dia', 'Semana', 'Mês']} />
            <${Badge} count=${5} color="var(--ct-primary)"><${Avatar} shape="square" icon=${html`<${I.InboxOutlined} />`} /><//>
          <//>
          <${Divider} />
          <${Row} gutter=${[12, 12]}>
            <${Col} xs=${24} md=${8}><${Alert} type="success" showIcon message="Sincronizado com o Notion" /><//>
            <${Col} xs=${24} md=${8}><${Alert} type="warning" showIcon message="Projeto sem próxima ação" /><//>
            <${Col} xs=${24} md=${8}><${Alert} type="error" showIcon message="Falha ao enviar worklog" /><//>
          <//>
        <//>
      <//>
    </div>`;
  }

  function Placeholder({ route, go }) {
    const item = ROUTE_OF[route];
    return html`<div className="ct-page"><${Result} icon=${html`<${I.ProjectOutlined} style=${{ color: 'var(--ct-text-3)' }} />`} title=${(item ? item.label : 'Tela') + ' — fora deste protótipo'}
      subTitle=${html`<span>Rota atual <code>${item && item.route}</code>. Usa o mesmo AppShell e os padrões do guia. O comportamento de hoje está em <code>docs/ui/${ROUTE_DOCS[route]}.md</code> e a fase dela em <code>docs/design/plano-de-refatoracao.md</code>.</span>`}
      extra=${html`<${Button} onClick=${() => go('tarefas')}>Voltar para Tarefas<//>`} /></div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${Shell} />`);
})();
</script>
