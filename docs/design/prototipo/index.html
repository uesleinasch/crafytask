    { key: 'sessions', label: 'Sessões registradas', swatch: 'session' },
    { key: 'weekend', label: 'Fins de semana', swatch: null }
  ];

  function layoutDay(items) {
    const sorted = items.slice().sort((a, b) => toMin(a.start) - toMin(b.start) || toMin(b.end) - toMin(a.end));
    const out = []; let cluster = []; let clusterEnd = -1;
    const flush = () => { const cols = []; cluster.forEach(it => { let c = cols.findIndex(end => end <= toMin(it.start)); if (c < 0) { c = cols.length; cols.push(0); } cols[c] = toMin(it.end); it._col = c; }); cluster.forEach(it => { it._cols = cols.length; out.push(it); }); cluster = []; };
    sorted.forEach(it => { const it2 = { ...it }; if (cluster.length && toMin(it2.start) >= clusterEnd) flush(); cluster.push(it2); clusterEnd = Math.max(clusterEnd, toMin(it2.end)); });
    flush();
    return out;
  }

  function CalSwatch({ kind, mode }) {
    if (kind === 'block') return html`<span className="ct-calsw ct-calblock" style=${{ position: 'static' }}></span>`;
    if (kind === 'event') return html`<span className="ct-calsw ct-calblock event" style=${{ position: 'static' }}></span>`;
    if (kind === 'chip') return html`<span className="ct-calsw" style=${{ background: 'var(--ct-bg)', border: '1px solid var(--ct-border-strong)' }}></span>`;
    if (kind === 'due') return html`<${I.FlagOutlined} style=${{ color: STATUS.aguardando[mode][0] }} />`;
    if (kind === 'session') return html`<span className="ct-calsw" style=${{ width: 4, background: 'var(--ct-primary)' }}></span>`;
    return null;
  }

  function CalendarPage({ mode, go, isMobile, screens, compact }) {
    const { message, modal } = AntApp.useApp();
    const [cursor, setCursor] = useState(() => dayjs(TODAY));
    const defView = screens.lg ? 'week' : screens.md ? '3days' : 'day';
    const [view, setView] = useState(defView);
    const [items, setItems] = useState(CAL_SEED);
    const [allday, setAllday] = useState(CAL_ALLDAY);
    const [dueMap, setDueMap] = useState(() => Object.fromEntries(TASKS.filter(t => t.due && t.status !== 'finalizada').map(t => [t.id, t.due])));
    const [show, setShow] = useState(() => new Set(['block', 'event', 'scheduled', 'due', 'sessions', 'weekend']));
    const [panel, setPanel] = useState(!!screens.xl);
    const [openId, setOpenId] = useState(null);
    const [draft, setDraft] = useState(null);
    const [drag, setDrag] = useState(null);
    const [panelQ, setPanelQ] = useState('');
    const hourH = compact ? 40 : 48;
    const pxMin = hourH / 60;
    const [h0, h1] = CAL_RANGE;
    const gridRef = React.useRef(null);
    const scrollRef = React.useRef(null);
    const T = id => TASKS.find(t => t.id === id) || { id, name: 'Tarefa', project: null, category: 'normal', status: 'proximas' };

    useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = Math.max(0, (toMin(CAL_NOW) - h0 * 60) * pxMin - 160); }, [view]);

    const days = view === 'week' ? Array.from({ length: 7 }, (_, i) => weekStartOf(cursor).add(i, 'day'))
      : view === '3days' ? Array.from({ length: 3 }, (_, i) => cursor.add(i, 'day'))
      : view === 'day' ? [cursor] : [];
    const visibleDays = show.has('weekend') || view !== 'week' ? days : days.filter(d => d.day() !== 0 && d.day() !== 6);
    const step = { week: [1, 'week'], '3days': [3, 'day'], day: [1, 'day'], month: [1, 'month'], agenda: [14, 'day'] }[view];
    const label = view === 'month' ? cursor.format('MMMM [de] YYYY')
      : view === 'day' ? cursor.format('dddd, D [de] MMMM')
      : view === 'agenda' ? `${cursor.format('D MMM')} – ${cursor.add(13, 'day').format('D MMM YYYY')}`
      : (() => { const a = days[0], b = days[days.length - 1]; return a.month() === b.month() ? `${a.format('D')}–${b.format('D [de] MMMM [de] YYYY')}` : `${a.format('D MMM')} – ${b.format('D MMM YYYY')}`; })();

    const ofDay = d => { const k = d.format('YYYY-MM-DD'); return items.filter(b => b.date === k && show.has(b.kind)); };
    const plannedMin = d => { const k = d.format('YYYY-MM-DD'); return items.filter(b => b.date === k && b.kind === 'block').reduce((a, b) => a + toMin(b.end) - toMin(b.start), 0); };
    const alldayOf = d => { const k = d.format('YYYY-MM-DD');
      const sch = show.has('scheduled') ? allday.filter(a => a.date === k).map(a => ({ ...a, t: T(a.task) })) : [];
      const due = show.has('due') ? Object.entries(dueMap).filter(([, v]) => v === k).map(([id]) => ({ id: 'd' + id, kind: 'due', task: +id, t: T(+id) })) : [];
      return sch.concat(due); };

    const updateItem = (id, patch) => setItems(xs => xs.map(b => b.id === id ? { ...b, ...patch } : b));
    const removeItem = b => { setItems(xs => xs.filter(x => x.id !== b.id)); setOpenId(null);
      message.success({ content: html`<span>Bloco excluído · <a onClick=${() => { setItems(xs => xs.concat([b])); message.destroy('undo'); }}>Desfazer</a></span>`, key: 'undo', duration: 5 }); };
    const createAt = (d, startMin, taskId) => {
      const s = Math.min(Math.max(h0 * 60, Math.round(startMin / 15) * 15), h1 * 60 - 60);
      if (taskId) { const id = Date.now(); setItems(xs => xs.concat([{ id, kind: 'block', task: taskId, date: d.format('YYYY-MM-DD'), start: fromMin(s), end: fromMin(s + 60) }])); message.success(`Bloco de 1h para ${T(taskId).name}`); return; }
      setDraft({ date: d, start: fromMin(s), end: fromMin(s + 60), task: null });
    };

    const onPointerDown = (e, b, kind) => {
      if (e.button !== 0) return;
      e.stopPropagation();
      const grid = gridRef.current; const cols = grid ? grid.querySelectorAll('.ct-calcol') : [];
      const dayW = cols.length ? cols[0].getBoundingClientRect().width : 120;
      setDrag({ id: b.id, kind, x: e.clientX, y: e.clientY, dx: 0, dy: 0, dayW, orig: b });
    };
    useEffect(() => {
      if (!drag) return;
      const move = e => setDrag(d => d && { ...d, dx: e.clientX - d.x, dy: e.clientY - d.y });

        if (!d) return null;
        const moved = Math.abs(d.dx) > 4 || Math.abs(d.dy) > 4;
        if (!moved) { setOpenId(d.id); return null; }
        const dm = Math.round(d.dy / pxMin / 15) * 15;
        const o = d.orig, len = toMin(o.end) - toMin(o.start);
        if (d.kind === 'resize') { const end = Math.min(h1 * 60, Math.max(toMin(o.start) + 15, toMin(o.end) + dm)); updateItem(o.id, { end: fromMin(end) }); message.success(`${T(o.task).name}: até ${fromMin(end)}`); }
        else { const dd = view === 'day' ? 0 : Math.round(d.dx / d.dayW); const s = Math.min(h1 * 60 - len, Math.max(h0 * 60, toMin(o.start) + dm)); const date = dayjs(o.date).add(dd, 'day').format('YYYY-MM-DD');
          updateItem(o.id, { start: fromMin(s), end: fromMin(s + len), date }); message.success(`Movido para ${dayjs(date).format('ddd DD/MM')}, ${fromMin(s)}`); }
        return null;
      });
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
      return () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    }, [!!drag]);

    const preview = b => {

      const s = Math.min(h1 * 60 - len, Math.max(h0 * 60, toMin(b.start) + dm));
      return { ...b, start: fromMin(s), end: fromMin(s + len), _dx: view === 'day' ? 0 : Math.round(drag.dx / drag.dayW) * drag.dayW };
    };

    const blockMenu = b => ({ items: [
      { key: 'open', icon: createElement(I.ExportOutlined), label: 'Abrir tarefa' },
      { key: 'timer', icon: createElement(I.PlayCircleOutlined), label: 'Iniciar timer' },
      { key: 'dup', icon: createElement(I.CopyOutlined), label: 'Repetir no dia seguinte' },
      { type: 'divider' },
      { key: 'del', icon: createElement(I.DeleteOutlined), label: 'Excluir bloco', danger: true }
    ], onClick: ({ key, domEvent }) => { if (domEvent) domEvent.stopPropagation();
      if (key === 'open') go('tarefa');
      if (key === 'timer') message.success('Timer iniciado: ' + T(b.task).name);
      if (key === 'dup') { setItems(xs => xs.concat([{ ...b, id: Date.now(), date: dayjs(b.date).add(1, 'day').format('YYYY-MM-DD') }])); message.success('Bloco repetido em ' + dayjs(b.date).add(1, 'day').format('ddd DD/MM')); }
      if (key === 'del') removeItem(b); } });

    const blockPop = b => { const t = T(b.task); const len = toMin(b.end) - toMin(b.start);
      return html`<div style=${{ width: 280, display: 'flex', flexDirection: 'column', gap: 10 }}>
        <${Flex} align="center" gap=${8}><${Tag} bordered=${false}>${b.kind === 'event' ? 'Tarefa com horário' : 'Bloco de tempo'}<//>${b.gcal ? html`<${Tooltip} title="Na agenda TickTask do Google"><${I.GoogleOutlined} style=${{ color: 'var(--ct-text-3)' }} /><//>` : null}<//>
        <a onClick=${() => go('tarefa')} style=${{ color: 'var(--ct-text)', fontWeight: 600, fontSize: 15 }}>${t.name}</a>

        <${Flex} align="center" gap=${8}>
          <${TimePicker.RangePicker} size="small" format="HH:mm" minuteStep=${15} value=${[dayjs(b.date + ' ' + b.start), dayjs(b.date + ' ' + b.end)]} allowClear=${false}

        <//>
      </div>`; };

    const blockEl = (raw, d) => { const b = preview(raw); const t = T(b.task);
      const top = (toMin(b.start) - h0 * 60) * pxMin, height = Math.max(18, (toMin(b.end) - toMin(b.start)) * pxMin - 2);
      const w = 100 / b._cols, left = b._col * w;
      const leak = t.category === 'time_leak', leakLvl = leak ? (t.secs >= 7200 ? 3 : t.secs >= 3600 ? 2 : t.secs >= 1800 ? 1 : 0) : 0, done = t.status === 'finalizada', running = t.running && b.date === TODAY && toMin(b.start) <= toMin(CAL_NOW) && toMin(b.end) >= toMin(CAL_NOW);

              aria-label=${`${t.name}, ${b.start} a ${b.end}${b.kind === 'event' ? ', tarefa com horário' : ', bloco de tempo'}`}

            </div>
          <//>
        </div>

    const sessionsEl = d => { if (!show.has('sessions')) return null; const k = d.format('YYYY-MM-DD');

    const chip = (a, small) => { const t = a.t; const isDue = a.kind === 'due'; const overdue = isDue && a.task && dueMap[a.task] < TODAY; const today = isDue && dueMap[a.task] === TODAY;

      return html`<button key=${a.id} type="button" className=${'ct-calchip' + (isDue ? ' due' : '')} draggable="true" onDragStart=${e => { e.dataTransfer.setData('text/plain', JSON.stringify({ chip: a.id, kind: a.kind, task: a.task })); }} onClick=${() => go('tarefa')}
        title=${(isDue ? 'Prazo: ' : 'Agendada: ') + t.name + (t.dueTime && isDue ? ' às ' + t.dueTime : '')}>
        ${isDue ? html`<${I.FlagOutlined} style=${{ color: tone }} />` : t.project ? html`<span className="ct-dot" style=${{ background: P[t.project].color, width: 6, height: 6 }}></span>` : null}
        <span className="ct-ellipsis">${t.name}</span>${isDue && t.dueTime && !small ? html`<span className="ct-mono" style=${{ color: 'var(--ct-text-3)' }}>${t.dueTime}</span>` : null}
      </button>`; };
    const dropOnDay = (e, d) => { e.preventDefault(); let data; try { data = JSON.parse(e.dataTransfer.getData('text/plain')); } catch (x) { return; } const k = d.format('YYYY-MM-DD');
      if (data.chip) { if (data.kind === 'due') { setDueMap(m => ({ ...m, [data.task]: k })); message.success('Prazo movido para ' + d.format('ddd DD/MM')); } else { setAllday(xs => xs.map(a => a.id === data.chip ? { ...a, date: k } : a)); message.success('Reagendada para ' + d.format('ddd DD/MM')); } return true; }
      return data; };

    const timeGrid = html`<div className="ct-calscroll" ref=${scrollRef}>
      <div className="ct-calsticky">
      <div className="ct-calhead" style=${{ gridTemplateColumns: `52px repeat(${visibleDays.length}, minmax(${view === 'week' ? 96 : 140}px, 1fr))` }}>
        <span></span>
        ${visibleDays.map(d => { const k = d.format('YYYY-MM-DD'); const isToday = k === TODAY; const pm = plannedMin(d); const over = pm > WORKDAY_H * 60;
          return html`<div key=${k} className="ct-calhead-day">
            <button type="button" className="ct-calhead-btn" onClick=${() => { setCursor(d); setView('day'); }} aria-label=${'Ver ' + d.format('dddd, D [de] MMMM')}>
              <span style=${{ textTransform: 'lowercase', color: 'var(--ct-text-3)', fontSize: 12 }}>${d.format('ddd')}</span>
              <span className=${'ct-calnum' + (isToday ? ' today' : '')}>${d.format('D')}</span>
            </button>
            <${Tooltip} title=${pm ? `${durTxt(pm)} em blocos de ${WORKDAY_H}h da jornada${over ? ' · passa da jornada' : ''}` : 'Nenhum bloco'}>
              <div className="ct-calload" aria-label=${`${durTxt(pm)} planejadas`}><span style=${{ width: Math.min(100, pm / (WORKDAY_H * 60) * 100) + '%', background: over ? STATUS.aguardando[mode][0] : 'var(--ct-primary)' }}></span></div>
            <//>
          </div>`; })}
      </div>
      <div className="ct-calallday" style=${{ gridTemplateColumns: `52px repeat(${visibleDays.length}, minmax(${view === 'week' ? 96 : 140}px, 1fr))` }}>
        <span className="ct-calhour" style=${{ alignSelf: 'center', transform: 'none' }}>Dia</span>
        ${visibleDays.map(d => { const list = alldayOf(d); const max = view === 'day' ? 6 : 2;
          return html`<div key=${d.format('YYYY-MM-DD')} className="ct-calallday-cell" onDragOver=${e => e.preventDefault()} onDrop=${e => dropOnDay(e, d)}>
            ${list.slice(0, max).map(a => chip(a))}
            ${list.length > max ? html`<${Popover} trigger="click" content=${html`<div style=${{ width: 240, display: 'flex', flexDirection: 'column', gap: 4 }}>${list.map(a => chip(a))}</div>`}><button type="button" className="ct-calmore">+${list.length - max}</button><//>` : null}

      </div>
      </div>

        <div style=${{ position: 'relative' }}>${Array.from({ length: h1 - h0 + 1 }, (_, i) => html`<span key=${i} className="ct-calhour" style=${{ top: i * hourH }}>${String(h0 + i).padStart(2, '0')}:00</span>`)}</div>
        ${visibleDays.map(d => { const k = d.format('YYYY-MM-DD'); const weekend = d.day() === 0 || d.day() === 6;
          return html`<div key=${k} className=${'ct-calcol' + (weekend ? ' weekend' : '')} style=${{ backgroundSize: `100% ${hourH}px` }}

    const toolbar = html`<${Flex} gap=${8} wrap="wrap" align="center" style=${{ marginBottom: 12 }}>
      <${Input} allowClear placeholder="Buscar por nome ou #id" prefix=${html`<${I.SearchOutlined} />`} value=${q} onChange=${e => setQ(e.target.value)} style=${{ flex: '1 1 220px', maxWidth: 320 }} aria-label="Buscar no arquivo" />
      <${Select} value=${proj} onChange=${setProj} style=${{ width: 180 }} aria-label="Projeto" options=${[{ value: 'all', label: 'Todos os projetos' }, { value: 'none', label: 'Sem projeto' }].concat(PROJECTS.map(p => ({ value: p.id, label: html`<span style=${{ display: 'inline-flex', alignItems: 'center', gap: 8 }}><span className="ct-dot" style=${{ background: p.color }}></span>${p.name}</span>` })))} />
      ${screens.md ? html`<${Select} value=${st} onChange=${setSt} style=${{ width: 160 }} aria-label="Status ao arquivar" options=${[{ value: 'all', label: 'Qualquer status' }].concat(Object.entries(STATUS).map(([k, v]) => ({ value: k, label: v.label })))} />` : null}
      <${Select} value=${age} onChange=${setAge} style=${{ width: 170 }} aria-label="Arquivada em" options=${[{ value: 'all', label: 'Qualquer data' }, { value: '30', label: 'Últimos 30 dias' }, { value: '90', label: 'Últimos 90 dias' }, { value: '365', label: 'Último ano' }]} />
      <div style=${{ flex: 1 }}></div>
      ${screens.md ? html`<${Select} value=${sort} onChange=${setSort} style=${{ width: 190 }} aria-label="Ordenar" options=${[{ value: 'recent', label: 'Arquivadas por último' }, { value: 'name', label: 'Ordenar por nome' }, { value: 'time', label: 'Mais tempo registrado' }]} />` : null}
      <${Select} value=${group} onChange=${setGroup} style=${{ width: 170 }} aria-label="Agrupar" options=${[{ value: 'month', label: 'Agrupar por mês' }, { value: 'project', label: 'Agrupar por projeto' }, { value: 'none', label: 'Sem agrupamento' }]} />
      <${Dropdown} trigger=${['click']} menu=${{ items: [{ key: 'purge', icon: createElement(I.ClearOutlined), label: 'Limpar o arquivo…', danger: true }], onClick: () => setPurge(12) }}>
        <${Button} aria-label="Mais ações do arquivo" icon=${html`<${I.EllipsisOutlined} />`} /><//>
    <//>`;

    const body = !total
      ? html`<${Empty} image=${Empty.PRESENTED_IMAGE_SIMPLE} description=${html`<span>Nada no arquivo.<br /><${Text} type="secondary">Arquive pelo menu ⋯ de uma tarefa para tirá-la das listas sem apagar nada.<//></span>`} />`
      : !list.length
        ? html`<${Empty} image=${Empty.PRESENTED_IMAGE_SIMPLE} description="Nenhuma tarefa arquivada com esses filtros."><${Button} onClick=${() => { setQ(''); setProj('all'); setSt('all'); setAge('all'); }}>Limpar filtros<//><//>`
        : html`<${Table} rowKey="id" size=${screens.xxl ? 'middle' : 'small'} columns=${columns} dataSource=${data} scroll=${{ x: 'max-content' }}
            pagination=${groups ? false : { pageSize: 20, hideOnSinglePage: true, size: 'small' }}
            rowSelection=${{ selectedRowKeys: sel, onChange: setSel, getCheckboxProps: r => ({ disabled: !!r.isGroup, style: r.isGroup ? { display: 'none' } : null }) }}
            components=${{ body: { row: MenuRow } }} onRow=${r => r.isGroup ? {} : { record: r, menu: menuFor(r) }} rowClassName=${r => r.isGroup ? 'ct-grouprow' : ''} />`;

    return html`<div className=${isMobile ? 'ct-page-narrow' : 'ct-page'}>
      <${Flex} align="flex-start" gap="8px 16px" wrap="wrap" style=${{ marginBottom: 12 }}>
        <${Flex} vertical gap=${2} style=${{ flex: '1 1 320px', minWidth: 0 }}>
          <${Text} type="secondary">Arquivar tira a tarefa de todas as listas sem apagar nada: tempo, notas e sessões continuam. Projetos arquivados ficam em <a onClick=${() => go('projetos')}>Projetos → Arquivados</a>.<//>
        <//>
        <${Text} type="secondary" className="ct-mono" style=${{ fontSize: 12 }}>${plural(total, 'tarefa', 'tarefas')} · ${fmtHM(rows.reduce((a, t) => a + t.secs, 0))} registradas<//>
      <//>
      ${oldCount ? html`<${Alert} type="info" showIcon style=${{ marginBottom: 12 }} message=${`${plural(oldCount, 'tarefa está', 'tarefas estão')} no arquivo há mais de um ano.`}
        action=${html`<${Button} size="small" onClick=${() => setPurge(12)}>Revisar e limpar<//>`} />` : null}
      ${toolbar}
      ${body}
      ${sel.length ? html`<div className="ct-bulkbar"><div className="ct-bulkbar-inner">
        <${Text} strong>${plural(sel.length, 'selecionada', 'selecionadas')}<//>
        <${Button} size="small" type="link" onClick=${() => setSel([])}>Limpar<//>
        <div style=${{ flex: 1 }}></div>
        <${Button} size="small" icon=${html`<${I.RollbackOutlined} />`} onClick=${() => restore(sel)}>Desarquivar<//>
        <${Button} size="small" danger icon=${html`<${I.DeleteOutlined} />`} onClick=${() => destroy(sel)}>Excluir de vez<//>
      </div></div>` : null}
      <${Modal} open=${!!purge} title="Limpar o arquivo" okText=${purgeCount ? `Excluir ${plural(purgeCount, 'tarefa', 'tarefas')}` : 'Nada para excluir'} okButtonProps=${{ danger: true, disabled: !purgeCount }} cancelText="Cancelar" onCancel=${() => setPurge(null)}
        onOk=${() => { const ids = rows.filter(t => dayjs(t.archivedAt).isBefore(dayjs(TODAY).subtract(purge, 'month'))).map(t => t.id); setRows(rs => rs.filter(t => !ids.includes(t.id))); setPurge(null); message.success(plural(ids.length, 'tarefa excluída', 'tarefas excluídas') + ' de vez'); }}>
        ${purge ? html`<${Flex} vertical gap=${12}>
          <${Field} label="Arquivadas há"><${Select} value=${purge} onChange=${setPurge} style=${{ width: '100%' }} options=${[[3, 'mais de 3 meses'], [6, 'mais de 6 meses'], [12, 'mais de 1 ano'], [24, 'mais de 2 anos']].map(([v, l]) => ({ value: v, label: l }))} /><//>
          <${Text}>${purgeCount ? html`<span><b>${plural(purgeCount, 'tarefa', 'tarefas')}</b> ${purgeCount === 1 ? 'vai ser apagada' : 'vão ser apagadas'} de vez, com sessões, notas e desenhos.</span>` : 'Nenhuma tarefa arquivada há tanto tempo.'}<//>
          <${Text} type="secondary" style=${{ fontSize: 12 }}>Faça um backup antes se quiser guardar o histórico de tempo (Configurações → Backup).<//>
        <//>` : null}
      <//>
    </div>`;
  }

  function Placeholder({ route, go }) {
    const item = ROUTE_OF[route];
    return html`<div className="ct-page"><${Result} icon=${html`<${I.ProjectOutlined} style=${{ color: 'var(--ct-text-3)' }} />`} title=${(item ? item.label : 'Tela') + ' — fora deste protótipo'}
      subTitle=${html`<span>Rota atual <code>${item && item.route}</code>. Usa o mesmo AppShell e os padrões do guia. O comportamento de hoje está em <code>docs/ui/${ROUTE_DOCS[route]}.md</code> e a fase dela em <code>docs/design/plano-de-refatoracao.md</code>.</span>`}
      extra=${html`<${Button} onClick=${() => go('tarefas')}>Voltar para Tarefas<//>`} /></div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${Shell} />`);
})();
</script>
