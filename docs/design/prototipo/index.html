    useEffect(() => { setSel([]); if (status !== 'executando' && view === 'kanban') setView('tabela'); }, [status]);
    useEffect(() => { setSel([]); setCollapsed(new Set()); }, [groupBy]);

    const idOf = key => Number(String(key).split(':')[1].split('@')[0]);
    const selIds = [...new Set(sel.filter(k => !String(k).startsWith('g:')).map(idOf))];
    const findTask = id => { for (const t of tasks) { if (t.id === id) return t; const s = t.subtasks.find(x => x.id === id); if (s) return s; } return null; };
    const updateTasks = (ids, patch) => setTasks(ts => ts.map(t => {
      const own = ids.includes(t.id) ? (typeof patch === 'function' ? patch(t) : patch) : {};
      return { ...t, ...own, subtasks: t.subtasks.map(s => ids.includes(s.id) ? { ...s, ...(typeof patch === 'function' ? patch(s) : patch) } : s) };
    }));
    const removeTasks = ids => { setTasks(ts => ts.filter(t => !ids.includes(t.id)).map(t => ({ ...t, subtasks: t.subtasks.filter(s => !ids.includes(s.id)) }))); setSel([]); };
    const toggleToday = ids => { const n = new Set(today); const add = ids.some(id => !n.has(id)); ids.forEach(id => add ? n.add(id) : n.delete(id)); setToday(n); message.success(add ? 'No plano de hoje' : 'Fora do plano de hoje'); };
    const plural = (n, s, p) => n + ' ' + (n === 1 ? s : p);

    const menuFor = r => {
      const many = selIds.length > 1 && selIds.includes(r.id);
      const ids = many ? selIds : [r.id];
      const n = ids.length;
      const tag = s => many ? `${s} (${n})` : s;
      const check = on => on ? '✓ ' : '';
      const items = [
        ...(many
          ? [{ key: 'hdr', type: 'group', label: plural(n, 'tarefa selecionada', 'tarefas selecionadas') }]
          : [
              { key: 'open', icon: createElement(I.FileTextOutlined), label: 'Abrir' },
              { key: 'timer', icon: createElement(r.running ? I.PauseOutlined : I.CaretRightOutlined), label: r.running ? 'Pausar timer' : 'Iniciar timer', disabled: r.blocked && !r.running }
            ]),
        { key: 'today', icon: createElement(I.ScheduleOutlined), label: tag(!many && today.has(r.id) ? 'Tirar do plano de hoje' : 'Planejar para hoje') },
        { key: 'status', icon: createElement(I.CheckCircleOutlined), label: tag('Marcar como'), children: Object.entries(STATUS).map(([k, v]) => ({
          key: 'status:' + k, icon: createElement(I[v.icon], { style: { color: v[mode][0] } }), label: (many ? '' : check(r.status === k)) + v.label,
          disabled: k === 'executando' && ids.some(id => (findTask(id) || {}).blocked) })) },
        { key: 'cat', icon: createElement(I.FlagOutlined), label: tag('Categoria'), children: Object.entries(CATEGORY).map(([k, v]) => ({ key: 'cat:' + k, label: (many ? '' : check(r.category === k)) + v.label })) },
        { key: 'proj', icon: createElement(I.FolderOutlined), label: tag('Mover para projeto'), children: [{ key: 'proj:0', label: (many ? '' : check(!r.project)) + 'Sem projeto' }].concat(PROJECTS.map(p => ({ key: 'proj:' + p.id, label: (many ? '' : check(r.project === p.id)) + p.name }))) },
        ...(many || !r.jira ? [] : [{ key: 'jira', icon: createElement(I.ApiOutlined), label: 'Jira', children: [
          { key: 'jira:open', icon: createElement(I.ExportOutlined), label: 'Abrir no Jira' },
          { key: 'jira:status', label: 'Status no Jira', children: ['A fazer', 'Em andamento', 'Em revisão', 'Concluído'].map(v => ({ key: 'jirast:' + v, label: check(r.jira.status === v) + v })) },
          { key: 'jira:fields', icon: createElement(I.ControlOutlined), label: 'Campos do Jira…' }
        ] }]),
        ...(many ? [] : [{ key: 'ctx', icon: createElement(I.EnvironmentOutlined), label: 'Contextos', children: CONTEXTS.map(c => ({ key: 'ctx:' + c.name, label: check(r.contexts.includes(c.name)) + c.emoji + ' ' + c.name })) }]),
        { type: 'divider' },
        ...(many ? [] : [{ key: 'copy', icon: createElement(I.CopyOutlined), label: 'Copiar #' + r.id }]),
        { key: 'archive', icon: createElement(I.ContainerOutlined), label: tag('Arquivar') },
        { key: 'delete', icon: createElement(I.DeleteOutlined), label: tag('Excluir…'), danger: true }
      ];
      const onClick = ({ key, domEvent }) => {
        if (domEvent) domEvent.stopPropagation();
        const [kind, val] = key.split(':');
        if (kind === 'open') go('tarefa');
        if (kind === 'timer') { updateTasks([r.id], { running: !r.running }); message.success(r.running ? 'Timer pausado' : 'Timer iniciado'); }
        if (kind === 'today') toggleToday(ids);
        if (kind === 'status') { updateTasks(ids, { status: val }); message.success(plural(n, 'tarefa marcada', 'tarefas marcadas') + ' como ' + STATUS[val].label); }
        if (kind === 'cat') { updateTasks(ids, { category: val }); message.success('Categoria: ' + CATEGORY[val].label); }
        if (kind === 'proj') { updateTasks(ids, { project: Number(val) || null }); message.success(Number(val) ? 'Movida para ' + P[val].name : 'Sem projeto'); }
        if (kind === 'ctx') updateTasks([r.id], t => ({ contexts: t.contexts.includes(val) ? t.contexts.filter(x => x !== val) : t.contexts.concat(val) }));
        if (kind === 'jira') message.info(val === 'open' ? 'Abre ' + r.jira.key + ' no navegador' : val === 'fields' ? 'Abre o painel Campos do Jira · ' + r.jira.key : 'Busca as transições da issue');
        if (kind === 'jirast') { updateTasks([r.id], t => ({ jira: { ...t.jira, status: val } })); message.success('Transição enviada ao Jira: ' + val); }
        if (kind === 'copy') { try { navigator.clipboard.writeText(String(r.id)).catch(() => {}); } catch (e) {} message.success('#' + r.id + ' copiado'); }
        if (kind === 'archive') { removeTasks(ids); message.success(plural(n, 'tarefa arquivada', 'tarefas arquivadas')); }
        if (kind === 'delete') modal.confirm({
          title: 'Excluir ' + plural(n, 'tarefa', 'tarefas') + '?',
          content: 'Apaga também sessões, notas e desenho. No Notion e no Google também, se a sincronização estiver ligada.',
          okText: 'Excluir', okButtonProps: { danger: true }, cancelText: 'Cancelar',
          onOk: () => { removeTasks(ids); message.success(plural(n, 'tarefa excluída', 'tarefas excluídas')); }
        });
      };
      return { items, onClick };
    };

    const tabItems = [{ key: 'all', label: 'Todas', icon: 'UnorderedListOutlined' }].concat(Object.entries(STATUS).map(([k, v]) => ({ key: k, label: v.label, icon: v.icon })))
      .map(t => {
        const def = STATUS[t.key];
        const color = def ? def[mode][0] : 'var(--ct-text-2)';
        return { key: t.key, label: html`<span style=${{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
          ${createElement(I[t.icon], { style: { color } })}${t.label}
          <span className="ct-mono" style=${{ fontSize: 12, color: 'var(--ct-text-3)', background: 'var(--ct-bg)', borderRadius: 6, padding: '0 6px', border: '1px solid var(--ct-border)' }}>${counts[t.key] || 0}</span>
        </span>` };
      });

    const todayBtn = t => html`<${Tooltip} title=${today.has(t.id) ? 'Tirar do plano de hoje' : 'Planejar para hoje'}>
      <${Button} size="small" type=${today.has(t.id) ? 'primary' : 'text'} ghost=${today.has(t.id)} aria-label="Hoje" aria-pressed=${today.has(t.id)} icon=${html`<${I.ScheduleOutlined} />`}
        onClick=${e => { e.stopPropagation(); toggleToday([t.id]); }} />
    <//>`;
    const timerBtn = t => html`<${Tooltip} title=${t.blocked ? 'Bloqueada: depende de #702' : t.running ? 'Pausar timer' : 'Iniciar timer'}>
      <${Button} size="small" type="text" disabled=${t.blocked && !t.running} aria-label=${t.running ? 'Pausar timer' : 'Iniciar timer'} icon=${html`<${t.running ? I.PauseOutlined : I.CaretRightOutlined} />`}
        onClick=${e => { e.stopPropagation(); updateTasks([t.id], { running: !t.running }); }} />
    <//>`;
    const moreBtn = t => html`<${Dropdown} menu=${menuFor(t)} trigger=${['click']} placement="bottomRight">
      <${Button} size="small" type="text" aria-label="Mais ações" icon=${html`<${I.EllipsisOutlined} />`} onClick=${e => e.stopPropagation()} />
    <//>`;
    const toggleExpand = key => setExpanded(ex => ex.includes(key) ? ex.filter(k => k !== key) : ex.concat(key));
    const showStatusCol = status === 'all';

    const nameCell = t => {
      const ss = t.subtasks || [];
      const open = expanded.includes(t.rowKey);
      const others = groupBy === 'context' && t.groupCtx && t.contexts.length > 1 ? t.contexts.filter(c => c !== t.groupCtx) : [];
      return html`<${Flex} vertical gap=${4} style=${{ minWidth: 0 }}>
        <${Flex} align="center" gap=${6} style=${{ minWidth: 0 }}>
          ${ss.length
            ? html`<${Button} size="small" type="text" className="ct-caret" aria-expanded=${open} aria-label=${(open ? 'Recolher ' : 'Expandir ') + ss.length + ' subtarefas'} title=${ss.length + ' subtarefas'}
                icon=${html`<${open ? I.CaretDownOutlined : I.CaretRightOutlined} />`} onClick=${e => { e.stopPropagation(); toggleExpand(t.rowKey); }} />`
            : t.isSub ? null : html`<span className="ct-caret-space"></span>`}
          ${t.isSub ? html`<${Checkbox} checked=${t.status === 'finalizada'} aria-label=${'Concluir ' + t.name} onClick=${e => e.stopPropagation()} onChange=${e => updateTasks([t.id], { status: e.target.checked ? 'finalizada' : 'inbox' })} />` : null}
          ${t.blocked ? html`<${Tooltip} title="Bloqueada: depende de #702"><${I.LockOutlined} style=${{ color: CATEGORY.prioridade[mode][0] }} /><//>` : null}
          ${t.running ? html`<span className="ct-live" aria-label="Timer rodando"></span>` : null}
          <a className=${'ct-taskname' + (t.status === 'finalizada' ? ' done' : '')} onClick=${() => go('tarefa')} style=${{ color: 'var(--ct-text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', minWidth: 0 }}>${t.name}</a>
          ${t.isSub && !showStatusCol ? html`<${Chip} def=${STATUS[t.status]} mode=${mode} />` : null}
          ${t.waiting ? html`<${Tooltip} title=${'Aguardando: ' + t.waiting}><${I.HourglassOutlined} aria-label=${'Aguardando: ' + t.waiting} style=${{ color: STATUS.aguardando[mode][0], fontSize: 12 }} /><//>` : null}
          ${t.jira ? html`<${Tooltip} title=${t.jira.type + ' · Jira: ' + t.jira.status}><span className="ct-mono" aria-label=${'Jira ' + t.jira.key + ', ' + t.jira.type + ', ' + t.jira.status} style=${{ fontSize: 12, color: 'var(--ct-text-3)', flex: 'none' }}>${t.jira.key}</span><//>` : null}
          ${others.length ? html`<${Tooltip} title=${'Também em ' + others.join(', ')}><${I.CopyOutlined} aria-label="Aparece em outros grupos" style=${{ color: 'var(--ct-text-3)', fontSize: 12 }} /><//>` : null}
        <//>
      <//>`;
    };

    const ctxCell = t => {
      if (!t.contexts.length) return html`<${Text} type="secondary">—<//>`;
      const first = CONTEXTS.find(c => c.name === t.contexts[0]);
      return html`<${Popover} trigger="hover" mouseEnterDelay=${0.15} placement="bottom" title="Contextos"
        content=${html`<${Flex} gap=${4} wrap="wrap" style=${{ maxWidth: 240 }}>${CONTEXTS.map(c => html`<${Tag.CheckableTag} key=${c.name} checked=${t.contexts.includes(c.name)}
          onChange=${on => updateTasks([t.id], x => ({ contexts: on ? x.contexts.concat(c.name) : x.contexts.filter(y => y !== c.name) }))}>${c.emoji} ${c.name}<//>`)}<//>`}>
        <span style=${{ display: 'inline-flex', gap: 4, alignItems: 'center', cursor: 'default' }}>
          <${Tag} bordered=${false} style=${{ margin: 0 }}>${first ? first.emoji + ' ' : ''}${t.contexts[0]}<//>
          ${t.contexts.length > 1 ? html`<${Tag} bordered=${false} className="ct-mono" style=${{ margin: 0, color: 'var(--ct-primary)', background: 'var(--ct-primary-soft)' }}>+${t.contexts.length - 1}<//>` : null}
        </span>
      <//>`;
    };

    const groupList = list => {
      if (groupBy === 'project') {
        const m = new Map();
        list.forEach(t => { const k = t.project || 0; if (!m.has(k)) m.set(k, []); m.get(k).push(t); });
        return [...m.entries()].map(([k, ts]) => ({ key: 'p' + k, name: k ? P[k].name : 'Sem projeto', color: k ? P[k].color : 'var(--ct-border-strong)', tasks: ts }));
      }
      if (groupBy === 'context') {
        const m = new Map();
        list.forEach(t => (t.contexts.length ? t.contexts : ['—']).forEach(c => { if (!m.has(c)) m.set(c, []); m.get(c).push({ ...t, groupCtx: c }); }));
        return [...m.entries()].map(([c, ts]) => { const def = CONTEXTS.find(x => x.name === c); return { key: 'c' + c, name: c === '—' ? 'Sem contexto' : c, emoji: def && def.emoji, tasks: ts }; });
      }
      return null;
    };
    const groups = groupList(rows);
    const toRow = (t, gk) => ({
      ...t, rowKey: 't:' + t.id + (gk ? '@' + gk : ''),
      children: t.subtasks.length ? t.subtasks.map(s => ({ ...s, isSub: true, parentId: t.id, rowKey: 's:' + s.id + (gk ? '@' + gk : '') })) : undefined
    });
    const data = groups
      ? groups.flatMap(g => [{ rowKey: 'g:' + g.key, isGroup: true, group: g }].concat(collapsed.has(g.key) ? [] : g.tasks.map(t => toRow(t, g.key))))
      : rows.map(t => toRow(t));

    const groupHeader = g => {
      const isCollapsed = collapsed.has(g.key);
      const total = g.tasks.reduce((a, t) => a + t.secs, 0);
      const keys = g.tasks.map(t => 't:' + t.id + '@' + g.key);
      return html`<${Flex} align="center" gap=${8}>
        <${Button} size="small" type="text" aria-expanded=${!isCollapsed} aria-label=${(isCollapsed ? 'Expandir ' : 'Recolher ') + g.name}
          icon=${html`<${isCollapsed ? I.CaretRightOutlined : I.CaretDownOutlined} />`}
          onClick=${() => { const n = new Set(collapsed); n.has(g.key) ? n.delete(g.key) : n.add(g.key); setCollapsed(n); }} />
        ${g.color ? html`<span className="ct-dot" style=${{ background: g.color }}></span>` : g.emoji ? html`<span>${g.emoji}</span>` : null}
        <${Text} strong>${g.name}<//>
        <${Text} type="secondary" className="ct-mono">${g.tasks.length}<//>
        <a style=${{ fontSize: 12 }} onClick=${() => setSel([...new Set(sel.concat(keys))])}>Selecionar grupo</a>
        <span style=${{ flex: 1 }}></span>
        <${Tooltip} title="Tempo somado do grupo"><span className="ct-mono" style=${{ color: 'var(--ct-text-2)' }}>${fmtShort(total)}</span><//>
      <//>`;
    };

    const cols = [
      { title: 'ID', key: 'id', width: 72, render: (_, t) => html`<${Text} type="secondary" className="ct-mono" style=${{ fontSize: 12 }}>#${t.id}<//>` },
      { title: 'Tarefa', key: 'name', render: (_, t) => nameCell(t) },
      showStatusCol ? { title: 'Status', key: 'status', width: 132, render: (_, t) => html`<${Chip} def=${STATUS[t.status]} mode=${mode} />` } : null,
      screens.lg ? { title: 'Categoria', key: 'cat', width: 124, render: (_, t) => t.category === 'normal' ? null : html`<${Chip} def=${CATEGORY[t.category]} mode=${mode} />` } : null,
      screens.xl && groupBy !== 'project' && !projectId ? { title: 'Projeto', key: 'project', width: 160, render: (_, t) => t.isSub ? null : html`<${ProjectLabel} id=${t.project} />` } : null,
      screens.lg && groupBy !== 'context' ? { title: 'Contextos', key: 'ctx', width: 150, render: (_, t) => t.isSub ? null : ctxCell(t) } : null,
      screens.xl ? { title: 'Energia', key: 'energy', width: 76, render: (_, t) => t.energy ? html`<${Energy} level=${t.energy} />` : null } : null,
      screens.md ? { title: 'Prazo', key: 'due', width: 104, render: (_, t) => { const tone = dueTone(t.due); return t.due ? html`<${Text} type=${tone === 'error' ? 'danger' : tone === 'warning' ? 'warning' : undefined} className="ct-mono">${fmtDate(t.due)}${t.dueTime ? ' ' + t.dueTime : ''}<//>` : null; } } : null,
      { title: 'Tempo', key: 'time', width: 84, align: 'right', render: (_, t) => html`<span className="ct-mono">${fmtShort(t.secs)}</span>` },
      { title: '', key: 'act', width: 104, render: (_, t) => html`<${Space} size=${0}>${t.isSub ? null : todayBtn(t)}${timerBtn(t)}${moreBtn(t)}<//>` }
    ].filter(Boolean);
    const columns = cols.map((c, i) => ({ ...c, render: (v, r, idx) => r.isGroup ? (i === 0 ? groupHeader(r.group) : null) : c.render(v, r, idx), onCell: r => r.isGroup ? { colSpan: i === 0 ? cols.length : 0 } : {} }));

    const card = t => html`<${Dropdown} key=${t.id + (t.groupCtx || '')} menu=${menuFor(t)} trigger=${['contextMenu']}>
      <div><${Card} size="small" hoverable onClick=${() => go('tarefa')} className=${t.leak ? 'ct-leak-' + t.leak : ''}>
        <${Flex} vertical gap=${8}>
          <${Flex} justify="space-between" align="start" gap=${8}>
            <${Flex} vertical gap=${2} style=${{ minWidth: 0 }}>
              <${Text} type="secondary" className="ct-mono" style=${{ fontSize: 12 }}>#${t.id}<//>
              <span className=${'ct-taskname' + (t.status === 'finalizada' ? ' done' : '')}>${t.running ? html`<span className="ct-live" style=${{ display: 'inline-block', marginInlineEnd: 6 }}></span>` : null}${t.name}</span>
              ${t.subtasks.length ? html`<${Flex} align="center" gap=${8}><${Progress} percent=${Math.round(t.subtasks.filter(s => s.status === 'finalizada').length / t.subtasks.length * 100)} size=${[96, 4]} showInfo=${false} /><${Text} type="secondary" className="ct-mono" style=${{ fontSize: 12 }}>${t.subtasks.filter(s => s.status === 'finalizada').length}/${t.subtasks.length}<//><//>` : null}
            <//>
            <${Space} size=${0}>${todayBtn(t)}${moreBtn(t)}<//>
          <//>
          <${Flex} gap=${6} wrap="wrap" align="center">
            ${showStatusCol ? html`<${Chip} def=${STATUS[t.status]} mode=${mode} />` : null}
            ${t.category !== 'normal' ? html`<${Chip} def=${CATEGORY[t.category]} mode=${mode} />` : null}
            ${groupBy !== 'project' && !projectId ? html`<${ProjectLabel} id=${t.project} />` : null}
            ${groupBy !== 'context' && t.contexts.length ? ctxCell(t) : null}
            ${t.jira ? html`<${Tooltip} title=${t.jira.type + ' · Jira: ' + t.jira.status}><span className="ct-mono" aria-label=${'Jira ' + t.jira.key + ', ' + t.jira.type + ', ' + t.jira.status} style=${{ fontSize: 12, color: 'var(--ct-text-3)', flex: 'none' }}>${t.jira.key}</span><//>` : null}
            <span style=${{ marginInlineStart: 'auto' }} className="ct-mono">${fmtShort(t.secs)}</span>
          <//>
        <//>
      <//></div>
    <//>`;

    const table = html`<${Table} rowKey="rowKey" size=${screens.xxl ? 'middle' : 'small'} columns=${columns} dataSource=${data} pagination=${false}
      components=${{ body: { row: MenuRow } }}
      onRow=${r => r.isGroup ? {} : { record: r, menu: menuFor(r) }}
      rowClassName=${r => r.isGroup ? 'ct-grouprow' : r.isSub ? 'ct-subrow' : r.leak ? 'ct-leak-' + r.leak : ''}
      expandable=${{ expandedRowKeys: expanded, onExpandedRowsChange: setExpanded, expandIcon: () => null, indentSize: 28, expandIconColumnIndex: 3 }}
      rowSelection=${{ selectedRowKeys: sel, onChange: setSel, columnWidth: 40, checkStrictly: true, renderCell: (checked, r, i, node) => r.isGroup ? null : node }}
      scroll=${{ x: 'max-content' }} />`;

    const body = rows.length === 0
      ? html`<${Empty} image=${Empty.PRESENTED_IMAGE_SIMPLE} description=${status === 'inbox' ? 'Inbox zerado. Tudo processado.' : 'Nenhuma tarefa aqui.'} />`
      : effectiveView === 'kanban'
        ? projectId
          ? html`<div className="ct-kanban">${Object.entries(STATUS).map(([k, v]) => { const items = rows.filter(t => t.status === k); return html`<div key=${k} className="ct-col">
              <${Flex} align="center" gap=${8} style=${{ marginBottom: 8 }}>${createElement(I[v.icon], { style: { color: v[mode][0] } })}<${Text} strong>${v.label}<//><${Text} type="secondary" className="ct-mono">${items.length}<//><//>
              <${Flex} vertical gap=${8}>${items.map(card)}${items.length ? null : html`<${Text} type="secondary" style=${{ fontSize: 12 }}>Nada aqui<//>`}<//>
            </div>`; })}</div>`
          : html`<div className="ct-kanban">${PROJECTS.filter(p => p.status === 'active').map(p => { const items = rows.filter(t => t.project === p.id); return html`<div key=${p.id} className="ct-col">
            <${Flex} align="center" gap=${8} style=${{ marginBottom: 8 }}><span className="ct-dot" style=${{ background: p.color }}></span><${Text} strong>${p.name}<//><${Text} type="secondary" className="ct-mono">${items.length}<//><//>
            <${Flex} vertical gap=${8}>${items.map(card)}${items.length ? null : html`<${Text} type="secondary" style=${{ fontSize: 12 }}>Nada executando<//>`}<//>
          </div>`; })}</div>`
        : effectiveView === 'cards'
          ? (groups
            ? groups.map(g => html`<div key=${g.key} style=${{ marginBottom: 16 }}>
                <div className="ct-groupbar">${groupHeader(g)}</div>
                ${collapsed.has(g.key) ? null : html`<div className="ct-grid-auto">${g.tasks.map(card)}</div>`}
              </div>`)
            : html`<div className="ct-grid-auto">${rows.map(card)}</div>`)
          : table;

    const bulk = selIds.length ? menuFor(findTask(selIds[0])) : null;
    return html`<div className=${embedded ? '' : isMobile ? 'ct-page-narrow' : 'ct-page'}>
      ${isMobile
        ? html`<${Select} value=${status} onChange=${setStatus} options=${tabItems.map(t => ({ value: t.key, label: t.label }))} style=${{ width: '100%', marginBottom: 12 }} aria-label="Status" />`
        : html`<${Tabs} activeKey=${status} onChange=${setStatus} items=${tabItems} style=${{ marginBottom: 4 }} />`}
      <${Flex} gap=${8} wrap="wrap" align="center" style=${{ marginBottom: 12 }}>
        <${Input} allowClear placeholder="Buscar em nome e descrição" prefix=${html`<${I.SearchOutlined} />`} value=${q} onChange=${e => setQ(e.target.value)} style=${{ flex: '1 1 220px', maxWidth: 360 }} />
        <${Popover} trigger="click" placement="bottomLeft" title="Filtros" content=${html`<${Flex} vertical gap=${10} style=${{ width: 260 }}>
            <${Select} placeholder="Categoria" allowClear options=${Object.entries(CATEGORY).map(([k, v]) => ({ value: k, label: v.label }))} />
            <${Select} placeholder="Contexto" allowClear options=${CONTEXTS.map(c => ({ value: c.name, label: c.emoji + ' ' + c.name }))} />
            <${Select} placeholder="Projeto" allowClear options=${[{ value: -1, label: 'Sem projeto' }].concat(PROJECTS.map(p => ({ value: p.id, label: p.name })))} />

                description=${html`<${Space} size=${6} wrap>
                  ${t.start ? html`<${Tooltip} title="Horário fixo: tarefas com horário vêm primeiro, pela hora"><span className="ct-mono" style=${{ fontSize: 12, color: 'var(--ct-text-2)' }}><${I.ClockCircleOutlined} /> ${t.start}–${t.end}</span><//>` : null}
                  <${Chip} def=${STATUS[t.status]} mode=${mode} /><${ProjectLabel} id=${t.project} /><//>`} />
            <//>`} />`
            : html`<${Empty} image=${Empty.PRESENTED_IMAGE_SIMPLE} description=${html`<span>Nada planejado para hoje.<br /><${Text} type="secondary">Na lista de tarefas, use <b>Hoje</b> (botão da linha ou do menu ⋯) para trazer tarefas para cá.<//></span>`}>
                <${Button} icon=${html`<${I.CheckSquareOutlined} />`} onClick=${() => go('tarefas')}>Ir para Tarefas<//>
              <//>`}
          <//>
        <//>
        <${Col} xs=${24} lg=${8}>
          <${Card} title="Semana" extra=${html`<${Text} type="secondary" style=${{ fontSize: 12 }}>blocos de tempo<//>`}>
            <${Flex} vertical gap=${10}>
              ${week.map(([d, h]) => html`<${Flex} key=${d} align="center" gap=${10}>
                <${Text} style=${{ width: 32 }} strong=${d === 'Ter'}>${d}<//>
                <${Progress} percent=${Math.min(100, h / journey * 100)} showInfo=${false} size="small" strokeColor=${h > journey ? warn : undefined} style=${{ flex: 1, margin: 0 }} />
                <span className="ct-mono" style=${{ width: 44, textAlign: 'right', color: h > journey ? warn : undefined }}>${h ? fmtH(h) : '—'}</span>
              <//>`)}
            <//>
          <//>
        <//>
      <//>
    </div>`;
  }

  function projectStats(p, tasks) {
    const ts = tasks.filter(t => t.project === p.id);
    const done = ts.filter(t => t.status === 'finalizada').length;
    const next = ts.filter(t => t.status === 'proximas')[0] || null;
    return { total: ts.length, done, open: ts.length - done, blocked: ts.filter(t => t.blocked).length, secs: ts.reduce((a, t) => a + t.secs, 0), next, tasks: ts };
  }
  const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

  function ProjectStatusChip({ status, mode }) {
    return html`<${Chip} def=${PROJECT_STATUS[status]} mode=${mode} />`;
  }

  function ProjectsPage({ mode, isMobile, screens, openProject }) {
    const { message, modal } = AntApp.useApp();
    const [projects, setProjects] = useState(PROJECTS);
    const [status, setStatus] = useState('active');
    const [view, setView] = useState('cards');
    const [q, setQ] = useState('');
    const [sort, setSort] = useState('due');
    const [groupByArea, setGroupByArea] = useState(false);
    const [onlyNoNext, setOnlyNoNext] = useState(false);
    const [collapsed, setCollapsed] = useState(() => new Set());
    const stats = useMemo(() => Object.fromEntries(projects.map(p => [p.id, projectStats(p, TASKS)])), [projects]);
    const counts = useMemo(() => { const c = { all: projects.length }; projects.forEach(p => { c[p.status] = (c[p.status] || 0) + 1; }); return c; }, [projects]);
    const noNext = p => p.status === 'active' && stats[p.id].open > 0 && !stats[p.id].next;
    const activeNoNext = projects.filter(noNext);
    const effectiveView = isMobile ? 'cards' : view;

    const sorters = {
      due: (a, b) => (a.due || '9999').localeCompare(b.due || '9999'),
      progress: (a, b) => (stats[b.id].total ? stats[b.id].done / stats[b.id].total : 0) - (stats[a.id].total ? stats[a.id].done / stats[a.id].total : 0),
      name: (a, b) => a.name.localeCompare(b.name),
      updated: (a, b) => b.updated.localeCompare(a.updated)
    };
    const needle = q.trim().toLowerCase();
    const rows = projects
      .filter(p => status === 'all' || p.status === status)
      .filter(p => !needle || [p.name, p.outcome, p.description, p.area].join(' ').toLowerCase().includes(needle))
      .filter(p => !onlyNoNext || noNext(p))
      .sort(sorters[sort]);
    const groups = groupByArea
      ? AREAS.concat(['Sem área']).map(a => ({ key: a, name: a, items: rows.filter(p => (p.area || 'Sem área') === a) })).filter(g => g.items.length)
      : null;

    const update = (id, patch) => setProjects(ps => ps.map(p => p.id === id ? { ...p, ...patch } : p));
    const menuFor = p => ({
      items: [
        { key: 'open', icon: createElement(I.FolderOpenOutlined), label: 'Abrir' },
        { key: 'status', icon: createElement(I.CheckCircleOutlined), label: 'Marcar como', children: Object.entries(PROJECT_STATUS).map(([k, v]) => ({ key: 'status:' + k, label: (p.status === k ? '✓ ' : '') + v.label })) },
        { key: 'area', icon: createElement(I.RiseOutlined), label: 'Área de foco', children: AREAS.map(a => ({ key: 'area:' + a, label: (p.area === a ? '✓ ' : '') + a })).concat([{ key: 'area:', label: (!p.area ? '✓ ' : '') + 'Sem área' }]) },
        { type: 'divider' },
        { key: 'delete', icon: createElement(I.DeleteOutlined), label: 'Excluir…', danger: true }
      ],
      onClick: ({ key, domEvent }) => {
        if (domEvent) domEvent.stopPropagation();
        const [kind, val] = key.split(':');
        if (kind === 'open') openProject(p.id);
        if (kind === 'status') { update(p.id, { status: val }); message.success(p.name + ': ' + PROJECT_STATUS[val].label); }
        if (kind === 'area') { update(p.id, { area: val || null }); message.success(val ? 'Área: ' + val : 'Sem área'); }
        if (kind === 'delete') modal.confirm({
          title: 'Excluir o projeto ' + p.name + '?',
          content: stats[p.id].total ? `As ${stats[p.id].total} tarefas dele não são apagadas: ficam sem projeto.` : 'O projeto não tem tarefas.',
          okText: 'Excluir', okButtonProps: { danger: true }, cancelText: 'Cancelar',
          onOk: () => { setProjects(ps => ps.filter(x => x.id !== p.id)); message.success('Projeto excluído'); }
        });
      }
    });

    const progress = (p, w) => { const st = stats[p.id]; const pct = st.total ? Math.round(st.done / st.total * 100) : 0;
      return html`<${Flex} align="center" gap=${8}><${Progress} percent=${pct} size=${[w, 4]} showInfo=${false} /><span className="ct-mono" style=${{ fontSize: 12, color: 'var(--ct-text-2)' }}>${st.done}/${st.total}</span><//>`; };
    const nextCell = p => { const st = stats[p.id];
      if (noNext(p)) return html`<${Chip} def=${{ icon: 'WarningOutlined', light: STATUS.aguardando.light, dark: STATUS.aguardando.dark }} mode=${mode}>Sem próxima ação<//>`;
      if (!st.next) return html`<${Text} type="secondary">—<//>`;
      return html`<span style=${{ display: 'inline-flex', gap: 6, alignItems: 'center', minWidth: 0 }}><${I.ForwardOutlined} style=${{ color: STATUS.proximas[mode][0] }} /><span style=${{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>${st.next.name}</span></span>`; };
    const dueCell = p => { if (!p.due) return html`<${Text} type="secondary">—<//>`; const d = daysBetween(TODAY, p.due);
      return html`<${Tooltip} title=${d < 0 ? 'Venceu há ' + -d + ' dias' : d === 0 ? 'Vence hoje' : 'Faltam ' + d + ' dias'}><${Text} className="ct-mono" type=${d < 0 && p.status === 'active' ? 'danger' : d <= 7 && p.status === 'active' ? 'warning' : undefined}>${fmtDate(p.due)}<//><//>`; };

    const card = p => html`<${Dropdown} key=${p.id} menu=${menuFor(p)} trigger=${['contextMenu']}>
      <div><${Card} hoverable size="small" onClick=${() => openProject(p.id)} style=${{ height: '100%' }}>
        <${Flex} vertical gap=${10}>
          <${Flex} align="center" gap=${8}>
            <span className="ct-dot" style=${{ background: p.color, width: 10, height: 10 }}></span>
            <${Text} strong style=${{ flex: 1, minWidth: 0 }} ellipsis>${p.name}<//>
            ${status === 'all' ? html`<${ProjectStatusChip} status=${p.status} mode=${mode} />` : null}
            <${Dropdown} menu=${menuFor(p)} trigger=${['click']}><${Button} size="small" type="text" aria-label="Mais ações" icon=${html`<${I.EllipsisOutlined} />`} onClick=${e => e.stopPropagation()} /><//>
          <//>
          <${Flex} gap=${6} align="start"><${I.AimOutlined} style=${{ color: 'var(--ct-text-3)', marginTop: 4 }} /><${Text} type="secondary" style=${{ fontSize: 13 }}>${p.outcome}<//><//>
          ${progress(p, 120)}
          <div style=${{ minHeight: 22 }}>${nextCell(p)}</div>
          <${Flex} gap=${8} align="center" style=${{ fontSize: 12 }}>
            <${Text} type="secondary" style=${{ fontSize: 12 }}>${p.area || 'Sem área'}<//>
            <span style=${{ flex: 1 }}></span>
            ${p.due ? html`<span><${I.CalendarOutlined} style=${{ color: 'var(--ct-text-3)' }} /> ${dueCell(p)}</span>` : null}
          <//>
        <//>
      <//></div>
    <//>`;

    const cols = [
      { title: 'Projeto', key: 'name', render: (_, p) => html`<${Flex} align="center" gap=${8} style=${{ minWidth: 0 }}>
          <span className="ct-dot" style=${{ background: p.color }}></span>
          <a onClick=${() => openProject(p.id)} style=${{ color: 'var(--ct-text)', fontWeight: 500, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>${p.name}</a>
          <${Tooltip} title=${'Resultado desejado: ' + p.outcome}><${I.AimOutlined} aria-label="Resultado desejado" style=${{ color: 'var(--ct-text-3)', fontSize: 12 }} /><//>
        <//>` },
      status === 'all' ? { title: 'Status', key: 'status', width: 128, render: (_, p) => html`<${ProjectStatusChip} status=${p.status} mode=${mode} />` } : null,
      screens.lg && !groupByArea ? { title: 'Área', key: 'area', width: 150, render: (_, p) => p.area ? html`<${Text} type="secondary">${p.area}<//>` : html`<${Text} type="secondary">—<//>` } : null,
      { title: 'Próxima ação', key: 'next', width: screens.xl ? 280 : 200, render: (_, p) => nextCell(p) },
      { title: 'Progresso', key: 'progress', width: 150, render: (_, p) => progress(p, 64) },
      screens.md ? { title: 'Prazo', key: 'due', width: 96, render: (_, p) => dueCell(p) } : null,
      screens.xl ? { title: 'Tempo', key: 'time', width: 84, align: 'right', render: (_, p) => html`<span className="ct-mono">${fmtShort(stats[p.id].secs)}</span>` } : null,
      { title: '', key: 'act', width: 48, render: (_, p) => html`<${Dropdown} menu=${menuFor(p)} trigger=${['click']} placement="bottomRight"><${Button} size="small" type="text" aria-label="Mais ações" icon=${html`<${I.EllipsisOutlined} />`} /><//>` }
    ].filter(Boolean);
    const groupHeader = g => { const isC = collapsed.has(g.key); return html`<${Flex} align="center" gap=${8}>
      <${Button} size="small" type="text" aria-expanded=${!isC} aria-label=${(isC ? 'Expandir ' : 'Recolher ') + g.name} icon=${html`<${isC ? I.CaretRightOutlined : I.CaretDownOutlined} />`}
        onClick=${() => { const n = new Set(collapsed); n.has(g.key) ? n.delete(g.key) : n.add(g.key); setCollapsed(n); }} />
      <${I.RiseOutlined} style=${{ color: 'var(--ct-text-3)' }} /><${Text} strong>${g.name}<//><${Text} type="secondary" className="ct-mono">${g.items.length}<//>
    <//>`; };
    const columns = cols.map((c, i) => ({ ...c, render: (v, r, idx) => r.isGroup ? (i === 0 ? groupHeader(r.group) : null) : c.render(v, r, idx), onCell: r => r.isGroup ? { colSpan: i === 0 ? cols.length : 0 } : {} }));
    const data = groups ? groups.flatMap(g => [{ id: 'g:' + g.key, isGroup: true, group: g }].concat(collapsed.has(g.key) ? [] : g.items)) : rows;

    const tabItems = [['all', 'Todos', 'AppstoreOutlined']].concat(Object.entries(PROJECT_STATUS).map(([k, v]) => [k, v.label + (k === 'done' || k === 'archived' ? 's' : k === 'active' ? 's' : ''), v.icon]))
      .map(([k, label, icon]) => ({ key: k, label: html`<span style=${{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
        ${createElement(I[icon], { style: { color: PROJECT_STATUS[k] ? PROJECT_STATUS[k][mode][0] : 'var(--ct-text-2)' } })}${label}
        <span className="ct-mono" style=${{ fontSize: 12, color: 'var(--ct-text-3)', background: 'var(--ct-bg)', borderRadius: 6, padding: '0 6px', border: '1px solid var(--ct-border)' }}>${counts[k] || 0}</span>
      </span>` }));

    const body = rows.length === 0
      ? html`<${Empty} image=${Empty.PRESENTED_IMAGE_SIMPLE} description=${q || onlyNoNext ? 'Nenhum projeto com esses filtros.' : 'Nenhum projeto aqui.'}>${q || onlyNoNext ? html`<${Button} onClick=${() => { setQ(''); setOnlyNoNext(false); }}>Limpar filtros<//>` : html`<${Button} type="primary" icon=${html`<${I.PlusOutlined} />`}>Criar projeto<//>`}<//>`
      : effectiveView === 'tabela'
        ? html`<${Table} rowKey="id" size=${screens.xxl ? 'middle' : 'small'} columns=${columns} dataSource=${data} pagination=${false} scroll=${{ x: 'max-content' }}
            components=${{ body: { row: MenuRow } }} onRow=${r => r.isGroup ? {} : { record: r, menu: menuFor(r) }}
            rowClassName=${r => r.isGroup ? 'ct-grouprow' : ''} />`
        : groups
          ? groups.map(g => html`<div key=${g.key} style=${{ marginBottom: 16 }}><div className="ct-groupbar">${groupHeader(g)}</div>${collapsed.has(g.key) ? null : html`<div className="ct-grid-auto">${g.items.map(card)}</div>`}</div>`)
          : html`<div className="ct-grid-auto">${rows.map(card)}</div>`;

    return html`<div className=${isMobile ? 'ct-page-narrow' : 'ct-page'}>
      ${isMobile
        ? html`<${Select} value=${status} onChange=${setStatus} options=${tabItems.map(t => ({ value: t.key, label: t.label }))} style=${{ width: '100%', marginBottom: 12 }} aria-label="Status do projeto" />`
        : html`<${Tabs} activeKey=${status} onChange=${setStatus} items=${tabItems} style=${{ marginBottom: 4 }} />`}
      <${Flex} gap=${8} wrap="wrap" align="center" style=${{ marginBottom: 12 }}>
        <${Input} allowClear placeholder="Buscar em nome, resultado e área" prefix=${html`<${I.SearchOutlined} />`} value=${q} onChange=${e => setQ(e.target.value)} style=${{ flex: '1 1 220px', maxWidth: 360 }} aria-label="Buscar projetos" />
        <${Select} value=${sort} onChange=${setSort} style=${{ width: 170 }} aria-label="Ordenar" options=${[{ value: 'due', label: 'Ordenar por prazo' }, { value: 'progress', label: 'Ordenar por progresso' }, { value: 'updated', label: 'Mais recentes' }, { value: 'name', label: 'Ordenar por nome' }]} />
        <div style=${{ flex: 1 }}></div>
        ${isMobile ? null : html`<${Segmented} value=${effectiveView} onChange=${setView} options=${[{ value: 'cards', icon: html`<${I.AppstoreOutlined} />`, label: screens.lg ? 'Cards' : null, title: 'Cards' }, { value: 'tabela', icon: html`<${I.TableOutlined} />`, label: screens.lg ? 'Tabela' : null, title: 'Tabela' }]} />`}
        <${Select} value=${groupByArea ? 'area' : 'none'} onChange=${v => setGroupByArea(v === 'area')} style=${{ width: 170 }} aria-label="Agrupar" options=${[{ value: 'none', label: 'Sem agrupamento' }, { value: 'area', label: 'Agrupar por área' }]} />
        <${Button} type="primary" icon=${html`<${I.PlusOutlined} />`}>${screens.sm ? 'Novo projeto' : null}<//>
      <//>
      ${activeNoNext.length && (status === 'active' || status === 'all') ? html`<${Alert} showIcon type="warning" style=${{ marginBottom: 12 }}
        message=${html`<span><b>${activeNoNext.length === 1 ? '1 projeto ativo está' : activeNoNext.length + ' projetos ativos estão'} sem próxima ação.</b> Projeto sem próxima ação fica parado: defina o próximo passo concreto.</span>`}
        action=${html`<${Button} size="small" type=${onlyNoNext ? 'primary' : 'default'} onClick=${() => setOnlyNoNext(!onlyNoNext)}>${onlyNoNext ? 'Mostrar todos' : 'Mostrar só esses'}<//>`} />` : null}
      ${body}
    </div>`;
  }

  function ProjectDetailPage({ mode, go, isMobile, screens, projectId, openTerminal }) {
    const base = P[projectId] || PROJECTS[0];
    const { message, modal } = AntApp.useApp();
    const [p, setP] = useState(base);
    const st = projectStats(p, TASKS);
    const [nextId, setNextId] = useState(st.next ? st.next.id : null);
    const [narrowTab, setNarrowTab] = useState('tarefas');
    const set = patch => setP(x => ({ ...x, ...patch }));
    const pct = st.total ? Math.round(st.done / st.total * 100) : 0;
    const next = st.tasks.find(t => t.id === nextId) || null;
    const noNextAction = p.status === 'active' && st.open > 0 && !next;
    const daysLeft = p.due ? daysBetween(TODAY, p.due) : null;
    const PALETTE_COLORS = ['#E5484D', '#A84803', '#A15C00', '#0B7A50', '#0F6E7A', '#2A62D6', '#5B47EB', '#7647B0', '#B8327A', '#5D6B82'];

    const moreMenu = {
      items: [
        { key: 'copy', icon: createElement(I.CopyOutlined), label: 'Copiar nome' },
        { key: 'archive', icon: createElement(I.ContainerOutlined), label: p.status === 'archived' ? 'Reativar' : 'Arquivar' },
        { type: 'divider' },
        { key: 'delete', icon: createElement(I.DeleteOutlined), label: 'Excluir projeto…', danger: true }
      ],
      onClick: ({ key }) => {
        if (key === 'copy') { try { navigator.clipboard.writeText(p.name).catch(() => {}); } catch (e) {} message.success('Nome copiado'); }
        if (key === 'archive') { set({ status: p.status === 'archived' ? 'active' : 'archived' }); message.success(p.status === 'archived' ? 'Projeto reativado' : 'Projeto arquivado'); }
        if (key === 'delete') modal.confirm({ title: 'Excluir o projeto ' + p.name + '?', content: `As ${st.total} tarefas dele não são apagadas: ficam sem projeto.`, okText: 'Excluir', okButtonProps: { danger: true }, cancelText: 'Cancelar', onOk: () => go('projetos') });
      }
    };

    const propBar = html`<div className="ct-propbar">
      <${PropPill} label="Área de foco" icon="RiseOutlined" muted=${!p.area} content=${html`<${Flex} vertical gap=${8}>
          <${Select} allowClear placeholder="Sem área" value=${p.area} onChange=${v => set({ area: v || null })} options=${AREAS.map(a => ({ value: a, label: a }))} />
          <a onClick=${() => go('horizontes')}>Ver em Horizontes →</a>
        <//>`}>${p.area || 'Área de foco'}<//>
      <${PropPill} label="Prazo" icon="FlagOutlined" muted=${!p.due} tone=${daysLeft !== null && daysLeft < 0 ? PALETTE[mode].error : daysLeft !== null && daysLeft <= 7 ? PALETTE[mode].warning : null}
        content=${html`<${Flex} vertical gap=${8}>
          <${DatePicker} format="DD/MM/YYYY" placeholder="Data limite" value=${p.due ? dayjs(p.due) : null} onChange=${d => set({ due: d ? d.format('YYYY-MM-DD') : null })} />
          ${p.due ? html`<a onClick=${() => set({ due: null })}>Remover prazo</a>` : null}
        <//>`}>
        ${p.due ? `Prazo ${fmtDate(p.due)}${daysLeft !== null ? ` · ${daysLeft < 0 ? 'venceu há ' + -daysLeft + 'd' : daysLeft === 0 ? 'hoje' : 'faltam ' + daysLeft + 'd'}` : ''}` : 'Prazo'}
      <//>
      <${PropPill} label="Cor" content=${html`<${Flex} gap=${6} wrap="wrap">${PALETTE_COLORS.map(c => html`<button key=${c} type="button" aria-label=${'Cor ' + c} onClick=${() => set({ color: c })}
          style=${{ width: 24, height: 24, borderRadius: '50%', background: c, border: p.color === c ? '2px solid var(--ct-text)' : '2px solid transparent', boxShadow: '0 0 0 1px var(--ct-border)', cursor: 'pointer' }}></button>`)}<//>`}>
        <span className="ct-dot" style=${{ background: p.color }}></span>Cor
      <//>
      <${PropPill} label="Diretório de trabalho" icon="CodeOutlined" muted=${!p.workingDir} content=${html`<${Flex} vertical gap=${8}>
          <${Text} className="ct-mono" style=${{ fontSize: 12 }}>${p.workingDir || 'Nenhum diretório'}<//>
          <${Text} type="secondary" style=${{ fontSize: 12 }}>Tarefas sem diretório próprio abrem o terminal aqui.<//>
          <${Flex} gap=${6}>
            <${Button} size="small" icon=${html`<${I.FolderOpenOutlined} />`} onClick=${() => { set({ workingDir: p.workingDir || '~/Code/novo-projeto' }); message.info('Abre o seletor de pasta do sistema'); }}>${p.workingDir ? 'Alterar' : 'Escolher'}<//>
            ${p.workingDir ? html`<${Button} size="small" type="text" danger onClick=${() => set({ workingDir: null })}>Remover<//>` : null}
          <//>
        <//>`}>
        ${p.workingDir ? '…/' + p.workingDir.split('/').slice(-2).join('/') : 'Diretório'}
      <//>
    </div>`;

    const head = html`<div className="ct-taskhead">
      <${Flex} align="center" gap=${6} wrap="wrap">
        <${Button} size="small" type="text" icon=${html`<${I.ArrowLeftOutlined} />`} onClick=${() => go('projetos')}>Projetos<//>
        ${p.area ? html`<${Text} type="secondary">/<//><a onClick=${() => go('horizontes')} style=${{ color: 'var(--ct-text-2)' }}>${p.area}</a>` : null}
      <//>
      <div className="ct-taskhead-main">
        <div style=${{ flex: '1 1 380px', minWidth: 0 }}>
          <${Flex} align="center" gap=${8} wrap="wrap">
            <${Select} size="small" variant="filled" value=${p.status} onChange=${v => { set({ status: v }); message.success('Status do projeto alterado'); }} style=${{ width: 150 }} aria-label="Status do projeto" popupMatchSelectWidth=${false}
              options=${Object.entries(PROJECT_STATUS).map(([k, v]) => ({ value: k, label: html`<${Space} size=${6}>${createElement(I[v.icon], { style: { color: v[mode][0] } })}${v.label}<//>` }))} />
          <//>
          <${Flex} align="center" gap=${10} style=${{ marginTop: 4 }}>
            <span className="ct-dot" style=${{ background: p.color, width: 14, height: 14 }}></span>
            <${Input} variant="borderless" key=${p.id} defaultValue=${p.name} aria-label="Nome do projeto" className="ct-taskname-input" />
          <//>
          <${Input.TextArea} variant="borderless" autoSize=${{ minRows: 1, maxRows: 4 }} placeholder="Adicionar descrição" defaultValue=${p.description} aria-label="Descrição" style=${{ padding: 0, color: 'var(--ct-text-2)' }} />
        </div>
        <${Flex} align="center" gap=${4} wrap="wrap" style=${{ flex: 'none' }}>
          ${p.workingDir ? html`<${Tooltip} title=${'Terminal em ' + p.workingDir}><${Button} type="text" aria-label="Terminal" icon=${html`<${I.CodeOutlined} />`} onClick=${openTerminal} /><//>` : null}
          <${Dropdown} menu=${moreMenu} trigger=${['click']} placement="bottomRight"><${Button} type="text" aria-label="Mais ações" icon=${html`<${I.EllipsisOutlined} />`} /><//>
        <//>
      </div>

  const pct = (v, t) => t ? Math.round(v / t * 100) + '%' : '—';

  function dashData(days, projectId) {
    const rnd = seeded(days * 31 + (projectId || 0) * 7 + 3);
    const share = projectId ? (PROJECT_SHARE[projectId] || 0) : 1;
    const end = dayjs(TODAY);
    const daily = Array.from({ length: days }, (_, i) => {
      const d = end.subtract(days - 1 - i, 'day');
      const weekend = d.day() === 0 || d.day() === 6;
      const raw = rnd() < 0.08 ? 0 : Math.max(0, (weekend ? 0.7 : 4.4) + (rnd() - 0.4) * 3);
      return { date: d.format('YYYY-MM-DD'), d, secs: Math.round(raw * 3600 * share) };
    });
    const total = daily.reduce((a, x) => a + x.secs, 0);
    const prev = Math.round(total * (0.82 + rnd() * 0.3));
    const sessions = Math.round(total / 2500);
    const prevSessions = Math.round(prev / 2600);

    const workdays = daily.filter(x => x.d.day() !== 0 && x.d.day() !== 6 && x.secs > 0).length;

    let buckets;
    if (days <= 31) buckets = daily.map((x, i) => ({ key: x.date, secs: x.secs, label: days <= 7 ? WEEKDAYS[x.d.day()].toLowerCase() : x.d.format('DD/MM'), title: x.d.format('ddd, DD/MM'), showLabel: days <= 7 || i % 5 === (days - 1) % 5 }));

      const unit = days <= 120 ? 'week' : 'month';
      const map = new Map();
      daily.forEach(x => { const k = x.d.startOf(unit).format('YYYY-MM-DD'); if (!map.has(k)) map.set(k, { key: k, secs: 0, d: x.d.startOf(unit) }); map.get(k).secs += x.secs; });
      buckets = Array.from(map.values()).map((b, i, arr) => ({ ...b, label: unit === 'week' ? b.d.format('DD/MM') : b.d.format('MMM'), title: unit === 'week' ? 'Semana de ' + b.d.format('DD/MM') : b.d.format('MMMM [de] YYYY'), showLabel: unit === 'month' || i % 2 === (arr.length - 1) % 2 }));
    }
    const unitLabel = days <= 31 ? 'dia' : days <= 120 ? 'semana' : 'mês';
    const currentLabel = days <= 31 ? 'hoje' : days <= 120 ? 'esta semana' : 'este mês';

    const projects = projectId
      ? [{ key: projectId, name: P[projectId].name, color: P[projectId].color, secs: total }]
      : Object.entries(PROJECT_SHARE).filter(([, s]) => s > 0).map(([id, s]) => ({ key: +id, name: +id ? P[id].name : 'Sem projeto', color: +id ? P[id].color : null, secs: Math.round(total * s) })).sort((a, b) => b.secs - a.secs);
    const areaMap = {};
    projects.forEach(p => { const a = p.key && P[p.key] ? P[p.key].area || 'Sem área' : 'Sem área'; areaMap[a] = (areaMap[a] || 0) + p.secs; });
    const areas = Object.entries(areaMap).map(([name, secs]) => ({ key: name, name, secs })).sort((a, b) => b.secs - a.secs);
    const contexts = CONTEXT_SHARE.map(([name, s]) => ({ key: name, name, emoji: (CONTEXTS.find(c => c.name === name) || {}).emoji, secs: Math.round(total * s) }));
    const categories = CATEGORY_SHARE.map(([k, s]) => ({ key: k, secs: Math.round(total * s), tasks: Math.max(total ? 1 : 0, Math.round(done * s * 1.4)) }));
    const energy = ENERGY_SHARE.map(([k, s, ts]) => { const tasks = Math.max(total ? 1 : 0, Math.round(done * ts * 1.3)); const secs = Math.round(total * s); return { key: k, secs, tasks, avg: tasks ? Math.round(secs / tasks) : 0 }; });
    const tasks = TASKS.filter(t => t.secs > 0 && (!projectId || t.project === projectId))
      .map(t => ({ key: t.id, name: t.name, project: t.project, secs: Math.round(t.secs * days / 30 * 4 * (0.6 + rnd() * 0.8)) }))
      .sort((a, b) => b.secs - a.secs).slice(0, 8);

    const heat = WEEKDAYS.map((_, wd) => HOURS.map(h => {
      if (!total) return 0;
      const weekend = wd === 0 || wd === 6;
      const shape = h >= 9 && h <= 11 ? 1 : h >= 14 && h <= 17 ? 0.75 : h === 12 || h === 13 ? 0.25 : h >= 19 && h <= 21 ? 0.3 : h < 8 || h > 22 ? 0.02 : 0.15;
      return Math.round(shape * (weekend ? 0.25 : 1) * (0.6 + rnd() * 0.8) * (days / 7) * 1500 * share);
    }));
    return { days, daily, total, prev, sessions, prevSessions, done, prevDone, workdays, buckets, unitLabel, currentLabel, projects, areas, contexts, categories, energy, tasks, heat };
  }

  function niceMaxHours(maxSecs) {
    const h = Math.max(1, maxSecs / 3600);
    const step = [1, 2, 5, 10, 20, 50, 100, 200].find(s => h / s <= 4) || 500;
    return Math.ceil(h / step) * step;
  }
  function levelOf(v, max) { if (!v || !max) return 0; return Math.min(5, Math.max(1, Math.ceil(v / max * 5))); }

  function Delta({ cur, prev, fmtV, period }) {
    if (!prev && !cur) return null;
    const diff = cur - prev;
    const Ic = diff > 0 ? I.ArrowUpOutlined : diff < 0 ? I.ArrowDownOutlined : I.MinusOutlined;
    return html`<${Text} type="secondary" style=${{ fontSize: 12 }}><${Ic} style=${{ fontSize: 11 }} /> ${diff > 0 ? '+' : diff < 0 ? '−' : ''}${fmtV(Math.abs(diff))} <span>vs ${period} anteriores</span><//>`;
  }

  function ChartCard({ title, icon, extra, table, empty, children }) {
    const [asTable, setAsTable] = useState(false);
    const toggle = table ? html`<${Tooltip} title=${asTable ? 'Ver gráfico' : 'Ver como tabela'}>

    return html`<${Card} size="small" style=${{ height: '100%' }}
      title=${html`<span style=${{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>${createElement(I[icon], { style: { color: 'var(--ct-text-3)' } })}${title}</span>`}
      extra=${html`<${Flex} align="center" gap=${4}>${extra}${toggle}<//>`}>
      <${Boundary} region=${'gráfico ' + title} resetKey=${asTable}>
        ${empty ? html`<${Empty} image=${Empty.PRESENTED_IMAGE_SIMPLE} description=${empty} />`
          : asTable ? html`<${Table} size="small" rowKey="key" pagination=${false} columns=${table.columns} dataSource=${table.data} scroll=${{ x: 'max-content' }} />`
          : children}
      <//>
    <//>`;
  }

  function HBarList({ rows, total, onOpen, lead, mode, sub }) {
    const max = Math.max(...rows.map(r => r.secs), 1);
    return html`<div style=${{ display: 'flex', flexDirection: 'column', gap: 2 }}>
      ${rows.map(r => html`<${Tooltip} key=${r.key} trigger=${['hover', 'focus']} placement="topLeft" title=${html`<span><b className="ct-mono">${fmtHM(r.secs)}</b> · ${pct(r.secs, total)} do total${sub ? ' · ' + sub(r) : ''}</span>`}>
        <button type="button" className="ct-hbar" onClick=${onOpen ? () => onOpen(r) : undefined} disabled=${!onOpen} aria-label=${`${r.name || r.key}: ${fmtHM(r.secs)}, ${pct(r.secs, total)}`}>
          <span className="ct-hbar-name">${lead(r)}</span>
          <span className="ct-hbar-track"><span className="ct-hbar-fill" style=${{ width: (r.secs / max * 100) + '%', background: CHART[mode].bar }}></span></span>
          <span className="ct-hbar-val ct-mono">${fmtHM(r.secs)}<span style=${{ color: 'var(--ct-text-3)', marginLeft: 6 }}>${pct(r.secs, total)}</span></span>
        </button>
      <//>`)}
    </div>`;
  }

  function ColumnChart({ buckets, mode, unitLabel, currentLabel }) {
    const maxH = niceMaxHours(Math.max(...buckets.map(b => b.secs), 0));
    const ticks = [maxH, maxH / 2, 0];
    const gap = buckets.length > 40 ? 1 : 2;
    return html`<div className="ct-colchart" role="img" aria-label=${`Tempo focado por ${unitLabel}. Destaque: ${currentLabel}.`}>
      <div className="ct-colchart-y">${ticks.map(t => html`<span key=${t} className="ct-mono">${t}h</span>`)}</div>
      <div>
        <div className="ct-colchart-plot" style=${{ gap }}>
          ${[0, 50].map(p => html`<span key=${p} className="ct-gridline" style=${{ top: p + '%' }}></span>`)}
          ${buckets.map((b, i) => { const last = i === buckets.length - 1;
            return html`<${Tooltip} key=${b.key} trigger=${['hover', 'focus']} title=${html`<span><b className="ct-mono">${fmtHM(b.secs)}</b> · ${b.title}${last ? ' (' + currentLabel + ')' : ''}</span>`}>
              <span className="ct-colslot" tabIndex=${0} aria-label=${`${b.title}: ${fmtHM(b.secs)}`}>
                <span className="ct-colbar" style=${{ height: (b.secs / 3600 / maxH * 100) + '%', background: last ? CHART[mode].bar : CHART[mode].muted }}></span>
              </span>
            <//>`; })}
        </div>
        <div className="ct-colchart-x" style=${{ gap }}>${buckets.map(b => html`<span key=${b.key}>${b.showLabel ? b.label : ''}</span>`)}</div>
      </div>
    </div>`;
  }

  function HeatLegend({ mode }) {
    return html`<${Flex} align="center" gap=${4} style=${{ fontSize: 12, color: 'var(--ct-text-3)' }}>Menos ${CHART[mode].seq.map((c, i) => html`<span key=${i} className="ct-heatcell" style=${{ background: c, width: 12, height: 12 }}></span>`)} Mais<//>`;
  }

  function HourHeatmap({ heat, mode }) {
    const max = Math.max(...heat.flat(), 1);
    const order = [1, 2, 3, 4, 5, 6, 0];
    return html`<div style=${{ overflowX: 'auto' }}>
      <div className="ct-hourheat" role="grid" aria-label="Tempo focado por dia da semana e hora">
        <span></span>${HOURS.map(h => html`<span key=${h} className="ct-heat-x">${h % 3 === 0 ? h + 'h' : ''}</span>`)}
        ${order.map(wd => [html`<span key=${'l' + wd} className="ct-heat-y">${WEEKDAYS[wd]}</span>`].concat(HOURS.map((h, j) => { const v = heat[wd][j];
          return html`<${Tooltip} key=${wd + '-' + h} trigger=${['hover', 'focus']} title=${html`<span><b className="ct-mono">${fmtHM(v)}</b> · ${WEEKDAYS[wd]}, ${h}h–${h + 1}h</span>`}>
            <span className="ct-heatcell" tabIndex=${0} role="gridcell" aria-label=${`${WEEKDAYS[wd]} ${h}h: ${fmtHM(v)}`} style=${{ background: CHART[mode].seq[levelOf(v, max)] }}></span>
          <//>`; })))}
      </div>
    </div>`;
  }

  function CalendarHeat({ daily, mode }) {
    const max = Math.max(...daily.map(x => x.secs), 1);
    const lead = (daily[0].d.day() + 6) % 7;
    const cells = Array.from({ length: lead }, () => null).concat(daily);
    const weeks = [];
    for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
    return html`<div style=${{ overflowX: 'auto' }}>
      <div className="ct-calheat">
        <div className="ct-calheat-y"><span></span>${['Seg', '', 'Qua', '', 'Sex', '', 'Dom'].map((l, i) => html`<span key=${i}>${l}</span>`)}</div>
        ${weeks.map((w, wi) => { const first = w.find(Boolean); const prevFirst = wi > 0 ? weeks[wi - 1].find(Boolean) : null;
          const month = first && (!prevFirst || first.d.month() !== prevFirst.d.month()) ? first.d.format('MMM') : '';
          return html`<div key=${wi} className="ct-calheat-col"><span className="ct-heat-x">${month}</span>
            ${Array.from({ length: 7 }, (_, k) => { const x = w[k];
              if (!x) return html`<span key=${k} className="ct-heatcell" style=${{ visibility: 'hidden' }}></span>`;

              <//>`; })}
          </div>`; })}
      </div>
    </div>`;
  }

              ${p.steps.map(k => { const sk = shown.skipped.includes(k); return html`<${Flex} key=${k} align="center" gap=${8} style=${{ padding: '4px 0' }}>

          <//>` : null}
        <//>
      </div>`;
    }

    const doneCount = Object.keys(rv.state).length;
    const elapsed = Math.max(1, Math.round((Date.now() - rv.startedAt) / 60000));
    const cur = rv.current;
    const step = REVIEW_STEPS[cur];
    const phaseOf = k => REVIEW_PHASES.find(p => p.steps.includes(k));
    const idx = REVIEW_ORDER.indexOf(cur);
    const goStep = k => setRv(r => ({ ...r, current: k }));
    const pause = () => { setRv(r => ({ ...r, paused: true })); message.info('Revisão pausada. Ela continua de onde parou.'); };

    const inbox = tasks.filter(t => t.status === 'inbox');
    const nexts = tasks.filter(t => t.status === 'proximas').sort((a, b) => (STALE_DAYS[b.id] || 0) - (STALE_DAYS[a.id] || 0));
    const waits = tasks.filter(t => t.status === 'aguardando').sort((a, b) => (STALE_DAYS[b.id] || 0) - (STALE_DAYS[a.id] || 0));
    const somedays = tasks.filter(t => t.status === 'someday');
    const until = dayjs(TODAY).add(14, 'day').format('YYYY-MM-DD');
    const upcoming = tasks.filter(t => t.due && t.due >= TODAY && t.due <= until && t.status !== 'finalizada').sort((a, b) => a.due.localeCompare(b.due));
    const upDays = Array.from(new Set(upcoming.map(t => t.due)));
    const activeProjects = projects.filter(p => p.status === 'active');
    const somedayProjects = projects.filter(p => p.status === 'someday');
    const emptyList = (text, icon) => html`<div className="ct-rvempty">${createElement(I[icon || 'CheckCircleOutlined'], { style: { color: STATUS.executando[mode][0], fontSize: 20 } })}<span>${text}</span></div>`;

    const bodies = {
      collect: html`<${Flex} vertical gap=${16}>
        <${Flex} gap=${6} wrap="wrap">${['Mesa e bolsos', 'Caixa de e-mail', 'Mensagens', 'Fotos e prints', 'Anotações em papel', 'Downloads', 'Navegador'].map(x => html`<${Tag} key=${x} bordered=${false}>${x}<//>`)}<//>
        <${CaptureBox} autoFocus placeholder="Anotar no Inbox" onAdd=${capture} items=${rv.collected} />
      <//>`,
      inbox: inbox.length ? html`<div>
          <${Text} type="secondary" style=${{ fontSize: 12, display: 'block', marginBottom: 8 }}>${inbox.length} ${inbox.length === 1 ? 'item' : 'itens'} · comece pelo mais antigo<//>
          ${inbox.map(t => html`<${RvRow} key=${t.id} t=${t} go=${go} meta=${t.due ? html`<${Text} type="secondary">prazo ${fmtDate(t.due)}<//>` : null}>
            <${Act} wide=${wide} icon="ForwardOutlined" label="Próxima" onClick=${() => { move(t, 'proximas'); bump('processed'); }} />
            <${Act} wide=${wide} icon="HourglassOutlined" label="Aguardando" onClick=${() => { move(t, 'aguardando'); bump('processed'); }} />
            <${Act} wide=${wide} icon="BulbOutlined" label="Someday" onClick=${() => { move(t, 'someday'); bump('processed'); }} />
            <${Act} wide=${wide} icon="CheckOutlined" label="Feito (< 2 min)" onClick=${() => { move(t, 'finalizada', 'Concluída: ' + t.name); bump('processed'); }} />
            <${Act} icon="DeleteOutlined" label="Excluir" danger onClick=${() => { setTasks(ts => ts.filter(x => x.id !== t.id)); bump('processed'); message.success('Excluída: ' + t.name); }} />
          <//>`)}
        </div>`
        : html`<${Result} status="success" icon=${html`<${I.CheckCircleFilled} style=${{ color: STATUS.executando[mode][0] }} />`} title="Inbox zero" subTitle="Tudo que chegou já tem lugar. Bom momento para seguir." style=${{ padding: '16px 0' }} />`,
      mind: html`<${Flex} vertical gap=${16}>
        <div><span className="ct-eyebrow">Gatilhos</span>
          <${Flex} gap=${6} wrap="wrap" style=${{ marginTop: 8 }}>${MIND_TRIGGERS.map(x => html`<${Tag} key=${x} bordered=${false}>${x}<//>`)}<//></div>
        <${CaptureBox} autoFocus placeholder="O que veio à cabeça?" onAdd=${capture} items=${rv.collected} />
      <//>`,
      next: nexts.length ? html`<div>${nexts.map(t => html`<${RvRow} key=${t.id} t=${t} go=${go} meta=${html`<${StaleChip} days=${STALE_DAYS[t.id]} limit=${14} mode=${mode} />`}>
          <${Act} wide=${wide} icon="CheckOutlined" label="Concluir" onClick=${() => move(t, 'finalizada', 'Concluída: ' + t.name)} />
          <${Act} wide=${wide} icon="BulbOutlined" label="Someday" onClick=${() => { move(t, 'someday'); bump('cleaned'); }} />
          <${Act} icon="DeleteOutlined" label="Excluir" danger onClick=${() => remove(t)} />
        <//>`)}</div>` : emptyList('Nenhuma próxima ação aberta.'),
      past: html`<${Flex} vertical gap=${16}>
        <div className="ct-rvtimeline">${PAST_WEEK.map(d => html`<div key=${d.day} className="ct-rvday">
          <span className="ct-eyebrow">${dayjs(d.day).format('ddd, DD/MM')}</span>
          ${d.items.map((x, i) => html`<${Flex} key=${i} align="center" gap=${8} style=${{ fontSize: 13, padding: '3px 0' }}>
            ${x.done ? html`<${I.CheckCircleOutlined} style=${{ color: STATUS.finalizada[mode][0] }} />` : x.event ? html`<${I.CalendarOutlined} style=${{ color: 'var(--ct-text-3)' }} />` : html`<${I.FieldTimeOutlined} style=${{ color: 'var(--ct-text-3)' }} />`}
            <span className="ct-ellipsis" style=${{ flex: 1 }}>${x.name}</span><span className="ct-mono" style=${{ color: 'var(--ct-text-3)', fontSize: 12 }}>${fmtShort(x.secs)}</span><//>`)}
        </div>`)}</div>
        <${CaptureBox} placeholder="Gerou alguma ação? Anote aqui" onAdd=${capture} items=${rv.collected} />
      <//>`,
      upcoming: html`<${Flex} vertical gap=${16}>
        ${upDays.length ? html`<div className="ct-rvtimeline">${upDays.map(d => html`<div key=${d} className="ct-rvday">
          <span className="ct-eyebrow">${dayjs(d).format('ddd, DD/MM')}${d === TODAY ? ' · hoje' : ''}</span>
          ${upcoming.filter(t => t.due === d).map(t => html`<${Flex} key=${t.id} align="center" gap=${8} style=${{ fontSize: 13, padding: '3px 0' }}>
            <${I.FlagOutlined} style=${{ color: 'var(--ct-text-3)' }} /><a className="ct-ellipsis" style=${{ flex: 1, color: 'var(--ct-text)' }} onClick=${() => go('tarefa')}>${t.name}</a>
            <${Chip} def=${STATUS[t.status]} mode=${mode} />${t.dueTime ? html`<span className="ct-mono" style=${{ fontSize: 12, color: 'var(--ct-text-3)' }}>${t.dueTime}</span>` : null}<//>`)}
        </div>`)}</div>` : emptyList('Nada marcado para as próximas duas semanas.', 'CalendarOutlined')}
        <${CaptureBox} placeholder="Precisa preparar algo? Anote a ação" onAdd=${capture} items=${rv.collected} />
      <//>`,
      waiting: waits.length ? html`<div>${waits.map(t => html`<${RvRow} key=${t.id} t=${t} go=${go}
          meta=${html`<${Text} type="secondary"><${I.UserOutlined} /> ${t.waiting || 'sem responsável'}<//><${StaleChip} days=${STALE_DAYS[t.id]} limit=${7} mode=${mode} />`}>
          <${Act} wide=${wide} icon="CheckOutlined" label="Recebi" onClick=${() => move(t, 'proximas', 'Voltou para Próximas: ' + t.name)} />
          <${Act} wide=${wide} icon="NotificationOutlined" label="Cobrar" onClick=${() => { capture(`Cobrar ${t.waiting || 'resposta'}: ${t.name}`); bump('chased'); message.success('Ação "Cobrar" criada no Inbox'); }} />
          <${Act} icon="BulbOutlined" label="Someday" onClick=${() => move(t, 'someday')} />
        <//>`)}</div>` : emptyList('Nada em Aguardando.'),
      projects: html`<div>${activeProjects.map(p => { const st = projectStats(p, tasks); const open = st.tasks.filter(t => t.status !== 'finalizada');

              <${Flex} gap=${10} wrap="wrap" align="center" style=${{ fontSize: 12 }}>
                <${Text} type="secondary" className="ct-mono">${st.done}/${st.total}<//>
                ${st.next ? html`<span style=${{ display: 'inline-flex', gap: 6, alignItems: 'center', minWidth: 0 }}><${I.ForwardOutlined} style=${{ color: STATUS.proximas[mode][0] }} /><span className="ct-ellipsis">${st.next.name}</span></span>`
                  : html`<${Chip} def=${{ icon: 'WarningOutlined', light: STATUS.aguardando.light, dark: STATUS.aguardando.dark }} mode=${mode}>Sem próxima ação<//>`}
              <//>
            </div>
            <${Flex} gap=${4} wrap="wrap" justify="flex-end">
              ${st.next ? null : html`<${Select} size="small" placeholder="Definir próxima ação" style=${{ width: 220 }} aria-label=${'Próxima ação de ' + p.name}
                options=${open.map(t => ({ value: t.id, label: t.name }))} notFoundContent="Nenhuma tarefa aberta"
                onChange=${id => { setTasks(ts => ts.map(x => x.id === id ? { ...x, status: 'proximas' } : x)); bump('nextSet'); message.success('Próxima ação definida'); }} />`}
              <${Dropdown} trigger=${['click']} menu=${{ items: [{ key: 'someday', icon: createElement(I.BulbOutlined), label: 'Mover para someday' }, { key: 'done', icon: createElement(I.CheckCircleOutlined), label: 'Marcar como concluído' }],
                onClick: ({ key }) => { setProjects(ps => ps.map(x => x.id === p.id ? { ...x, status: key } : x)); message.success(p.name + ': ' + PROJECT_STATUS[key].label); } }}>
                <${Button} size="small" type="text" aria-label="Mais ações" icon=${html`<${I.EllipsisOutlined} />`} /><//>
            <//>
          </div>`; })}</div>`,
      someday: somedays.length || somedayProjects.length ? html`<div>
          ${somedayProjects.map(p => html`<div key=${'p' + p.id} className="ct-rvrow">
            <${Flex} align="center" gap=${8} style=${{ flex: 1, minWidth: 0 }}><${I.FolderOutlined} style=${{ color: 'var(--ct-text-3)' }} /><span className="ct-dot" style=${{ background: p.color }}></span><span className="ct-ellipsis" style=${{ fontWeight: 500 }}>${p.name}</span><${Text} type="secondary" style=${{ fontSize: 12 }}>projeto<//><//>
            <${Act} wide=${wide} icon="PlayCircleOutlined" label="Ativar" onClick=${() => { setProjects(ps => ps.map(x => x.id === p.id ? { ...x, status: 'active' } : x)); message.success(p.name + ' ativado. Defina a próxima ação no passo Projetos.'); }} />
          </div>`)}
          ${somedays.map(t => html`<${RvRow} key=${t.id} t=${t} go=${go}>
            <${Act} wide=${wide} icon="PlayCircleOutlined" label="Ativar" onClick=${() => move(t, 'proximas')} />
            <${Act} icon="DeleteOutlined" label="Excluir" danger onClick=${() => remove(t)} />
          <//>`)}
        </div>` : emptyList('A lista someday está vazia.', 'BulbOutlined'),
      creative: html`<${Flex} vertical gap=${12}>
        <${Input.TextArea} autoSize=${{ minRows: 4, maxRows: 10 }} placeholder=${'Uma ideia por linha.\nEx.: Curso de liderança em 2027'} value=${rv.ideas || ''} onChange=${e => setRv(r => ({ ...r, ideas: e.target.value }))} aria-label="Ideias" />
        <${Flex} gap=${8} wrap="wrap">
          <${Button} icon=${html`<${I.InboxOutlined} />`} disabled=${!(rv.ideas || '').trim()} onClick=${() => { const lines = (rv.ideas || '').split('\n').map(x => x.trim()).filter(Boolean); lines.forEach(capture); setRv(r => ({ ...r, ideas: '' })); message.success(lines.length + (lines.length === 1 ? ' ideia foi' : ' ideias foram') + ' para o Inbox'); }}>Mandar para o Inbox<//>
          <${Button} type="link" icon=${html`<${I.RiseOutlined} />`} onClick=${() => go('horizontes')}>Rever áreas e metas<//>
        <//>
      <//>`
    };

    const summary = [
      ['Inbox', `${rv.base.inbox} → ${health.inbox}`],
      ['Coletados', rv.collected.length],
      ['Itens processados', rv.counters.processed],
      ['Projetos com próxima ação nova', rv.counters.nextSet],
      ['Cobranças criadas', rv.counters.chased],
      ['Tarefas tiradas das listas', rv.counters.cleaned]
    ];
    const skipped = REVIEW_ORDER.filter(k => rv.state[k] === 'skipped');
    const pending = REVIEW_ORDER.filter(k => !rv.state[k]);
    const finish = () => {
      const save = () => {
        setHistory(h => [{ id: Date.now(), date: TODAY, start: dayjs(rv.startedAt).format('HH:mm'), mins: elapsed, steps: REVIEW_ORDER.filter(k => rv.state[k] === 'done').length, skipped: REVIEW_ORDER.filter(k => rv.state[k] !== 'done'), inboxZero: health.inbox === 0, notes: rv.notes }].concat(h));
        setRv(null); message.success('Revisão registrada. Até a próxima semana.');
      };
      if (pending.length) modal.confirm({ title: `Concluir com ${pending.length} passo${pending.length > 1 ? 's' : ''} sem marcar?`, content: 'Eles ficam registrados como pulados. Tudo bem: uma revisão parcial vale mais que nenhuma.', okText: 'Concluir assim', cancelText: 'Voltar', onOk: save });
      else save();
    };
    const finishBody = html`<${Flex} vertical gap=${16}>
      <div className="ct-rvsummary">${summary.map(([l, v]) => html`<div key=${l}><div className="ct-tile-figure" style=${{ fontSize: 22 }}>${v}</div><${Text} type="secondary" style=${{ fontSize: 12 }}>${l}<//></div>`)}</div>
      ${skipped.length || pending.length ? html`<${Alert} type="info" showIcon message=${`${skipped.length + pending.length} passo${skipped.length + pending.length > 1 ? 's' : ''} sem marcar: ${skipped.concat(pending).map(k => REVIEW_STEPS[k].label.toLowerCase()).join(', ')}.`} />` : null}
      <${Text} type="secondary">Duração: ${elapsed} min.<//>
    <//>`;

    const stepItems = phase => phase.steps.map(k => { const s = rv.state[k];
      return { title: html`<span style=${{ fontSize: 13 }}>${REVIEW_STEPS[k].label}${REVIEW_STEPS[k].isNew ? html` <${NewTag} />` : null}</span>`, status: s === 'done' ? 'finish' : k === cur ? 'process' : 'wait',
        description: s === 'skipped' ? 'Pulado' : null, icon: s === 'skipped' ? html`<${I.MinusCircleOutlined} style=${{ color: 'var(--ct-text-3)' }} />` : undefined }; });
    const rail = html`<nav className="ct-rvrail" aria-label="Passos da revisão">
      ${REVIEW_PHASES.map((p, pi) => html`<div key=${p.key}>
        <div className="ct-eyebrow" style=${{ margin: pi ? '12px 0 6px' : '0 0 6px' }}>${pi + 1} · ${p.label}</div>
        <${Steps} direction="vertical" size="small" current=${p.steps.indexOf(cur)} items=${stepItems(p)} onChange=${i => goStep(p.steps[i])} />
      </div>`)}
      <${Button} block type=${cur === 'finish' ? 'primary' : 'default'} ghost=${cur === 'finish'} icon=${html`<${I.FlagOutlined} />`} onClick=${() => goStep('finish')} style=${{ marginTop: 8 }}>Fechar a revisão<//>
    </nav>`;
    const mobileNav = html`<${Select} value=${cur} onChange=${goStep} style=${{ width: '100%' }} aria-label="Passo"
      options=${REVIEW_PHASES.map(p => ({ label: p.label, options: p.steps.map(k => ({ value: k, label: (rv.state[k] === 'done' ? '✓ ' : rv.state[k] === 'skipped' ? '– ' : '') + REVIEW_STEPS[k].label })) })).concat([{ label: 'Fim', options: [{ value: 'finish', label: 'Fechar a revisão' }] }])} />`;

    const panel = html`<${Card} size="small" styles=${{ header: { paddingBlock: 12 } }}
      title=${cur === 'finish' ? html`<${Flex} vertical gap=${2}><span className="ct-eyebrow">Fim</span><span style=${{ fontSize: 17 }}>Fechar a revisão</span><//>`
        : html`<${Flex} vertical gap=${2}><span className="ct-eyebrow">${phaseOf(cur).label} · passo ${idx + 1} de 10</span>
          <span style=${{ fontSize: 17, display: 'inline-flex', alignItems: 'center', gap: 8 }}>${createElement(I[step.icon], { style: { color: 'var(--ct-primary)' } })}${step.label}</span><//>`}
      extra=${cur !== 'finish' && step.open ? html`<${Button} size="small" type="link" icon=${html`<${I.ExportOutlined} />`} onClick=${() => { message.info(step.open[1] + '. A revisão continua aqui.'); go(step.open[0]); }}>${screens.md ? 'Abrir a tela' : null}<//>` : null}>
      <${Flex} vertical gap=${16}>
        ${cur === 'finish' ? null : html`<${Text} type="secondary" style=${{ fontSize: 14 }}>${step.q}<//>`}
        <${Boundary} region=${'passo ' + (step ? step.label : 'fim')} resetKey=${cur}>${cur === 'finish' ? finishBody : bodies[cur]}<//>
        <${Divider} style=${{ margin: '4px 0' }} />
        <${Flex} gap=${8} justify="space-between" wrap="wrap" align="center">
          ${cur === 'finish' || idx === 0 ? html`<span></span>` : html`<${Button} type="text" icon=${html`<${I.ArrowLeftOutlined} />`} onClick=${() => goStep(REVIEW_ORDER[idx - 1])}>Anterior<//>`}
          ${cur === 'finish'
            ? html`<${Button} type="primary" icon=${html`<${I.CheckOutlined} />`} onClick=${finish}>Concluir revisão<//>`
            : html`<${Space}>
              <${Button} onClick=${() => markStep(cur, 'skipped')}>Pular<//>
              <${Tooltip} title="Ctrl+Enter"><${Button} type="primary" icon=${html`<${I.CheckOutlined} />`} onClick=${() => markStep(cur, 'done')}>Concluir passo<//><//>
            <//>`}
        <//>
      <//>
    <//>`;

    const side = html`<${Flex} vertical gap=${16}>
      <${Card} size="small" title="Sistema nesta revisão">
        <${Flex} vertical gap=${6}>
          ${[['Inbox', 'inbox', 'InboxOutlined'], ['Projetos sem próxima ação', 'noNext', 'ForwardOutlined'], ['Aguardando > 7 dias', 'waiting', 'HourglassOutlined'], ['Próximas > 14 dias', 'next', 'ClockCircleOutlined']].map(([l, k, ic]) => { const a = rv.base[k], b = health[k];
            return html`<${Flex} key=${k} align="center" gap=${8} style=${{ fontSize: 13 }}>
              ${createElement(I[ic], { style: { color: 'var(--ct-text-3)' } })}<span style=${{ flex: 1 }}>${l}</span>
              <span className="ct-mono" style=${{ color: 'var(--ct-text-3)' }}>${a}</span><${I.ArrowRightOutlined} style=${{ fontSize: 10, color: 'var(--ct-text-3)' }} />
              <span className="ct-mono" style=${{ fontWeight: 600, minWidth: 16, textAlign: 'right' }}>${b}</span>
              ${b === 0 ? html`<${I.CheckCircleFilled} style=${{ color: STATUS.executando[mode][0] }} aria-label="Em dia" />` : html`<span style=${{ width: 14 }}></span>`}
            <//>`; })}
        <//>
      <//>
      <${Card} size="small" title="Notas da revisão" extra=${html`<${Text} type="secondary" style=${{ fontSize: 12 }}>salvas sozinhas<//>`}>
        <${Input.TextArea} autoSize=${{ minRows: 3, maxRows: 8 }} placeholder="Observações, decisões, foco da próxima semana" value=${rv.notes} onChange=${e => setRv(r => ({ ...r, notes: e.target.value }))} aria-label="Notas da revisão" />
      <//>
    <//>`;

    return html`<div className=${isMobile ? 'ct-page-narrow' : 'ct-page'}>
      <${Flex} align="center" gap="8px 16px" wrap="wrap" style=${{ marginBottom: 16 }}>
        <${Flex} vertical style=${{ flex: '1 1 260px', minWidth: 0 }}>
          <span style=${{ fontSize: 20, fontWeight: 600 }}>Revisão da semana ${dayjs(TODAY).format('DD/MM')}</span>
          <${Text} type="secondary" style=${{ fontSize: 12 }}>Começou há ${elapsed} min · tudo fica salvo, pode sair e voltar<//>
        <//>
        <${Flex} align="center" gap=${8} style=${{ flex: '0 1 280px', minWidth: 180 }}>
          <${Progress} percent=${Math.round(doneCount / 10 * 100)} showInfo=${false} size="small" style=${{ flex: 1, margin: 0 }} aria-label="Progresso da revisão" />

            </div>
          </div>`
        : html`<${Flex} vertical gap=${12}>${mobileNav}${panel}${side}<//>`}
    </div>`;

  const CAL_NOW = '16:20';
  const CAL_RANGE = [7, 22];
  const WORKDAY_H = 8;
  const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };

    { id: 11, kind: 'block', task: 731, date: '2026-11-18', start: '09:30', end: '11:00' },
    { id: 12, kind: 'block', task: 705, date: '2026-11-19', start: '09:00', end: '09:15' },

  const CAL_SESSIONS = [

    { task: 711, date: '2026-11-16', start: '13:42', end: '14:04' },

  const CAL_ALLDAY = [

    { id: 'a2', kind: 'scheduled', task: 709, date: '2026-11-21' }
  ];
  const CAL_SHOW = [
    { key: 'block', label: 'Blocos de tempo', swatch: 'block' },
    { key: 'event', label: 'Tarefas com horário', swatch: 'event' },
    { key: 'scheduled', label: 'Agendadas sem horário', swatch: 'chip' },
