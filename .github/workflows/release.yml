name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ] || fail "$TAG não é uma tag anotada."

          commit=$(git rev-list -n1 "$TAG")
          git merge-base --is-ancestor "$commit" origin/production || fail "$TAG não está em production."
          git cat-file -e "$commit:docs/releases/$TAG.md" 2>/dev/null || fail "Falta a página docs/releases/$TAG.md no commit da tag."

          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # O node-gyp 9 do electron-builder compila o node-pty com um gyp que importa distutils,
      # removido no Python 3.12.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - run: npm ci

      - name: Aplicar versão da tag
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Gerar .deb e AppImage
        env:
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: npm run build && npx electron-builder --linux --publish never

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: dist/

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: git-cliff

      - name: Montar notas da release
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          owner=${REPO%%/*}
          name=${REPO#*/}
          docs="https://${owner,,}.github.io/${name}/releases/${TAG}/"
          base="https://github.com/${REPO}/releases/download/${TAG}"
          {
            git show "$TAG:docs/releases/$TAG.md" | sed '1{/^# /d}'
            echo
            echo "## Downloads"
            echo
            echo "| Pacote | Arquivo | Instalação |"
            echo "| --- | --- | --- |"
            echo "| Debian / Ubuntu | [crafytask-${VERSION}.deb](${base}/crafytask-${VERSION}.deb) | \`sudo apt install ./crafytask-${VERSION}.deb\` |"
            echo "| Qualquer Linux | [crafytask-${VERSION}.AppImage](${base}/crafytask-${VERSION}.AppImage) | \`chmod +x crafytask-${VERSION}.AppImage && ./crafytask-${VERSION}.AppImage\` |"
            echo
            echo "## Alterações"
            echo
            git cliff --latest --strip all | sed '1{/^## /d}'
            echo
            echo "---"
            echo
            echo "Página completa desta versão: ${docs}"
          } > notes.md
          cat notes.md

      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md --latest
