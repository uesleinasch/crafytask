name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ] || fail "$TAG não é uma tag anotada."

          commit=$(git rev-list -n1 "$TAG")
          git merge-base --is-ancestor "$commit" origin/production || fail "$TAG não está em production."
          git cat-file -e "$commit:docs/releases/$TAG.md" 2>/dev/null || fail "Falta a página docs/releases/$TAG.md no commit da tag."

          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # O node-gyp 9 do electron-builder compila o node-pty com um gyp que importa distutils,
      # removido no Python 3.12.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - run: npm ci

      - name: Aplicar versão da tag
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Gerar .deb e AppImage
        env:
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: npm run build && npx electron-builder --linux --publish never

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist/

      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: git-cliff

      - name: Montar notas da release
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          owner=${REPO%%/*}
          name=${REPO#*/}
          docs="https://${owner,,}.github.io/${name}/releases/${TAG}/"
          base="https://github.com/${REPO}/releases/download/${TAG}"
          {
            git show "$TAG:docs/releases/$TAG.md" | sed '1{/^# /d}'
            echo
            echo "## Downloads"
            echo
            echo "| Pacote | Arquivo | Instalação |"
            echo "| --- | --- | --- |"
            echo "| Debian / Ubuntu | [crafytask-${VERSION}.deb](${base}/crafytask-${VERSION}.deb) | \`sudo apt install ./crafytask-${VERSION}.deb\` |"
            echo "| Qualquer Linux | [crafytask-${VERSION}.AppImage](${base}/crafytask-${VERSION}.AppImage) | \`chmod +x crafytask-${VERSION}.AppImage && ./crafytask-${VERSION}.AppImage\` |"
            echo
            echo "## Alterações"
            echo
            git cliff --latest --strip all | sed '1{/^## /d}'
            echo
            echo "---"
            echo
            echo "Página completa desta versão: ${docs}"
          } > notes.md
          cat notes.md

      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md --latest
